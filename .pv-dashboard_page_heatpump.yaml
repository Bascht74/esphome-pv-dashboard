              - obj: { x: 0, y: 312, width: 482, height: 1, bg_color: $col_line, bg_opa: COVER, border_width: 0, radius: 0, pad_all: 0, clickable: false, scrollable: false }
              - label: { x: 0, y: 326, width: 240, height: 20, long_mode: DOT, text: "Ventilatoren Zu / Ab in %", text_font: f_text_s, text_color: $col_ink2 }
              - label: { id: hp_fans, x: 250, y: 324, width: 232, height: 25, long_mode: DOT, text_align: RIGHT, text: "-- / --", text_font: f_val_m, text_color: $col_ink }
              - obj: { x: 0, y: 359, width: 482, height: 1, bg_color: $col_line, bg_opa: COVER, border_width: 0, radius: 0, pad_all: 0, clickable: false, scrollable: false }
              - label: { x: 0, y: 373, width: 240, height: 20, long_mode: DOT, text: "Filterwechsel in Tagen", text_font: f_text_s, text_color: $col_ink2 }
              - label: { id: hp_filter, x: 250, y: 371, width: 232, height: 25, long_mode: DOT, text_align: RIGHT, text: "--", text_font: f_val_m, text_color: $col_ink }

        # ---------------- Strom ------------------------------------------
        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            scrollable: false
            scroll_dir: NONE
            x: 772
            y: 524
            width: 504
            height: 212
            widgets:
              - label: { x: 0, y: 0, width: 482, height: 17, long_mode: DOT, styles: st_label, text: "STROM" }
              - label: { x: 0, y: 48, width: 236, height: 20, long_mode: DOT, text_align: CENTER, text: "Leistungsaufnahme", text_font: f_text_s, text_color: $col_ink3 }
              - label: { id: hp_power, x: 0, y: 74, width: 236, height: 39, long_mode: DOT, text_align: CENTER, text: "-,--", text_font: f_val_xl, text_color: $col_ink }
              - label: { x: 0, y: 115, width: 236, height: 17, long_mode: DOT, text_align: CENTER, styles: st_unit, text: "kW" }
              - label: { x: 246, y: 48, width: 236, height: 20, long_mode: DOT, text_align: CENTER, text: "Verbrauch heute", text_font: f_text_s, text_color: $col_ink3 }
              - label: { id: hp_energy, x: 246, y: 74, width: 236, height: 39, long_mode: DOT, text_align: CENTER, text: "--,-", text_font: f_val_xl, text_color: $col_ink }
              - label: { x: 246, y: 115, width: 236, height: 17, long_mode: DOT, text_align: CENTER, styles: st_unit, text: "kWh" }
