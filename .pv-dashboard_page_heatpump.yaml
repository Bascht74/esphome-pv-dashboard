                  x: 454
                  y: 350
                  width: 110
                  height: 120
                  radius: 14
                  bg_color: $col_nilan_tank
                  bg_opa: COVER
                  border_color: $col_nilan_tank_edge
                  border_width: 2
                  pad_all: 0
                  scrollbar_mode: 'off'
                  scrollable: false
                  scroll_dir: NONE
                  widgets:
                    - label: { align: TOP_MID, y: 8, text: "\U000F09A1", text_font: f_icon, text_color: $col_ink3 }
                    - label: { id: hp_dhw, x: 0, y: 40, width: 110, height: 30, long_mode: DOT, text_align: CENTER, text: "--,-", text_font: f_val_l, text_color: $col_ink }
                    - label: { x: 0, y: 72, width: 110, height: 17, long_mode: DOT, text_align: CENTER, text: "°C", text_font: f_unit, text_color: $col_ink }
                    - obj: { x: 15, y: 98, width: 80, height: 2, radius: 1, bg_color: $col_ink, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false, scrollable: false }
                    - obj: { id: hp_dhw_dot, x: 94, y: 50, width: 10, height: 10, radius: 5, bg_color: $col_crit, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false, scrollable: false, hidden: true }
              - label: { id: hp_dhw_label, x: 439, y: 476, width: 140, height: 17, long_mode: DOT, text_align: CENTER, text: "Warmwasser", text_font: f_unit, text_color: $col_ink }

              # Luefter: runde Taste wie im Bedienteil, darunter die Stufe
              - obj:
                  x: 640
                  y: 330
                  width: 72
                  height: 72
                  radius: CIRCLE
                  bg_color: $col_nilan_button
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: 'off'
                  scrollable: false
                  scroll_dir: NONE
                  widgets:
                    - label: { align: CENTER, text: "\U000F0210", text_font: f_icon, text_color: $col_bg }
              - label: { id: hp_fan, x: 616, y: 410, width: 120, height: 17, long_mode: DOT, text_align: CENTER, text: "Stufe -", text_font: f_unit, text_color: $col_ink }
              # Ventilatoren in % (heatpump_extra): 429..446 und 448..465
              - label: { id: hp_fan_in, x: 616, y: 429, width: 120, height: 17, long_mode: DOT, text_align: CENTER, text: "Zuluft -- %", styles: st_unit }
              - label: { id: hp_fan_out, x: 616, y: 448, width: 120, height: 17, long_mode: DOT, text_align: CENTER, text: "Abluft -- %", styles: st_unit }
              # Enteisung und Legionellenschutz unter dem Haus (heatpump_extra),
              # 560..580, nur wenn eins davon laeuft
              - label: { id: hp_flags, x: 0, y: 560, width: 738, height: 20, long_mode: DOT, text_align: CENTER, text: "", text_font: f_text_s, text_color: $col_warn, hidden: true }

              - label: { id: hp_stand, x: 0, y: 600, width: 738, height: 17, long_mode: DOT, text_align: CENTER, text: "Stand --:--", styles: st_unit }

        # ---------------- Information wie hinter der Info-Taste ----------
        # Acht Zeilen, Zeile i ab y 30 + 47 i: Beschriftung f_text_s (20)
        # bei + 14, Wert f_val_m (25) rechtsbuendig bei + 12, Linie bei
        # + 47; die letzte endet bei 396 von 410.
        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            scrollable: false
            scroll_dir: NONE
            x: 772
            y: 84
            width: 504
            height: 432
            widgets:
              - label: { x: 0, y: 0, width: 482, height: 17, long_mode: DOT, styles: st_label, text: "INFORMATION" }
              - label: { x: 0, y: 44, width: 240, height: 20, long_mode: DOT, text: "Betriebsart Lüftung", text_font: f_text_s, text_color: $col_ink2 }
