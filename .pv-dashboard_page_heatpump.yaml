##############################################################################
# Package: Seite 7 -- Waermepumpe (Nilan Compact P)
#
# Der Nutzer hat das klassische Bedienteil CTS700 mit zwei Textzeilen
# (25.09.2026); die Werte kommen deshalb aus dessen Registersatz (docs/06).
# Dargestellt wird trotzdem grafisch, auf seinen Wunsch: Aufbau nach der
# Startseite des Touch-Bedienteils der Nilan Compact P, wie sie die Nilan-
# Bedienungsanleitung "CTS700 Touch, Compact P / Compact P Polar"
# (Version 1.10) zeigt: blaugrauer Grund, gruenes Haus, die
# Aussentemperatur mit Sonne, im Dach die Raumtemperatur (gemessen in der
# Abluft), in der Hauswand Luftfeuchte, CO2 und die Warmwasserkachel mit
# rotem Punkt fuer die Zusatzheizung, dazu die runde Lueftertaste mit der
# Lueftungsstufe. Seit 25.09.2026 frei angeordnet statt genau nach Nilan
# (Wunsch des Nutzers): Symbol direkt links vom Wert, die Aussentemperatur
# links neben dem Dach auf einer Zeile mit der Raumtemperatur, in der Wand
# oben die Raumluft (Feuchte, CO2), unten die Technik (Luefter, Warmwasser).
# CO2, Jahreszeit und Alarm hat der klassische Satz nicht;
# sie bleiben leer bzw. ausgeblendet, bis eine andere Quelle sie liefert. Den blaugrauen Grund hat der Nutzer am 24.09.2026 gegen
# den Dashboard-Grund getauscht; Haus und Kachel sind dafuer abgedunkelt
# (col_nilan_*, .pv-dashboard_utility.yaml). Das Nilan-Logo ist bewusst
# nicht nachgebaut.
#
# Rechts im Dashboard-Stil, was das Bedienteil hinter der Info-Taste
# zeigt (Betriebsart, Sommer/Winter, Bypass, Kompressor), dazu Zu- und
# Fortluft, Ventilatoren, Filterwechsel und die elektrischen Werte der
# Festlegung vom 30.07.2026. Die Compact P heizt Luft und Warmwasser,
# sie hat keinen Heizwasserkreis: Vorlauf, Ruecklauf und COP der
# Festlegung entfallen (docs/06).
#
# heatpump_update und heatpump_extra gehoeren dazu; kuenftige Sensoren
# (Home Assistant oder Modbus, docs/01) rufen nur diese auf, bis dahin
# stehen Striche.
#
# Flaeche x 4..1276, y 84..736.
#   Nilan-Kachel x 4, 760 x 652, innen 738 x 630
#     Titel, Warnsymbol   0..24
#     Haus               40..530  (Flaechen 544 breit bei x 178: Spitze 450/40,
#                                  Traufe 240, Wand 178..722)
#     Aussen, Raum      160..218  eine Zeile: Wert f_val_xl 39 + 2 + Einheit
#                                 17; Aussen x 80..202 links vom Dach, Raum
#                                 x 374..526 im Dach, mittig auf 450
#     Raumluft          272..321  Feuchte, CO2 (Flex, Mitten 330 / 570 bzw.
#                                 450 ohne CO2), Wert f_val_l 30 + 2 + 17
#     Technik           353..498  Luefter Mitte 330: Kreis 353..425, Stufe,
#                                 Zu- und Abluft 433..488; Warmwasser Mitte
#                                 570: Kachel 353..473, Beschriftung 481..498
#     Hinweise          554..574  Enteisung, Legionellenschutz
#     Stand             600..617
#   Info-Kachel  x 772, 504 x 432, innen 482 x 410: Titel 0..17, acht
#                Zeilen im Raster 47 ab 30 (Wert f_val_m 25), letzte
#                endet 396
#   Strom-Kachel x 772, y 524, 504 x 212, innen 482 x 190: zwei Spalten
#                je 236, Wert 74..113, Einheit 115..132
#
# Der Titel nimmt name_heatpump; der Standard dazu steht in
# .pv-dashboard_page_overview.yaml (das Paket ist immer dabei).
##############################################################################

script:
  # ---------------------------------------------------------------------
  # Werte der Compact P. Kuenftige Sensoren rufen nur dieses Skript auf.
  #   outdoor    Aussentemperatur in °C
  #   room       Raumtemperatur in °C (Abluft oder externer Fuehler)
  #   humidity   Luftfeuchte in % (Mittel der letzten 24 h, wie das
  #              Bedienteil)
  #   co2        CO2 in ppm; NAN blendet die Gruppe aus wie das Bedienteil
  #              ohne CO2-Sensor
  #   dhw        Warmwassertemperatur in °C
  #   eheat      true = elektrische Zusatzheizung im Warmwasser aktiv
  #   fan        Lueftungsstufe 0..4 (0 = aus), < 0 = unbekannt
  #   vent_mode  Betriebsart Lueftung, z. B. "Auto"
  #   season     "Sommer" / "Winter"
  #   bypass     z. B. "Offen" / "Geschlossen"
  #   compressor Kompressorbetrieb, z. B. "Warmwasser", "Aus"
  #   supply     Zulufttemperatur in °C
  #   exhaust    Fortlufttemperatur in °C
  #   power      elektrische Leistungsaufnahme in kW
  #   energy     elektrischer Verbrauch heute in kWh
  #   alarm      0 = nichts, 1 = Warnhinweis (gelb), 2 = Alarm (rot)
  #   Texte "" und NAN = kein Wert (Striche)
  # ---------------------------------------------------------------------
  - id: heatpump_update
    parameters:
      outdoor: float
      room: float
      humidity: float
      co2: float
      dhw: float
      eheat: bool
      fan: int
      vent_mode: string
      season: string
      bypass: string
      compressor: string
      supply: float
      exhaust: float
      power: float
      energy: float
      alarm: int
    then:
      - lambda: |-
          id(data_seen)[3] = millis();  // Datenalter, sys_refresh
          auto &fmt = id(fmt_num);  // Dezimalkomma, .pv-dashboard_ui.yaml
          auto show = [](lv_obj_t *o, bool on) {
            if (on)
              lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          auto txt = [](const std::string &s) -> const char * { return s.empty() ? "--" : s.c_str(); };
          lv_label_set_text(id(hp_outdoor), fmt(outdoor, "%.1f", "--,-").c_str());
          lv_label_set_text(id(hp_room), fmt(room, "%.1f", "--,-").c_str());
          lv_label_set_text(id(hp_humidity), fmt(humidity, "%.0f", "--").c_str());
          show(id(hp_co2_group), std::isfinite(co2));
          lv_label_set_text(id(hp_co2), fmt(co2, "%.0f", "---").c_str());
          lv_label_set_text(id(hp_dhw), fmt(dhw, "%.1f", "--,-").c_str());
          // Zweitzeile im Schema der Uebersicht: die Compact P hat keinen
          // COP, dort steht die Warmwassertemperatur (86 von 94 px)
          lv_label_set_text(id(d_heatpump), ("kW · WW " + fmt(dhw, "%.0f", "--") + "°C").c_str());
          show(id(hp_dhw_dot), eheat);
          if (fan < 0)
            lv_label_set_text(id(hp_fan), "Stufe -");
          else if (fan == 0)
            lv_label_set_text(id(hp_fan), "Aus");
          else
            lv_label_set_text_fmt(id(hp_fan), "Stufe %d", fan);
          lv_label_set_text(id(hp_vent_mode), txt(vent_mode));
          lv_label_set_text(id(hp_season), txt(season));
          lv_label_set_text(id(hp_bypass), txt(bypass));
          lv_label_set_text(id(hp_compressor), txt(compressor));
          lv_label_set_text(id(hp_supply), fmt(supply, "%.1f", "--,-").c_str());
          lv_label_set_text(id(hp_exhaust), fmt(exhaust, "%.1f", "--,-").c_str());
          lv_label_set_text(id(hp_power), fmt(power, "%.2f", "-,--").c_str());
          lv_label_set_text(id(hp_energy), fmt(energy, "%.1f", "--,-").c_str());
          // Warnsymbol wie im Bedienteil: gelb = Hinweis, rot = Alarm
          show(id(hp_alarm), alarm > 0);
          lv_obj_set_style_text_color(id(hp_alarm), alarm > 1 ? lv_color_hex($col_crit) : lv_color_hex($col_warn), 0);
          auto now = id(dash_time).now();
          if (now.is_valid())
            lv_label_set_text_fmt(id(hp_stand), "Stand %02d:%02d", now.hour, now.minute);

  # ---------------------------------------------------------------------
  # Weitere Werte der Compact P aus dem Registersatz des klassischen
  # CTS700 (Adressen in docs/06, dort auch, was davon unsicher ist):
  #   room_set     Raum-Sollwert in °C
  #   dhw_set      Warmwasser-Sollwert in °C
  #   fan_supply   Zuluftventilator in %
  #   fan_extract  Abluftventilator in %
  #   filter_days  Tage bis zum Filterwechsel, < 0 = unbekannt
  #   defrost      true = Enteisung laeuft (Waermetauscher oder -pumpe)
  #   legionella   true = Legionellenschutz laeuft
  #   NAN = kein Wert (Striche)
  # ---------------------------------------------------------------------
  - id: heatpump_extra
    parameters:
      room_set: float
      dhw_set: float
      fan_supply: float
      fan_extract: float
      filter_days: int
      defrost: bool
      legionella: bool
    then:
      - lambda: |-
          auto &fmt = id(fmt_num);  // Dezimalkomma, .pv-dashboard_ui.yaml
          lv_label_set_text(id(hp_room_unit), ("°C Raum · Soll " + fmt(room_set, "%.1f", "--")).c_str());
          lv_label_set_text(id(hp_dhw_label), ("Warmwasser · Soll " + fmt(dhw_set, "%.0f", "--")).c_str());
          lv_label_set_text(id(hp_fan_in), ("Zuluft " + fmt(fan_supply, "%.0f", "--") + " %").c_str());
          lv_label_set_text(id(hp_fan_out), ("Abluft " + fmt(fan_extract, "%.0f", "--") + " %").c_str());
          lv_label_set_text(id(hp_fans), (fmt(fan_supply, "%.0f", "--") + " / " + fmt(fan_extract, "%.0f", "--")).c_str());
          if (filter_days < 0)
            lv_label_set_text(id(hp_filter), "--");
          else
            lv_label_set_text_fmt(id(hp_filter), "%d", filter_days);
          lv_obj_set_style_text_color(id(hp_filter), filter_days >= 0 && filter_days <= 7 ? lv_color_hex($col_warn) : lv_color_hex($col_ink), 0);
          std::string f;
          if (defrost)
            f = "Enteisung aktiv";
          if (legionella)
            f += f.empty() ? "Legionellenschutz aktiv" : " · Legionellenschutz aktiv";
          lv_label_set_text(id(hp_flags), f.c_str());
          if (f.empty())
            lv_obj_add_flag(id(hp_flags), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_clear_flag(id(hp_flags), LV_OBJ_FLAG_HIDDEN);

lvgl:
  pages:
    - id: page_heatpump
      bg_color: $col_bg
      scrollable: false
      scroll_dir: NONE
      widgets:
        # ---------------- Startseite wie das CTS700 Touch ----------------
        - obj:
            id: hp_tile_main
            styles: st_tile
            scrollbar_mode: 'off'
            scrollable: false
            scroll_dir: NONE
            x: 4
            y: 84
            width: 760
            height: 652
            widgets:
              - label: { x: 0, y: 0, width: 600, height: 17, long_mode: DOT, styles: st_label, text: "${ name_heatpump | upper }" }
              - label: { id: hp_alarm, x: 714, y: 0, text: "\U000F0026", text_font: f_icon, text_color: $col_warn, hidden: true }

              # Raster: Symbol 24 + Abstand 8 + Wert, Einheit 2 unter dem
              # Wert, beide linksbuendig. Das Symbol steht mittig zur Zeile
              # des Werts (f_val_xl + 8, f_val_l + 4). Abstaende 8 / 16 / 24 / 32.
              #
              # Aussen: links vom Dach, auf einer Zeile mit dem Raumwert
              # (160..199, Einheit 201..218). Block x 80..202; die Dachkante
              # liegt bei y 199 auf x 234, bei y 218 auf x 208.
              - label: { x: 80, y: 168, text: "\U000F05A8", text_font: f_icon, text_color: $col_nilan_sun }
              - label: { id: hp_outdoor, x: 112, y: 160, width: 90, height: 39, long_mode: DOT, text: "--,-", text_font: f_val_xl, text_color: $col_ink }
              - label: { x: 112, y: 201, width: 90, height: 17, long_mode: DOT, text: "°C außen", text_font: f_unit, text_color: $col_ink }

              # Haus aus Flaechen statt aus einem Bild, 544 breit bei x 178
              # (Mitte 450), Spitze 40, Traufe 240, Wand bis 530. Dach: ein
              # Quadrat 385 x 385, um 45 Grad um seine Mitte gedreht, ist
              # eine Raute 544 breit mit der Spitze oben; ihr Rahmen 544 x 272
              # laesst nur die obere Haelfte stehen (ein Dreieck 544 x 272)
              # und wird um 200 / 272 = 0,735 auf 200 gestaucht. So liegen
              # alle geglaetteten Kanten aussen; zwei gedrehte Rechtecke
              # nebeneinander zeigten innen eine dunkle Naht. Die gestauchte
              # Unterkante des Daches ist ebenfalls geglaettet; deshalb kommt
              # die Wand danach und beginnt 2 px hoeher (y 238), sie deckt
              # die Kante zu.
              - obj:
                  x: 178
                  y: 40
                  width: 544
                  height: 272
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  clickable: false
                  scrollbar_mode: 'off'
                  scrollable: false
                  scroll_dir: NONE
                  transform_pivot_x: 0
                  transform_pivot_y: 0
                  transform_scale_y: 0.735
                  widgets:
                    - obj: { x: 80, y: 80, width: 385, height: 385, radius: 0, bg_color: $col_nilan_house, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false, scrollable: false, transform_pivot_x: 192, transform_pivot_y: 192, transform_rotation: 45 }
              - obj: { x: 178, y: 238, width: 544, height: 292, radius: 0, bg_color: $col_nilan_house, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false, scrollable: false }

              # Raum im Dach: Block 152 breit mittig auf 450 (x 374..526),
              # Thermometer 374, Wert 406 bei 160..199, Einheit 201..218.
              # Das Dach ist bei y 160 noch 326 breit.
              - label: { x: 374, y: 168, text: "\U000F050F", text_font: f_icon, text_color: $col_ink }
              - label: { id: hp_room, x: 406, y: 160, width: 120, height: 39, long_mode: DOT, text: "--,-", text_font: f_val_xl, text_color: $col_ink }
              - label: { id: hp_room_unit, x: 406, y: 201, width: 120, height: 17, long_mode: DOT, text: "°C Raum", text_font: f_unit, text_color: $col_ink }

              # Wand oben, Raumluft: Feuchte und CO2, Wert 272..302 (f_val_l),
              # Einheit 304..321. Flex mit SPACE_AROUND auf 480 bei x 210:
              # zwei Bloecke stehen mittig auf 330 / 570 ueber Luefter und
              # Warmwasser, ohne CO2 steht die Feuchte allein auf 450.
              # Bloecke 96 breit: Symbol 0..24, Text 32..96 ("% Feuchte" 62).
              - obj:
                  x: 210
                  y: 272
                  width: 480
                  height: 49
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  radius: 0
                  clickable: false
                  scrollbar_mode: 'off'
                  scrollable: false
                  scroll_dir: NONE
                  layout: { type: FLEX, flex_flow: ROW, flex_align_main: SPACE_AROUND, flex_align_cross: START, flex_align_track: START, pad_column: 0 }
                  widgets:
                    - obj:
                        width: 96
                        height: 49
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        scrollbar_mode: 'off'
                        scrollable: false
                        scroll_dir: NONE
                        widgets:
                          - label: { x: 0, y: 4, text: "\U000F058C", text_font: f_icon, text_color: $col_ink3 }
                          - label: { id: hp_humidity, x: 32, y: 0, width: 64, height: 30, long_mode: DOT, text: "--", text_font: f_val_l, text_color: $col_ink }
                          - label: { x: 32, y: 32, width: 64, height: 17, long_mode: DOT, text: "% Feuchte", text_font: f_unit, text_color: $col_ink }
                    - obj:
                        id: hp_co2_group
                        width: 96
                        height: 49
                        bg_opa: TRANSP
                        border_width: 0
                        pad_all: 0
                        clickable: false
                        scrollbar_mode: 'off'
                        scrollable: false
                        scroll_dir: NONE
                        hidden: true
                        widgets:
                          - label: { x: 0, y: 4, text: "\U000F07E4", text_font: f_icon, text_color: $col_ink3 }
                          - label: { id: hp_co2, x: 32, y: 0, width: 64, height: 30, long_mode: DOT, text: "---", text_font: f_val_l, text_color: $col_ink }
                          - label: { x: 32, y: 32, width: 64, height: 17, long_mode: DOT, text: "ppm CO2", text_font: f_unit, text_color: $col_ink }

              # Wand unten, Technik: Luefter mittig auf 330, Warmwasser auf
              # 570, Oberkanten 353 (32 unter der Raumluft).
              # Luefter: runde Taste wie im Bedienteil 353..425, darunter die
              # Stufe 433..450, Zu- und Abluft 452..469 und 471..488
              - obj:
                  x: 294
                  y: 353
                  width: 72
                  height: 72
                  radius: CIRCLE
                  bg_color: $col_nilan_button
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollbar_mode: 'off'
                  scrollable: false
                  scroll_dir: NONE
                  widgets:
                    - label: { align: CENTER, text: "\U000F0210", text_font: f_icon, text_color: $col_bg }
              - label: { id: hp_fan, x: 258, y: 433, width: 144, height: 17, long_mode: DOT, text_align: CENTER, text: "Stufe -", text_font: f_unit, text_color: $col_ink }
              - label: { id: hp_fan_in, x: 258, y: 452, width: 144, height: 17, long_mode: DOT, text_align: CENTER, text: "Zuluft -- %", styles: st_unit }
              - label: { id: hp_fan_out, x: 258, y: 471, width: 144, height: 17, long_mode: DOT, text_align: CENTER, text: "Abluft -- %", styles: st_unit }
              # Warmwasserkachel 110 x 120 bei x 515 (Mitte 570), 353..473:
              # Dusche 12..36, Wert 40..70, Einheit 72..89, Wellenlinie
              # 98..100, roter Punkt rechts neben dem Wert; darunter die
              # Beschriftung 481..498 (128 breit bei "Soll 50")
              - obj:
                  x: 515
                  y: 353
                  width: 110
                  height: 120
                  radius: 14
                  bg_color: $col_nilan_tank
                  bg_opa: COVER
                  border_color: $col_nilan_tank_edge
                  border_width: 2
                  pad_all: 0
                  scrollbar_mode: 'off'
                  scrollable: false
                  scroll_dir: NONE
                  widgets:
                    - label: { align: TOP_MID, y: 12, text: "\U000F09A1", text_font: f_icon, text_color: $col_ink3 }
                    - label: { id: hp_dhw, x: 0, y: 40, width: 110, height: 30, long_mode: DOT, text_align: CENTER, text: "--,-", text_font: f_val_l, text_color: $col_ink }
                    - label: { x: 0, y: 72, width: 110, height: 17, long_mode: DOT, text_align: CENTER, text: "°C", text_font: f_unit, text_color: $col_ink }
                    - obj: { x: 15, y: 98, width: 80, height: 2, radius: 1, bg_color: $col_ink, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false, scrollable: false }
                    - obj: { id: hp_dhw_dot, x: 94, y: 50, width: 10, height: 10, radius: 5, bg_color: $col_crit, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false, scrollable: false, hidden: true }
              - label: { id: hp_dhw_label, x: 498, y: 481, width: 144, height: 17, long_mode: DOT, text_align: CENTER, text: "Warmwasser", text_font: f_unit, text_color: $col_ink }

              # Enteisung und Legionellenschutz unter dem Haus (heatpump_extra),
              # 554..574 mittig auf 450, nur wenn eins davon laeuft
              - label: { id: hp_flags, x: 178, y: 554, width: 544, height: 20, long_mode: DOT, text_align: CENTER, text: "", text_font: f_text_s, text_color: $col_warn, hidden: true }

              - label: { id: hp_stand, x: 178, y: 600, width: 544, height: 17, long_mode: DOT, text_align: CENTER, text: "Stand --:--", styles: st_unit }

        # ---------------- Information wie hinter der Info-Taste ----------
        # Acht Zeilen, Zeile i ab y 30 + 47 i: Beschriftung f_text_s (20)
        # bei + 14, Wert f_val_m (25) rechtsbuendig bei + 12, Linie bei
        # + 47; die letzte endet bei 396 von 410.
        - obj:
            id: hp_tile_info
            styles: st_tile
            scrollbar_mode: 'off'
            scrollable: false
            scroll_dir: NONE
            x: 772
            y: 84
            width: 504
            height: 432
            widgets:
              - label: { x: 0, y: 0, width: 482, height: 17, long_mode: DOT, styles: st_label, text: "INFORMATION" }
              - label: { x: 0, y: 44, width: 240, height: 20, long_mode: DOT, text: "Betriebsart Lüftung", text_font: f_text_s, text_color: $col_ink2 }
              - label: { id: hp_vent_mode, x: 250, y: 42, width: 232, height: 25, long_mode: DOT, text_align: RIGHT, text: "--", text_font: f_val_m, text_color: $col_ink }
              - obj: { x: 0, y: 77, width: 482, height: 1, bg_color: $col_line, bg_opa: COVER, border_width: 0, radius: 0, pad_all: 0, clickable: false, scrollable: false }
              - label: { x: 0, y: 91, width: 240, height: 20, long_mode: DOT, text: "Jahreszeit", text_font: f_text_s, text_color: $col_ink2 }
              - label: { id: hp_season, x: 250, y: 89, width: 232, height: 25, long_mode: DOT, text_align: RIGHT, text: "--", text_font: f_val_m, text_color: $col_ink }
              - obj: { x: 0, y: 124, width: 482, height: 1, bg_color: $col_line, bg_opa: COVER, border_width: 0, radius: 0, pad_all: 0, clickable: false, scrollable: false }
              - label: { x: 0, y: 138, width: 240, height: 20, long_mode: DOT, text: "Bypass", text_font: f_text_s, text_color: $col_ink2 }
              - label: { id: hp_bypass, x: 250, y: 136, width: 232, height: 25, long_mode: DOT, text_align: RIGHT, text: "--", text_font: f_val_m, text_color: $col_ink }
              - obj: { x: 0, y: 171, width: 482, height: 1, bg_color: $col_line, bg_opa: COVER, border_width: 0, radius: 0, pad_all: 0, clickable: false, scrollable: false }
              - label: { x: 0, y: 185, width: 240, height: 20, long_mode: DOT, text: "Kompressor", text_font: f_text_s, text_color: $col_ink2 }
              - label: { id: hp_compressor, x: 250, y: 183, width: 232, height: 25, long_mode: DOT, text_align: RIGHT, text: "--", text_font: f_val_m, text_color: $col_ink }
              - obj: { x: 0, y: 218, width: 482, height: 1, bg_color: $col_line, bg_opa: COVER, border_width: 0, radius: 0, pad_all: 0, clickable: false, scrollable: false }
              - label: { x: 0, y: 232, width: 240, height: 20, long_mode: DOT, text: "Zuluft in °C", text_font: f_text_s, text_color: $col_ink2 }
              - label: { id: hp_supply, x: 250, y: 230, width: 232, height: 25, long_mode: DOT, text_align: RIGHT, text: "--,-", text_font: f_val_m, text_color: $col_ink }
