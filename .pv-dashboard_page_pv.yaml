##############################################################################
# Package: Seite 2 -- PV & Prognose
#
# Oben die Erzeugung je Wechselrichter und je Flaeche, getrennt nach den
# zwei Energiekreisen (docs/01): links der Kreis Volleinspeisung, rechts der
# Kreis Hausnetz. Unten der Tagesverlauf Ist gegen Prognose in gross, links
# daneben vier Kennzahlen daraus.
#
# Zwei Skripte gehoeren dazu:
#   pv_update       fuellt Wechselrichter- und Flaechenkaesten. Kuenftige
#                   Sensoren (Modbus der Wechselrichter) rufen nur dieses
#                   Skript auf; bis dahin stehen dort Striche.
#   pv_redraw_curve zeichnet Balken und Prognoselinie aus day_curve und
#                   forecast_curve und rechnet die vier Kennzahlen. Es haengt
#                   wie redraw_curve der Uebersicht an on_value beider
#                   Reihen (.pv-dashboard_ui.yaml) und schreibt keine Reihe.
#
# Flaeche x 4..1276, y 84..736 (je 8 Abstand zu Meldungszeile und
# Menueleiste). Zwei Spalten wie die Kreise: links x 4, 322 breit (innen
# 300), rechts ab x 334, 942 breit (innen 920 = 3 x 300 + 2 x 10). Die
# untere Reihe teilt genauso, die Kanten fluchten.
#   oben    y  84..342 (258): innen 236, belegt 0..234, Reserve 2
#   unten   y 350..736 (386): innen 364
#
# Die Namen kommen aus denselben Substitutions wie im Schema der Uebersicht
# (name_pv_1..8, name_inv_1..4). Die Kaesten hier sind breiter als dort
# (Flaeche 135 statt 88 px, Wechselrichter 284 statt 132 px); die Breiten in
# .pv-dashboard_anlage.yaml.example bleiben damit die engere Grenze.
##############################################################################

script:
  # ---------------------------------------------------------------------
  # Werte der oberen Reihe. Kuenftige Sensoren rufen nur dieses Skript auf.
  #   inv 0..3 = Wechselrichter 1..4 (name_inv_1..4), -1 = keiner
  #   pv  0..7 = Flaeche/Modul 1..8 (name_pv_1..8),   -1 = keine
  #   power in W, energy in kWh (heute); NAN = kein Wert (Striche)
  # Ein Aufruf setzt einen Wechselrichter, eine Flaeche oder beides, z. B.
  #   { id: pv_update, inv: -1, pv: 4, power: 4120, energy: 30.4 }
  # ---------------------------------------------------------------------
  - id: pv_update
    parameters:
      inv: int
      pv: int
      power: float
      energy: float
    then:
      - lambda: |-
          // Leistung ganzzahlig mit Tausenderpunkt ("3.412"), Energie mit
          // einer Nachkommastelle und Dezimalkomma -- wie im Schema.
          auto watt = [](float v, const char *none) -> std::string {
            if (std::isnan(v))
              return std::string(none);
            long w = lroundf(v);
            unsigned long a = w < 0 ? (unsigned long) -w : (unsigned long) w;
            char b[24];
            if (a >= 1000)
              snprintf(b, sizeof(b), "%s%lu.%03lu", w < 0 ? "-" : "", a / 1000, a % 1000);
            else
              snprintf(b, sizeof(b), "%ld", w);
            return std::string(b);
          };
          auto sub = [](float e) -> std::string {
            if (std::isnan(e))
              return std::string("W · --,- kWh");
            char b[24];
            snprintf(b, sizeof(b), "%.1f", e);
            for (char *p = b; *p; p++)
              if (*p == '.')
                *p = ',';
            return std::string("W · ") + b + " kWh";
          };
          if (inv >= 0 && inv <= 3) {
            lv_obj_t *const val[4] = {id(pv_inv_val_1), id(pv_inv_val_2), id(pv_inv_val_3), id(pv_inv_val_4)};
            lv_obj_t *const sb[4] = {id(pv_inv_sub_1), id(pv_inv_sub_2), id(pv_inv_sub_3), id(pv_inv_sub_4)};
            lv_label_set_text(val[inv], watt(power, "--.---").c_str());
            lv_label_set_text(sb[inv], sub(energy).c_str());
          }
          if (pv >= 0 && pv <= 7) {
            lv_obj_t *const val[8] = {id(pv_str_val_1), id(pv_str_val_2), id(pv_str_val_3), id(pv_str_val_4),
                                      id(pv_str_val_5), id(pv_str_val_6), id(pv_str_val_7), id(pv_str_val_8)};
            lv_obj_t *const sb[8] = {id(pv_str_sub_1), id(pv_str_sub_2), id(pv_str_sub_3), id(pv_str_sub_4),
                                     id(pv_str_sub_5), id(pv_str_sub_6), id(pv_str_sub_7), id(pv_str_sub_8)};
            lv_label_set_text(val[pv], watt(power, "-.---").c_str());
            lv_label_set_text(sb[pv], sub(energy).c_str());
          }

  # ---------------------------------------------------------------------
  # Tagesverlauf der unteren Reihe. Liest dieselben Reihen wie redraw_curve
  # der Uebersicht (Platz 0 = 06..07 Uhr ... Platz 15 = 21..22 Uhr) und
  # zeichnet beide auf gemeinsamem Massstab. Die Zerlegung steht damit zum
  # dritten Mal da (record_hour, redraw_curve) -- mit Absicht gleich, jede
  # Stelle baut fuer sich.
  # Kennzahlen: "abgeschlossen" sind die Plaetze vor der laufenden Stunde
  # (Stunde - 6). Restprognose = Prognose ab der laufenden Stunde bis
  # 22 Uhr. Ohne gueltige Uhrzeit bleiben diese beiden auf Strichen. Neu
  # gerechnet wird mit jeder Reihe, also spaetestens um HH:00:05, wenn
  # record_hour die abgelaufene Stunde schreibt.
  # ---------------------------------------------------------------------
  - id: pv_redraw_curve
    then:
      - lambda: |-
          // Zerlegt "1.2,3.4,..." in 16 Werte. Fehlende Felder bleiben 0.
          auto parse_curve = [](const std::string &src, float *out) {
            size_t pos = 0;
            for (int i = 0; i < 16 && pos <= src.size(); i++) {
              size_t comma = src.find(',', pos);
              std::string field = src.substr(pos, comma == std::string::npos
                                                  ? std::string::npos : comma - pos);
              float f = field.empty() ? 0.0f : strtof(field.c_str(), nullptr);
              // Von Hand gesetzte Reihe (nan, negativ, 1e30) -> 0..999
              out[i] = std::isfinite(f) ? std::clamp(f, 0.0f, 999.0f) : 0.0f;
              if (comma == std::string::npos)
                break;
              pos = comma + 1;
            }
          };
          // Dezimalkomma wie ueberall auf der Oberflaeche
          auto fmt = [](float v, const char *f) -> std::string {
            char b[24];
            snprintf(b, sizeof(b), f, v);
            for (char *p = b; *p; p++)
              if (*p == '.')
                *p = ',';
            return std::string(b);
          };
          float ist[16] = {0}, pro[16] = {0};
          parse_curve(id(day_curve).state, ist);
          parse_curve(id(forecast_curve).state, pro);
          // Gemeinsamer Massstab, sonst waere der Vergleich wertlos
          float peak = 0.1f, sum_ist = 0.0f, sum_pro = 0.0f;
          for (int i = 0; i < 16; i++) {
            peak = std::max(peak, ist[i]);
            peak = std::max(peak, pro[i]);
            sum_ist += ist[i];
            sum_pro += pro[i];
          }
          // Balken sind lv_obj_t*, die Linie ein Wrapper mit ->obj (siehe
          // redraw_curve in der Uebersicht).
          lv_obj_t *const bars[16] = {
            id(pv_bar_00), id(pv_bar_01), id(pv_bar_02), id(pv_bar_03),
            id(pv_bar_04), id(pv_bar_05), id(pv_bar_06), id(pv_bar_07),
            id(pv_bar_08), id(pv_bar_09), id(pv_bar_10), id(pv_bar_11),
            id(pv_bar_12), id(pv_bar_13), id(pv_bar_14), id(pv_bar_15) };
          for (int i = 0; i < 16; i++)
            lv_bar_set_value(bars[i], (int32_t) (ist[i] / peak * 100.0f), LV_ANIM_OFF);
          // Punkte auf den Balkenmitten (Balken i bei x 12 + 57 i, 41 breit,
          // Mitte + 20), y 0..300 wie die Balkenhoehe. Die Liste muss das
          // Widget ueberleben, daher static.
          static lv_point_precise_t pts[16];
          for (int i = 0; i < 16; i++) {
            pts[i].x = 12 + i * 57 + 20;
            pts[i].y = (lv_value_precise_t) (300 - pro[i] / peak * 300.0f);
          }
          lv_line_set_points(id(pv_line_forecast)->obj, pts, 16);
          // peak bleibt 0,1, solange beide Reihen leer sind -- dann Striche
          std::string scale = peak > 0.1f ? fmt(peak, "%.1f") : std::string("--,-");
          lv_label_set_text_fmt(id(pv_lbl_scale), "Balken Ist · Linie Prognose · Skala bis %s kWh",
                                scale.c_str());
          lv_label_set_text(id(pv_kpi_ist), fmt(sum_ist, "%.1f").c_str());
          lv_label_set_text(id(pv_kpi_pro), fmt(sum_pro, "%.1f").c_str());

          auto t = id(dash_time).now();
          if (!t.is_valid()) {
            lv_label_set_text(id(pv_kpi_rest), "--,-");
            lv_label_set_text(id(pv_kpi_ratio), "--");
            return;
          }
          const int cur = std::clamp((int) t.hour - 6, 0, 16);   // erster offener Platz
          float rest = 0.0f, done_ist = 0.0f, done_pro = 0.0f;
          for (int i = 0; i < 16; i++) {
            if (i < cur) {
              done_ist += ist[i];
              done_pro += pro[i];
            } else {
              rest += pro[i];
            }
          }
          lv_label_set_text(id(pv_kpi_rest), fmt(rest, "%.1f").c_str());
          // Unter 0,1 kWh Prognose (vor 7 Uhr, trueber Morgen) waere der
          // Anteil nur Rauschen
          std::string ratio = done_pro >= 0.1f ? fmt(done_ist / done_pro * 100.0f, "%.0f") : std::string("--");
          lv_label_set_text(id(pv_kpi_ratio), ratio.c_str());

