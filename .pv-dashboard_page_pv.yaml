              - label: { x: 0, y: 282, width: 300, height: 17, long_mode: DOT, styles: st_label, text: "IST ZU PROGNOSE" }
              - label: { id: pv_kpi_ratio, x: 0, y: 303, width: 300, height: 39, long_mode: DOT, text: "--", text_font: f_val_xl, text_color: $col_ink }
              - label: { x: 0, y: 344, width: 300, height: 17, long_mode: DOT, styles: st_sub, text: "% der abgeschlossenen Stunden" }

        # Tagesverlauf, innen 920 x 364. Titel 0..17, rechts daneben die
        # Legende mit der Skala (setzt pv_redraw_curve). 16 Balken im Raster
        # 57, je 41 breit: 15 x 57 + 41 = 896, ab x 12 -> links und rechts
