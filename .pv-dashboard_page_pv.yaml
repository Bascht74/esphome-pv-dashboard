        # ---------------- untere Reihe: Kennzahlen und Tagesverlauf -----
        # Vier Bloecke je 79 hoch: Titel 0..17 (f_label), Wert 21..60
        # (f_val_xl 39), Zweitzeile 62..79 (f_unit). Raster 94 ab y 0, der
        # erste Titel fluchtet mit dem Titel des Tagesverlaufs:
        # 0 / 94 / 188 / 282, Ende 361 von 364 -> Reserve 3.
        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            scrollable: false
            scroll_dir: NONE
            x: 4
            y: 350
            width: 322
            height: 386
            widgets:
              - label: { x: 0, y: 0, width: 300, height: 17, long_mode: DOT, styles: st_label, text: "IST HEUTE" }
              - label: { id: pv_kpi_ist, x: 0, y: 21, width: 300, height: 39, long_mode: DOT, text: "--,-", text_font: f_val_xl, text_color: $col_ink }
