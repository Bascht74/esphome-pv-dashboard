        # Farben wie im Schema: col_full fuer die Volleinspeisung, col_solar
        # fuer den Hausnetz-Kreis; Mini-WR mit dem Einzelmodul-Bild.
        #
        # Wechselrichter, st_box mit pad 0: innen 300 - 2 x 2 = 296 x 86.
        #   Name 6..26 (f_text_s 20), Wert 29..59 (f_val_l 30),
