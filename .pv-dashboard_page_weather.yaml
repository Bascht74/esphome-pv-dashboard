##############################################################################
# Package: Seite 4 -- Wetter (DWD)
#
# Auf Wunsch des Nutzers (25.09.2026): das Wetter vom Deutschen
# Wetterdienst, wie es die HACS-Integration "DWD Weather" in Home Assistant
# liefert (eine weather-Entitaet mit Stunden- und Tagesvorhersage, dazu die
# DWD-Warnungen). Die Werte kommen nach den Feldnamen von Home Assistant
# herein: condition, temperature, templow, humidity, pressure,
# wind_speed, wind_bearing, wind_gust_speed, cloud_coverage,
# precipitation, precipitation_probability. Die Sonnenscheindauer liefert
# die DWD-Integration als eigenen Wert; ihr Feldname ist am Geraet zu
# pruefen (docs/06).
#
#   Jetzt       Wetterbild, Temperatur, Lage, Wind mit Richtung, Boeen,
#               Feuchte, Luftdruck, Wolken, Regen heute, Sonne auf/unter,
#               Sonnenscheindauer heute
#   24 Stunden  zwoelf Spalten je 2 h: Wetterbild, Temperatur als Kurve,
#               Regenmenge als Balken, Regenwahrscheinlichkeit
#   Tage        sieben Tage: Wetterbild, Hoechst- und Tiefstwert, Regen,
#               Sonne, Wind; oben rechts die DWD-Warnung
#
# wx_cond (globals unten) setzt die Lage in Bild, Farbe und Text um; die
# Seite Prognose benutzt es fuer die Folgetage mit.
#
# Vier Skripte gehoeren dazu; kuenftige Sensoren rufen nur diese auf, bis
# dahin stehen Striche:
#   wx_now   Werte jetzt          wx_hour     eine Stundenspalte
#   wx_day   ein Tag              wx_warning  DWD-Warnung
#
# Flaeche x 4..1276, y 84..736.
#   Jetzt     x 4, y 84, 500 x 300, innen 478 x 278: Titel 0..17, Bild
#             26..114 (f_wx_xl 88) links, Temperatur 34..73 (f_val_xl),
#             Einheit mit Lage 75..92, Hoechst/Tiefst 96..116, Linie 124,
#             zwei Zeilen zu drei Kennzahlen je 159: Beschriftung 134..154
#             / 190..210, Wert 156..181 / 212..237, Sonne 250..274
#             (Symbol, Aufgang 30..90, Symbol 110, Untergang 140..200,
#             Dauer rechtsbuendig)
#   24 Std.   x 512, y 84, 764 x 300, innen 742 x 278: Titel 0..17,
#             zwoelf Spalten je 61,8: Uhrzeit 26..46, Bild 50..74 (f_icon),
#             Temperatur 78..103 (f_val_m), Kurve 112..182, Regen 190..250
#             (Grundlinie 250), Wahrscheinlichkeit 254..271
#   Tage      x 4, y 392, 1272 x 344, innen 1250 x 322: Titel 0..17,
#             sieben Spalten je 178,6: Tag 28..50, Bild 54..98 (f_wx_l),
#             Lage 102..119, Hoechst 128..158 (f_val_l), Tiefst 160..185
#             (f_val_m), Linie 196, drei Zeilen 206..226 / 232..252 /
#             258..278
##############################################################################

globals:
  # Lage (condition von Home Assistant) -> Bild, Farbe, Text. Unbekannt
  # oder leer ergibt kein Bild und "--".
  - id: wx_cond
    type: std::function<std::tuple<const char *, uint32_t, const char *>(const std::string &)>
    restore_value: false
    initial_value: |-
      [](const std::string &c) -> std::tuple<const char *, uint32_t, const char *> {
        struct E { const char *key, *glyph; uint32_t color; const char *text; };
        static const E T[] = {
          {"sunny",           "\U000F0599", $col_solar, "Sonnig"},
          {"clear-night",     "\U000F0594", $col_ink3,  "Klar"},
          {"partlycloudy",    "\U000F0595", $col_solar, "Teils bewölkt"},
          {"cloudy",          "\U000F0590", $col_ink3,  "Bewölkt"},
          {"fog",             "\U000F0591", $col_ink3,  "Nebel"},
          {"rainy",           "\U000F0597", $col_batt,  "Regen"},
          {"pouring",         "\U000F0596", $col_batt,  "Starkregen"},
          {"snowy",           "\U000F0598", $col_ink,   "Schnee"},
          {"snowy-rainy",     "\U000F067F", $col_batt,  "Schneeregen"},
          {"hail",            "\U000F0592", $col_batt,  "Hagel"},
          {"lightning",       "\U000F0593", $col_warn,  "Gewitter"},
          {"lightning-rainy", "\U000F067E", $col_warn,  "Gewitter und Regen"},
          {"windy",           "\U000F059D", $col_ink3,  "Windig"},
          {"windy-variant",   "\U000F059E", $col_ink3,  "Windig, bewölkt"},
          {"exceptional",     "\U000F0F2F", $col_crit,  "Unwetter"},
        };
        for (const auto &e : T)
          if (c == e.key)
            return std::make_tuple(e.glyph, e.color, e.text);
        return std::make_tuple("", (uint32_t) $col_ink3, "--");
      }
  # Stundenspalten: Temperatur und Regen fuer Kurve und Balken
  - id: wx_hour_temp
    type: std::array<float, 12>
    restore_value: false
  - id: wx_hour_rain
    type: std::array<float, 12>
    restore_value: false
  - id: wx_hour_seen
    type: int
    restore_value: false
    initial_value: '0'
  # zuletzt gemeldete Warnung, damit jede nur einmal in die Meldungen geht
  - id: wx_warning_last
    type: std::string
    restore_value: false

script:
  # ---------------------------------------------------------------------
  # Werte jetzt (weather-Entitaet und Tagesvorhersage fuer heute):
  #   cond       Lage ("sunny", "rainy" ...)
  #   temp       Temperatur in °C; tmax, tmin heute in °C
  #   humidity   in %              pressure  in hPa
  #   wind       Wind in km/h      bearing   Richtung in Grad (0 = Nord)
  #   gust       Boeen in km/h     clouds    Bewoelkung in %
  #   rain       Niederschlag heute in mm
  #   sun_h      Sonnenscheindauer heute in Stunden
  #   sunrise, sunset  "HH:MM" (leer = unbekannt)
  #   updated    Zeit der Vorhersage "HH:MM" (leer = unbekannt)
  #   NAN = kein Wert (Striche)
  # ---------------------------------------------------------------------
  - id: wx_now
    parameters:
      cond: string
      temp: float
      tmax: float
      tmin: float
      humidity: float
      pressure: float
      wind: float
      bearing: float
      gust: float
      clouds: float
      rain: float
      sun_h: float
      sunrise: string
      sunset: string
      updated: string
    then:
      - lambda: |-
          auto &num = id(fmt_num);
          const auto c = id(wx_cond)(cond);
          lv_label_set_text(id(wx_icon), std::get<0>(c));
          lv_obj_set_style_text_color(id(wx_icon), lv_color_hex(std::get<1>(c)), 0);
          lv_label_set_text(id(wx_temp), num(temp, "%.1f", "--,-").c_str());
          lv_label_set_text(id(wx_unit), (std::string("°C · ") + std::get<2>(c)).c_str());
          const std::string mm = "Höchst " + num(tmax, "%.0f", "--") + "° · Tiefst " + num(tmin, "%.0f", "--") + "°";
          lv_label_set_text(id(wx_minmax), mm.c_str());
          static const char *const DIR[8] = {"N", "NO", "O", "SO", "S", "SW", "W", "NW"};
          std::string ws = num(wind, "%.0f", "--");
          if (!std::isnan(wind) && !std::isnan(bearing))
            ws += std::string(" ") + DIR[((int) lroundf(fmodf(fmodf(bearing, 360.0f) + 360.0f, 360.0f) / 45.0f)) % 8];
          lv_label_set_text(id(wx_wind), ws.c_str());
          lv_label_set_text(id(wx_gust), num(gust, "%.0f", "--").c_str());
          lv_label_set_text(id(wx_hum), num(humidity, "%.0f", "--").c_str());
          lv_label_set_text(id(wx_press), num(pressure, "%.0f", "----").c_str());
          lv_label_set_text(id(wx_cloud), num(clouds, "%.0f", "--").c_str());
          lv_label_set_text(id(wx_rain), num(rain, "%.1f", "-,-").c_str());
          lv_label_set_text(id(wx_sunrise), sunrise.empty() ? "--:--" : sunrise.c_str());
          lv_label_set_text(id(wx_sunset), sunset.empty() ? "--:--" : sunset.c_str());
          lv_label_set_text(id(wx_sunh), ("Sonne heute " + num(sun_h, "%.1f", "-,-") + " h").c_str());
          lv_label_set_text(id(wx_stand), updated.empty() ? "DWD" : ("DWD · Stand " + updated).c_str());
          id(data_seen)[7] = millis();

  # ---------------------------------------------------------------------
  # Eine Stundenspalte (Stundenvorhersage, alle 2 h eine):
  #   slot   0..11 (0 = naechste volle Stunde)
  #   hour   Uhrzeit 0..23
  #   cond   Lage             temp  Temperatur in °C
  #   rain   Niederschlag in mm       prob  Wahrscheinlichkeit in %
  # ---------------------------------------------------------------------
  - id: wx_hour
    parameters:
      slot: int
      hour: int
      cond: string
      temp: float
      rain: float
      prob: float
    then:
      - lambda: |-
          if (slot < 0 || slot >= 12)
            return;
          lv_obj_t *const hl[12] = {id(wx_h_00), id(wx_h_01), id(wx_h_02), id(wx_h_03), id(wx_h_04), id(wx_h_05), id(wx_h_06), id(wx_h_07), id(wx_h_08), id(wx_h_09), id(wx_h_10), id(wx_h_11)};
          lv_obj_t *const ic[12] = {id(wx_hi_00), id(wx_hi_01), id(wx_hi_02), id(wx_hi_03), id(wx_hi_04), id(wx_hi_05), id(wx_hi_06), id(wx_hi_07), id(wx_hi_08), id(wx_hi_09), id(wx_hi_10), id(wx_hi_11)};
          lv_obj_t *const tp[12] = {id(wx_ht_00), id(wx_ht_01), id(wx_ht_02), id(wx_ht_03), id(wx_ht_04), id(wx_ht_05), id(wx_ht_06), id(wx_ht_07), id(wx_ht_08), id(wx_ht_09), id(wx_ht_10), id(wx_ht_11)};
          lv_obj_t *const pr[12] = {id(wx_hp_00), id(wx_hp_01), id(wx_hp_02), id(wx_hp_03), id(wx_hp_04), id(wx_hp_05), id(wx_hp_06), id(wx_hp_07), id(wx_hp_08), id(wx_hp_09), id(wx_hp_10), id(wx_hp_11)};
          auto &num = id(fmt_num);
          if (hour >= 0 && hour < 24)
            lv_label_set_text_fmt(hl[slot], "%02d Uhr", hour);
          else
            lv_label_set_text(hl[slot], "--");
          const auto c = id(wx_cond)(cond);
          lv_label_set_text(ic[slot], std::get<0>(c));
          lv_obj_set_style_text_color(ic[slot], lv_color_hex(std::get<1>(c)), 0);
          lv_label_set_text(tp[slot], (num(temp, "%.0f", "--") + "°").c_str());
          lv_label_set_text(pr[slot], (num(prob, "%.0f", "--") + " %").c_str());
          id(wx_hour_temp)[slot] = temp;
          id(wx_hour_rain)[slot] = rain;
          id(wx_hour_seen) |= 1 << slot;
      - script.execute: wx_redraw

  # ---------------------------------------------------------------------
  # Ein Tag (Tagesvorhersage):
  #   day    0..6 (0 = heute)        label  "Heute", "Fr 26.09." ...
  #   cond   Lage                    tmax, tmin  in °C
  #   rain   Niederschlag in mm      prob   Wahrscheinlichkeit in %
  #   sun_h  Sonnenscheindauer in h  wind   Wind in km/h
  # ---------------------------------------------------------------------
  - id: wx_day
    parameters:
      day: int
      label: string
      cond: string
      tmax: float
      tmin: float
      rain: float
      prob: float
      sun_h: float
      wind: float
    then:
      - lambda: |-
          if (day < 0 || day >= 7)
            return;
          lv_obj_t *const lb[7] = {id(wx_d_0), id(wx_d_1), id(wx_d_2), id(wx_d_3), id(wx_d_4), id(wx_d_5), id(wx_d_6)};
          lv_obj_t *const ic[7] = {id(wx_di_0), id(wx_di_1), id(wx_di_2), id(wx_di_3), id(wx_di_4), id(wx_di_5), id(wx_di_6)};
          lv_obj_t *const cd[7] = {id(wx_dc_0), id(wx_dc_1), id(wx_dc_2), id(wx_dc_3), id(wx_dc_4), id(wx_dc_5), id(wx_dc_6)};
          lv_obj_t *const hi[7] = {id(wx_dmax_0), id(wx_dmax_1), id(wx_dmax_2), id(wx_dmax_3), id(wx_dmax_4), id(wx_dmax_5), id(wx_dmax_6)};
          lv_obj_t *const lo[7] = {id(wx_dmin_0), id(wx_dmin_1), id(wx_dmin_2), id(wx_dmin_3), id(wx_dmin_4), id(wx_dmin_5), id(wx_dmin_6)};
          lv_obj_t *const r1[7] = {id(wx_dr_0), id(wx_dr_1), id(wx_dr_2), id(wx_dr_3), id(wx_dr_4), id(wx_dr_5), id(wx_dr_6)};
          lv_obj_t *const r2[7] = {id(wx_ds_0), id(wx_ds_1), id(wx_ds_2), id(wx_ds_3), id(wx_ds_4), id(wx_ds_5), id(wx_ds_6)};
          lv_obj_t *const r3[7] = {id(wx_dw_0), id(wx_dw_1), id(wx_dw_2), id(wx_dw_3), id(wx_dw_4), id(wx_dw_5), id(wx_dw_6)};
          auto &num = id(fmt_num);
          lv_label_set_text(lb[day], label.c_str());
          const auto c = id(wx_cond)(cond);
          lv_label_set_text(ic[day], std::get<0>(c));
          lv_obj_set_style_text_color(ic[day], lv_color_hex(std::get<1>(c)), 0);
          lv_label_set_text(cd[day], std::get<2>(c));
          lv_label_set_text(hi[day], (num(tmax, "%.0f", "--") + "°").c_str());
          lv_label_set_text(lo[day], (num(tmin, "%.0f", "--") + "°").c_str());
          lv_label_set_text(r1[day], ("Regen " + num(rain, "%.1f", "-,-") + " mm · " + num(prob, "%.0f", "--") + " %").c_str());
          lv_label_set_text(r2[day], ("Sonne " + num(sun_h, "%.1f", "-,-") + " h").c_str());
          lv_label_set_text(r3[day], ("Wind " + num(wind, "%.0f", "--") + " km/h").c_str());

  # ---------------------------------------------------------------------
  # DWD-Warnung (Integration "DWD Weather Warnings" in Home Assistant):
  #   level  0 = keine, 1 = Wetterwarnung, 2 = markant, 3 = Unwetter,
  #          4 = extremes Unwetter (Stufen des DWD)
  #   text   Kurztext, z. B. "Sturmboeen bis Fr 18:00"
  # Ab Stufe 1 steht der Text oben rechts in der Kachel Tage; eine neue
  # Warnung geht einmal in die Meldungen (Stufe 1..2 Warnung, ab 3 Stoerung).
  # Aufgehoben (Stufe 0) oder durch eine neue ersetzt, verschwindet sie dort
  # wieder (alert_clear).
  # ---------------------------------------------------------------------
  - id: wx_warning
    parameters:
      level: int
      text: string
    then:
      - lambda: |-
          if (level <= 0) {
            lv_label_set_text(id(wx_warn), "Keine Warnung des DWD");
            lv_obj_set_style_text_color(id(wx_warn), lv_color_hex($col_ink3), 0);
            id(wx_warning_last).clear();
            id(alert_clear).execute(std::string("Wetter"), std::string(""));
            return;
          }
          const std::string t = "DWD-Warnung: " + (text.empty() ? std::string("ohne Text") : text);
          lv_label_set_text(id(wx_warn), t.c_str());
          lv_obj_set_style_text_color(id(wx_warn), level >= 3 ? lv_color_hex($col_crit) : lv_color_hex($col_warn), 0);
          if (t != id(wx_warning_last)) {
            // Eine neue Warnung ersetzt die alte in den Meldungen
            if (!id(wx_warning_last).empty())
              id(alert_clear).execute(std::string("Wetter"), std::string(""));
            id(wx_warning_last) = t;
            id(alert_push).execute(level >= 3 ? 2 : 1, std::string("Wetter"), text.empty() ? std::string("DWD-Warnung") : text);
          }

  # Kurve und Balken der Stundenspalten. Von Hand ruft es niemand.
  - id: wx_redraw
    then:
      - lambda: |-
          const auto &t = id(wx_hour_temp);
          const auto &r = id(wx_hour_rain);
          const int seen = id(wx_hour_seen);
          float tmin = 1e9f, tmax = -1e9f, rmax = 2.0f;
          for (int i = 0; i < 12; i++) {
            if (!(seen & (1 << i)))
              continue;
            if (!std::isnan(t[i])) {
              tmin = std::min(tmin, t[i]);
              tmax = std::max(tmax, t[i]);
            }
            if (!std::isnan(r[i]))
              rmax = std::max(rmax, r[i]);
          }
          if (tmax - tmin < 4.0f) {
            const float m = (tmax + tmin) / 2;
            tmin = m - 2.0f;
            tmax = m + 2.0f;
          }
          // Kurve: Flaeche 112..182 (70 px), Linie liegt bei y 112
          const float HW = 61.8333f;
          static lv_point_precise_t pts[12];
          int np = 0;
          for (int i = 0; i < 12; i++) {
            if (!(seen & (1 << i)) || std::isnan(t[i]))
              continue;
            pts[np].x = (lv_value_precise_t) (HW * i + HW / 2);
            pts[np].y = (lv_value_precise_t) (70.0f - (t[i] - tmin) / (tmax - tmin) * 70.0f);
            np++;
          }
          lv_line_set_points(id(wx_line)->obj, pts, np);
          if (np < 2)
            lv_obj_add_flag(id(wx_line)->obj, LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_clear_flag(id(wx_line)->obj, LV_OBJ_FLAG_HIDDEN);
          // Regenbalken: 190..250 (60 px), Skala mindestens 2 mm
          lv_obj_t *const bar[12] = {id(wx_hr_00), id(wx_hr_01), id(wx_hr_02), id(wx_hr_03), id(wx_hr_04), id(wx_hr_05), id(wx_hr_06), id(wx_hr_07), id(wx_hr_08), id(wx_hr_09), id(wx_hr_10), id(wx_hr_11)};
          for (int i = 0; i < 12; i++) {
            if (!(seen & (1 << i)) || std::isnan(r[i]) || r[i] <= 0.0f) {
              lv_obj_add_flag(bar[i], LV_OBJ_FLAG_HIDDEN);
              continue;
            }
            const int h = std::max((int) lroundf(r[i] / rmax * 60.0f), 2);
            lv_obj_set_y(bar[i], 250 - h);
            lv_obj_set_height(bar[i], h);
            lv_obj_clear_flag(bar[i], LV_OBJ_FLAG_HIDDEN);
          }
          lv_label_set_text(id(wx_rscale), ("Regen bis " + id(fmt_num)(rmax, "%.1f", "-") + " mm").c_str());

