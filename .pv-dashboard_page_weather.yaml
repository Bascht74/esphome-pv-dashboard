              - label: { x: 110, y: 250, width: 26, height: 24, text: "\U000F059B", text_font: f_icon, text_color: $col_solar_deep }
              - label: { id: wx_sunset, x: 140, y: 252, width: 60, height: 22, long_mode: CLIP, text: "--:--", text_font: f_text, text_color: $col_ink }
              - label: { id: wx_sunh, x: 220, y: 252, width: 258, height: 22, long_mode: DOT, text_align: RIGHT, text: "Sonne heute -,- h", text_font: f_text, text_color: $col_ink }
        # ---------------- 24 Stunden ----------------------------------------
        - obj:
            styles: st_tile
