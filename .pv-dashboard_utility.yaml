##############################################################################
# Package: Werkzeugkasten -- Schriften, Bilder, Farben und Masse
#
# Fasst zusammen, was Geraet (pv-dashboard.yaml) und Simulator
# (pv-dashboard-sim.yaml) neben der Oberflaeche gemeinsam brauchen. Die
# beiden Abschnitte stehen unveraendert untereinander, jeder mit seinem
# eigenen Kopf:
#
#   Abschnitt 1  Schriften und Bilder  (frueher .pv-dashboard_fonts.yaml)
#   Abschnitt 2  Farben und Masse      (frueher .pv-dashboard_tokens.yaml)
#
# Ein dritter Abschnitt Audio war geplant, geht aber nicht: i2s_audio,
# audio_dac und micro_wake_word verlangen die Plattform esp32, und der
# Simulator laeuft auf host. Audio bleibt deshalb in
# .pv-dashboard_audio.yaml, das nur das Geraet einbindet.
##############################################################################

##############################################################################
# ABSCHNITT 1 -- Schriften und Bilder
#
# IBM Plex Sans fuer Text, IBM Plex Mono fuer alle Messwerte. Plex wurde fuer
# technische Dokumentation entworfen; die Mono-Schwester garantiert gleiche
# Ziffernbreite, damit sich im Sekundentakt nichts verschiebt.
#
# Groessen sind auf Ablesbarkeit aus ein bis zwei Metern ausgelegt -- das
# Panel haengt an der Wand, nicht auf dem Schreibtisch.
#
# glyphsets: GF_Latin_Core deckt Umlaute und scharfes s ab -- die in LVGL
# eingebauten Montserrat-Schriften tun das nicht.
#
# Wird von Geraet und Simulator gemeinsam benutzt. Laedt beim Kompilieren von
# Google Fonts, braucht also Internet auf dem Build-Rechner.
##############################################################################

# Modulsymbole aus dem Layoutentwurf, weiss auf transparent -- LVGL faerbt sie
# zur Laufzeit ein (image_recolor). Dieselbe Datei traegt so Gold fuer die
# Flaechen der Volleinspeisung und Bernstein fuer die des Hausnetzes.
#
#   img_solar_field   Modulfeld mit acht Zellen -- fuer die sechs Dachflaechen
#   img_solar_module  Einzelmodul mit vier Zellen -- fuer die zwei Mini-Module
image:
  - platform: file
    file: images/solar_panel.png
    id: img_solar_field
    type: RGB565
    transparency: alpha_channel
  - platform: file
    file: images/solar_module.png
    id: img_solar_module
    type: RGB565
    transparency: alpha_channel

font:
  # --- Beschriftungen und Fliesstext ------------------------------------
  - file: "gfonts://IBM+Plex+Sans@400"
    id: f_unit
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Core]
    # Zwei Pfeile aus Material Design Icons mitten im Fliesstext:
    #   \U000F005D  arrow-up    Entladen -- Energie verlaesst den Speicher
    #   \U000F0045  arrow-down  Laden    -- Energie geht hinein
    extras:
      - file:
          type: web
          url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
        glyphs: ["\U000F005D", "\U000F0045"]
  - file: "gfonts://IBM+Plex+Sans@600"
    id: f_label
    size: 13
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://IBM+Plex+Sans@400"
    id: f_text_s
    size: 15
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://IBM+Plex+Sans@400"
    id: f_text
    size: 17
    bpp: 4
    glyphsets: [GF_Latin_Core]

  # --- Kopfzeile: gross und halbfett, aus jeder Entfernung lesbar -------
  - file: "gfonts://IBM+Plex+Sans@600"
    id: f_bar
    size: 22
    bpp: 4
    glyphsets: [GF_Latin_Core]
  # --- Meldungszeile: 4 px groesser als der bisherige Fliesstext --------
  - file: "gfonts://IBM+Plex+Sans@400"
    id: f_alert
    size: 19
    bpp: 4
    glyphsets: [GF_Latin_Core]

  # --- Messwerte --------------------------------------------------------
  - file: "gfonts://IBM+Plex+Mono@600"
    id: f_val_s
    size: 16
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://IBM+Plex+Mono@600"
    id: f_val_m
    size: 19
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://IBM+Plex+Mono@600"
    id: f_val_l
    size: 23
    bpp: 4
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://IBM+Plex+Mono@600"
    id: f_val_xl
    size: 30
    bpp: 4
    glyphsets: [GF_Latin_Core]

  # --- Symbole ----------------------------------------------------------
  # Material Design Icons als Schriftglyphen. Nur die tatsaechlich benutzten
  # Zeichen werden eingebettet, das kostet praktisch nichts. LVGL kann keine
  # SVG darstellen -- deshalb dieser Weg statt gezeichneter Piktogramme.
  #
  #   \U000F0D9B  solar-panel          Dachflaeche
  #   \U000F1480  current-ac           Wechselrichter
  #   \U000F12A3  battery-high         Speicher
  #   \U000F1903  home-lightning-bolt  Hausnetz
  #   \U000F05F1  ev-station           Wallbox
  #   \U000F1A43  heat-pump            Waermepumpe
  #   \U000F072A  washing-machine      sonstige Verbraucher
  #   \U000F0199  counter              Zaehler
  #   \U000F0D3E  transmission-tower   Hausanschluss / Netz
  # Seit 24.09.2026 fuer die Seiten Wallboxen und Waermepumpe (Codepunkte
  # aus @mdi/font 7.4.47 nachgesehen):
  #   \U000F140B  lightning-bolt       Laden aktiv
  #   \U000F05A8  white-balance-sunny  Aussentemperatur (Nilan)
  #   \U000F050F  thermometer          Raumtemperatur (Nilan)
  #   \U000F058C  water                Luftfeuchte (Nilan)
  #   \U000F07E4  molecule-co2         CO2 (Nilan)
  #   \U000F09A1  shower-head          Warmwasser (Nilan)
  #   \U000F0210  fan                  Lueftungsstufe (Nilan)
  #   \U000F0026  alert                Warnung / Alarm (Nilan)
  #   \U000F0084  battery-charging     Speicher laden (Seite Haus)
  # Seit 25.09.2026 fuer die Statusleiste (Systemzustand):
  #   \U000F05A9  wifi                 WLAN verbunden
  #   \U000F05AA  wifi-off             WLAN getrennt
  #   \U000F07D0  home-assistant       Home Assistant
  #   \U000F05E1  check-circle-outline Daten frisch
  #   \U000F05CE  clock-alert-outline  Daten ueberfaellig
  - file:
      type: web
      url: "https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf"
    id: f_icon
    size: 24
    bpp: 4
    glyphs: ["\U000F0D9B", "\U000F1480", "\U000F12A3", "\U000F1903",
             "\U000F05F1", "\U000F1A43", "\U000F072A", "\U000F0199",
             "\U000F0D3E", "\U000F140B", "\U000F05A8", "\U000F050F",
             "\U000F058C", "\U000F07E4", "\U000F09A1", "\U000F0210",
             "\U000F0026", "\U000F0084", "\U000F05A9", "\U000F05AA",
             "\U000F07D0", "\U000F05E1", "\U000F05CE"]



##############################################################################
# ABSCHNITT 2 -- Farben und Masse
#
# Einzige Quelle fuer Farben, Groessen und Abstaende der Oberflaeche.
# Wird sowohl vom Geraet (pv-dashboard.yaml) als auch vom Simulator
# (pv-dashboard-sim.yaml) eingebunden -- Aenderungen wirken damit auf beiden.
#
# Regelwerk fuer Werte (aus dem Layoutentwurf):
#   - Einheit steht IMMER unter dem Wert, nie dahinter. Erlaubt ist die
#     Zweitzeile "kW · 15,4 kWh": vorn die Einheit des Werts darueber, dann
#     der Tageswert mit seiner eigenen Einheit
#   - Ausnahme Statusleiste: "Autarkie 87 % · Restprognose 6,2 kWh" ist ein
#     Satz in der Kopfzeile, dort steht die Einheit hinter dem Wert
#   - kein Wert ohne Einheit, auch nicht bei % und °C
#   - Momentanwert gross, Tageswert klein darunter
#   - alle Zahlen in Mono mit Tabellenziffern
#   - Vorzeichen nur, wo die Richtung zaehlt (Batterie +/-)
#   - Geld auf zwei, Energie auf eine Nachkommastelle
##############################################################################

substitutions:
  # --- Flaechen ---------------------------------------------------------
  col_bg: "0x0E141B"      # Panel-Hintergrund, blaustichiges Anthrazit
  col_surface: "0x16202B" # Kacheln und Geraetekaesten
  col_line: "0x51698A"    # Rahmen, Haarlinien, ruhende Leitungen

  # --- Schrift ----------------------------------------------------------
  # Zweite Aufhellung: Das Panel haengt nicht im abgedunkelten Raum, sondern
  # im Tageslicht. Kontrast gegen col_bg (WCAG, gerechnet):
  #   col_ink   18,6:1   col_ink2  16,4:1   col_ink3  11,9:1
  # col_ink3 traegt Beschriftungen und Einheiten und war mit 9,1:1 der
  # schwaechste Ton -- genau der, der draussen zuerst wegfaellt.
  col_ink: "0xFFFFFF"     # Primaertext und grosse Werte
  col_ink2: "0xF0F5F9"    # Zweitzeilen
  col_ink3: "0xC3D1DD"    # Beschriftungen, Einheiten

  # --- Energiefarben ----------------------------------------------------
  # Leitungen werden nach QUELLE eingefaerbt, nicht nach Ziel.
  col_solar: "0xF5B33C"   # PV Eigenverbrauch (Hausnetz-Kreis)
  col_full: "0xE8A020"    # Volleinspeisung -- bewusst abgesetzt
  col_batt: "0x45C6D6"    # Speicher, DC-Seite
  col_feed: "0x5CC98A"    # Einspeisung ins Netz
  col_draw: "0xE86A54"    # Netzbezug
  col_warn: "0xE8B83C"    # Warnung
  col_crit: "0xE8654F"    # Stoerung

  # --- Verlaufstoene ----------------------------------------------------
  # Tiefer Ton nur als dunkles Ende von Verlaeufen nach col_solar
  # (Stundenbalken unten, Eigenverbrauchsring am Bogenanfang). Nie fuer
  # Text -- dafuer reicht sein Kontrast gegen col_surface nicht.
  col_solar_deep: "0xB6751F"
  # Kacheln der Energiebilanz: Anfangston des Kantenverlaufs (grad_tile_*),
  # deckend statt mit Deckkraft -- LVGL interpoliert Farbe und Deckkraft
  # getrennt, "Akzent 14 %" nach "col_surface 100 %" waere in der Mitte
  # heller. Gewaehlt nach den RGB565-Stufen: Einspeisung stuft nur in G
  # (4 Uebergaenge), R und B sind in RGB565 gleich col_surface.
  # Netzbezug beginnt im Ton seiner Kante (col_draw, Farbwinkel 37 Grad
  # in LCh): R/G/B 8/8/3, Farbwinkel 39. Stufte er nur in R und laege B
  # wie col_surface ueber G, waere der Anfang mauve (325 Grad). So faellt
  # R in 6 Stufen und B steigt in 2 bis col_surface, G bleibt. Von der
  # Kante aus erst orange (39..44 Grad), dann rot (12..20 Grad), dann
  # ein neutrales Grau 33/32/33 und ueber
  # 24/32/41 der Grund -- kein Mauve dazwischen. Erzeugt und Verbraucht
  # stufen in mehreren Kanaelen; sie laufen in col_tint_end, col_surface
  # auf die RGB565-Stufengrenzen abgerundet (gleich dargestellt). Die
  # Anfangstoene liegen in R (bei Verbraucht auch in B) 6/8, in G 3/4
  # einer Stufe ueber einer vollen Stufe, so fallen die Grenzen zusammen:
  # Erzeugt 4 Uebergaenge in R und G zugleich (warm, B wie col_surface),
  # Verbraucht 2 in R, G und B zugleich (heller Schieferton, je Stufe +1
  # in jedem Kanal). Aendert sich col_surface, im Bild nachmessen.
  col_tint_solar: "0x36332C"
  col_tint_ink: "0x262B3E"
  col_tint_feed: "0x16342E"
  col_tint_draw: "0x45201D"
  col_tint_end: "0x102028"
  # Schein hinter dem Hausnetz (grad_hub): in RGB565 gleich viele R- und
  # G-Stufen ueber col_bg (je 23) -- so stufen R und G am selben Radius,
  # jeder Ring bleibt im selben warmen Ton. B mit Absicht 3 Stufen ueber
  # col_bg: LVGL rundet beim Mischen ab, bei gleichem B faellt es im
  # Schein um eine Stufe unter col_bg (Blaustich-Ring am Rand).
  col_glow_hub: "0xC07030"
  # Schein der Kachel Tagesertrag (grad_yield). LINEAR mischt je Pixel mit
  # der 8-Bit-Deckkraft, nicht in Mischstufen. In RGB565 liegt G genau
  # doppelt so viele Stufen ueber col_bg wie B (46 zu 23): Jeder Sprung in
  # B faellt auf einen Sprung in G, es gibt keine blaustichige
  # Einzelstufe. R liegt nur 4 Stufen darueber und stuft bis 25 %
  # Deckkraft gar nicht. Werte als Vielfache der Stufen (R 5, G 51,
  # B 26); G und B nahe col_batt, R tiefer. Aendert sich col_bg, neu
  # rechnen und im Bild nachmessen.
  col_glow_yield: "0x28CCD0"
  # Fuellung der getoenten Geraetekaesten im Schema (Wechselrichter,
  # Speicher, Wert auf der Speicherleitung): deckend -- mit bg_opa 7 %
  # schienen die Kugeln, die unter den Kaesten enden, zu 93 % durch. Als
  # 24-Bit-Wert mit wiederholten Bits, also genau der Wert in RGB565.
  # Cyan ist col_bg mit 7 % col_batt, vorgemischt wie LVGL es rechnet:
  # 7 % = Deckkraft 17, Mischstufe (17 + 4) >> 3 = 2 von 32, je Kanal
  # col_bg + (Ton - col_bg) x 2 / 32, abgerundet: R/G/B 1/7/4.
  # Gold (col_full und col_solar gemeinsam) ist KEINE solche Mischung:
  # Die ergab 2/7/3, tuerkis (Farbwinkel 171 Grad in LCh), weil RGB565
  # G mit 6 Bit fuehrt, R nur mit 5 -- so dunkle warme Mischungen fallen
  # auf G-Stufen. Gewaehlt ist 4/6/2: L* 9,1 (vorher 9,0), 66 Grad
  # (Orange-Braun), R5 nicht unter G6 / 2. Der Schein grad_box_long_*
  # stuft darauf in 6 Stufen bis 66/48/16 (col_full) bzw. 66/52/16
  # (col_solar), jede zwischen 72 und 89 Grad. Aendert sich ein Ton,
  # jede Stufe im Bild nachmessen.
  col_box_full: "0x211810"
  col_box_solar: "0x211810"
  col_box_batt: "0x081C21"
  # Auslauf der Dachgruppen (grad_lit_*): Unter 75 % der Hoehe mischt der
  # Verlauf diesen Rotorange-Ton statt col_full/col_solar ueber col_bg.
  # col_bg ist blaustichig (G ueber R); Gold stufte dort zuerst in G, die
  # unteren Stufen wurden gruen (143..199 Grad). Dieser Ton stuft zuerst
  # in R: warm bis 33/28/24 (67 Grad), dann neutral 24/24/24 und 16/20/24
  # in col_bg. Die ersten Stufen ueber col_bg koennen in RGB565 nicht
  # warm sein (einzeln +R, +G oder -B). G nur wenig ueber col_bg, B nicht
  # darunter -- sonst faellt B schon bei kleinster Deckkraft (gruenlich).
  col_lit_tail: "0xE83020"

  # --- Fremde Oberflaechen ----------------------------------------------
  # Zwei Detailseiten lehnen sich an die Oberflaeche des jeweiligen Geraets
  # an (Wunsch des Nutzers, 24.09.2026). Nur dort verwenden.
  # evcc: Akzentgruen im Dunkelmodus (--evcc-dark-green in
  # assets/css/app.css von evcc 0.316.0).
  col_evcc: "0x0FDE41"
  # Energiefluss (Seite Haus), ebenda: Speicher --evcc-darker-green,
  # Einspeisung --evcc-yellow, Netz im Dunkelmodus --bs-gray-medium.
  col_evcc_battery: "0x0BA631"
  col_evcc_export: "0xFAF000"
  col_evcc_grid: "0x93949E"
  # Nilan CTS700 Touch (Compact P): Toene der Startseite, aus dem Bild in
  # der Nilan-Bedienungsanleitung Compact P (Version 1.10, 2017-04)
  # abgelesen -- keine offiziellen Farbwerte. Auf Wunsch des Nutzers
  # (24.09.2026) steht die Seite auf dem Dashboard-Grund statt auf dem
  # Nilan-Blaugrau; Haus und Warmwasserkachel sind dafuer abgedunkelt,
  # damit weisse Schrift traegt (WCAG, gerechnet): Haus 6,5:1, Kachel
  # 8,2:1. Die Kachel hebt sich vom Haus nur 1,3:1 ab, deshalb der Rand
  # im hellen Nilan-Graublau. Sonne gelb, runde Taste hellgrau wie im
  # Bedienteil.
  col_nilan_house: "0x2E6B1E"
  col_nilan_tank: "0x34526A"
  col_nilan_tank_edge: "0x6C92A5"
  col_nilan_sun: "0xF6E70D"
  col_nilan_button: "0xBFC4CA"

  # --- Systemzustand -----------------------------------------------------
  # Nach so vielen Sekunden ohne neue Werte gilt eine Quelle als
  # ueberfaellig (Symbol gelb, eine Meldung). 300 = 5 min.
  data_stale_s: "300"

  # --- Abstaende und Radien --------------------------------------------
  # Aussenrand 4 px. Das Panel hat einen physischen Rahmen, ein zusaetzlicher
  # gezeichneter Rand kostet nur Flaeche, die Schema und Kacheln brauchen.
  pad_page: "4"
  pad_tile: "10"
  gap_tile: "8"
  radius_tile: "11"
  radius_box: "10"

  # --- Meldungen --------------------------------------------------------
  # Hoechstzahl der Zeilen der Meldungsliste: alert_push (max_runs und
  # Obergrenze) und on_add der Liste in .pv-dashboard_page_alerts.yaml.
  alert_max: "50"

  # --- Verhalten bei Untaetigkeit ---------------------------------------
  # Ein Wert fuer zwei Reaktionen, die zusammen ausgeloest werden sollen:
  # Abdunkeln (.pv-dashboard_display.yaml, nur Geraet) und Rueckfall auf die
  # Uebersicht (.pv-dashboard_ui.yaml, auch im Simulator).
  idle_timeout: "240s"
  # Helligkeit im abgedunkelten Zustand. Prozentwert = Duty, siehe die
  # Kalibrierung in .pv-dashboard_display.yaml.
  idle_brightness: "30%"
