##############################################################################
# Package: Seite 8 -- Haus
#
# Aufbau nach dem Energiefluss von evcc (Wunsch des Nutzers, 24.09.2026):
# oben der Balken wie evcc ihn zeichnet, darunter die ausgeklappte Tabelle
# In / Out, dazu der aktuelle Verbrauch mit seiner Herkunft und der
# Verbrauch der letzten 24 Stunden. Die Verbraucher der Festlegung vom
# 30.07.2026 (vier Geraete und Grundlast, docs/06) stehen als dritte
# Spalte der Tabelle, so wie evcc den Verbrauch in Verbraucher aufklappt;
# die Waermepumpe steht dort mit.
#
# Vorbild im evcc-Quelltext (Stand 24.09.2026, assets/js/components/
# Energyflow/): Visualization.vue, LabelBar.vue, Energyflow.vue, Entry.vue.
# Uebernommen:
#   - ein Balken aus Eigenverbrauch PV, Eigenverbrauch Speicher, Netzbezug
#     und Einspeisung, Breite = Anteil an der Summe; Wert im Segment ab
#     50 px, mit Einheit ab 80 px (evcc: 40 / 60 bei kleinerer Schrift)
#   - darueber "In" (PV, Speicher entladen, Netz), darunter "Out" (Haus,
#     Ladepunkte, Speicher laden, Einspeisung) als Klammern mit Symbol;
#     unter 40 px ohne Symbol, unter 16 px gar nicht
#   - Legende Eigenverbrauch und Netzbezug bzw. Einspeisung
#   - Tabelle mit Symbol, Name, Zusatzangabe, Leistung; Zeilen unter 10 W
#     grau; Unterzeilen je Speicher und je Ladepunkt
#   - Leistung unter 1000 W ganzzahlig in W, sonst in kW mit einer Stelle
#   - Farben aus assets/css/app.css (col_evcc*, Dunkelmodus)
# "In" und "Out" stehen in evcc auch im deutschen Oberflaechentext so da.
# evcc nennt den Hausverbrauch "Verbrauch"; er enthaelt hier wie dort alles
# ausser Ladepunkten und Speicher, also auch die Waermepumpe.
#
# Fuenf Skripte gehoeren dazu; kuenftige Sensoren rufen nur diese auf,
# bis dahin stehen Striche:
#   house_flow     Energiefluss, Tabelle In / Out, Verbrauch jetzt
#   house_battery  Unterzeile je Speicher
#   house_loadpoint Unterzeile je Ladepunkt
#   house_update   Verbraucher (dritte Spalte)
#   house_history  Verbrauch der letzten 24 Stunden
#
# Flaeche x 4..1276, y 84..736.
#   Fluss        x 4, y 84, 1272 x 150, innen 1250 x 128:
#                Titel 0..17, obere Klammern 32..44 (Symbol 20..44),
#                Balken 52..92, untere Klammern 100..112 (Symbol
#                100..124); Balken 1200 breit, rechts In / Out
#   Tabelle      x 4, y 242, 1272 x 244, innen 1250 x 222: drei Spalten je
#                410, Abstand 10; Kopf 0..29 (f_bar), Linie 34, sechs
#                Zeilen im Raster 30 ab 42 -> letzte endet 222
#   Jetzt        x 4, y 494, 312 x 242, innen 290 x 220: Titel 0..17,
#                Wert 34..73 (f_val_xl), Einheit 75..92, Anteilsbalken
#                104..114, drei Zeilen im Raster 30 ab 128 -> 209
#   24 Stunden   x 324, y 494, 952 x 242, innen 930 x 220: Titel 0..17,
#                Balken 30..186 (156), Stunden 193..210
##############################################################################

##############################################################################
# Standardbeschriftungen (Demo-Anlage)
#
# Die fuenf Namen stehen nur auf dieser Seite. Eigene Namen gehoeren in
# .pv-dashboard_anlage.yaml und stechen diese Standards (docs/01).
# Gemessen gegen die Namensspalte der Tabelle (f_text_s, 168 px).
##############################################################################

substitutions:
  name_oven: "Backofen"            #  64 von 168
  name_washer: "Waschmaschine"     # 111 von 168
  name_dishwasher: "Spülmaschine"  #  97 von 168
  name_dryer: "Trockner"           #  62 von 168
  name_baseload: "Grundlast"       #  67 von 168

script:
  # ---------------------------------------------------------------------
  # Energiefluss des Hausnetzes, Leistungen in W (>= 0), wie evcc sie
  # fuehrt (Site):
  #   pv          PV-Erzeugung im Hausnetz-Kreis (ohne Volleinspeisung)
  #   bat_out     Speicher entladen        bat_in    Speicher laden
  #   grid_in     Netzbezug                grid_out  Einspeisung
  #   home        Verbrauch (alles ausser Ladepunkten und Speicher)
  #   loadpoints  beide Ladepunkte zusammen
  #   soc         Ladestand der Speicher zusammen in %
  #   forecast    Restprognose PV heute in kWh
  #   price_grid  Bezugspreis in ct/kWh    price_feed Verguetung in ct/kWh
  #   price_home  Preis des Verbrauchs in ct/kWh (Mischpreis, wie evcc)
  #   NAN = kein Wert (Striche). Stimmen In und Out nicht ueberein, zeigt
  #   der Balken nur, was da ist; einen Unbekannt-Anteil wie evcc gibt es
  #   hier nicht.
  # ---------------------------------------------------------------------
  - id: house_flow
    parameters:
      pv: float
      bat_out: float
      grid_in: float
      home: float
      loadpoints: float
      bat_in: float
      grid_out: float
      soc: float
      forecast: float
      price_grid: float
      price_home: float
      price_feed: float
    then:
      - lambda: |-
          id(data_seen)[4] = millis();  // Datenalter, sys_refresh
          // Formate: fmt_power (W / kW wie evcc) und fmt_num
          // (Dezimalkomma), beide in .pv-dashboard_ui.yaml
          auto &pw = id(fmt_power);
          auto &num = id(fmt_num);
          // Zeile unter 10 W grau wie in evcc
          auto shade = [](lv_obj_t *name, lv_obj_t *val, float v) {
            const bool on = std::isfinite(v) && v > 10.0f;
            lv_obj_set_style_text_color(name, on ? lv_color_hex($col_ink) : lv_color_hex($col_ink3), 0);
            lv_obj_set_style_text_color(val, on ? lv_color_hex($col_ink) : lv_color_hex($col_ink3), 0);
          };
          auto z = [](float v) -> float { return !std::isfinite(v) ? 0.0f : std::max(v, 0.0f); };
          const float p = z(pv), bo = z(bat_out), gi = z(grid_in), h = z(home), lp = z(loadpoints),
                      bi = z(bat_in), go = z(grid_out);
          // Aufteilung wie evcc (Visualization.vue)
          const float consumption = h + lp + bi;
          const float self_pv = std::min(p, consumption);
          const float self_bat = std::min(bo, std::max(consumption - self_pv, 0.0f));
          const float total = gi + self_pv + self_bat + go;

          // --- Balken: Segmente 0 PV, 1 Speicher, 2 Netz, 3 Einspeisung
          const int W = 1200;
          lv_obj_t *const seg[4] = {id(hf_seg_0), id(hf_seg_1), id(hf_seg_2), id(hf_seg_3)};
          lv_obj_t *const segl[4] = {id(hf_seg_lbl_0), id(hf_seg_lbl_1), id(hf_seg_lbl_2), id(hf_seg_lbl_3)};
          float part[4] = {self_pv, self_bat, gi, go};
          if (total <= 0.0f) {
            // wie evcc: leer = ein graues Netzsegment mit 0 W
            part[0] = part[1] = part[3] = 0.0f;
            part[2] = 1.0f;
          }
          const float sum = total <= 0.0f ? 1.0f : total;
          const float peak = std::max(std::max(part[0], part[1]), std::max(part[2], part[3]));
          int x = 0;
          for (int i = 0; i < 4; i++) {
            int sw = (int) lroundf(part[i] / sum * W);
            if (x + sw > W)
              sw = W - x;
            lv_obj_set_x(seg[i], x);
            lv_obj_set_width(seg[i], sw);
            if (sw <= 0)
              lv_obj_add_flag(seg[i], LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_clear_flag(seg[i], LV_OBJ_FLAG_HIDDEN);
            x += sw;
            // Wert ab 50 px, Einheit ab 80 px (evcc: 40 / 60 bei kleinerer
            // Schrift); Einheit nach dem groessten
            // Segment wie evcc (getPowerUnit)
            std::string t;
            if (sw > 50) {
              const float v = total <= 0.0f ? 0.0f : part[i];
              char b[24];
              if (peak < 999.5f || total <= 0.0f)
                snprintf(b, sizeof(b), sw > 80 ? "%.0f W" : "%.0f", v);
              else
                snprintf(b, sizeof(b), sw > 80 ? "%.1f kW" : "%.1f", v / 1000.0f);
              for (char *q = b; *q; q++)
                if (*q == '.')
                  *q = ',';
              t = b;
            }
            lv_label_set_text(segl[i], t.c_str());
          }

          // --- Klammern: oben In, unten Out
          auto bracket = [&](lv_obj_t *br, lv_obj_t *ic, int &bx, float v) {
            const int bw = (int) lroundf(v / sum * W);
            if (bw < 16 || total <= 0.0f) {
              lv_obj_add_flag(br, LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(ic, LV_OBJ_FLAG_HIDDEN);
            } else {
              lv_obj_clear_flag(br, LV_OBJ_FLAG_HIDDEN);
              lv_obj_set_x(br, bx);
              lv_obj_set_width(br, std::min(bw, W - bx));
              if (bw < 40) {
                lv_obj_add_flag(ic, LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_clear_flag(ic, LV_OBJ_FLAG_HIDDEN);
                lv_obj_set_x(ic, bx + bw / 2 - 16);
              }
            }
            if (total > 0.0f)
              bx += bw;
          };
          int bx = 0;
          bracket(id(hf_in_0), id(hf_in_ic_0), bx, p);
          bracket(id(hf_in_1), id(hf_in_ic_1), bx, bo);
          bracket(id(hf_in_2), id(hf_in_ic_2), bx, gi);
          bx = 0;
          bracket(id(hf_out_0), id(hf_out_ic_0), bx, h);
          bracket(id(hf_out_1), id(hf_out_ic_1), bx, lp);
          bracket(id(hf_out_2), id(hf_out_ic_2), bx, bi);
          bracket(id(hf_out_3), id(hf_out_ic_3), bx, go);

          // Legende rechts: Netzbezug, sonst Einspeisung
          const bool importing = gi > 0.0f || go <= 0.0f;
          lv_label_set_text(id(hf_leg_2), importing ? "Netzbezug" : "Einspeisung");
          lv_obj_set_style_bg_color(id(hf_leg_sq_2), importing ? lv_color_hex($col_evcc_grid) : lv_color_hex($col_evcc_export), 0);

          // --- Tabelle In / Out
          const bool any_in = std::isfinite(pv) || std::isfinite(bat_out) || std::isfinite(grid_in);
          const bool any_out = std::isfinite(home) || std::isfinite(loadpoints) || std::isfinite(bat_in) || std::isfinite(grid_out);
          // Ein leerer Summand (val_leer, -inf) macht die Summe leer
          const bool leer_in = std::isinf(pv) || std::isinf(bat_out) || std::isinf(grid_in);
          const bool leer_out = std::isinf(home) || std::isinf(loadpoints) || std::isinf(bat_in) || std::isinf(grid_out);
          lv_label_set_text(id(ht_in_total), leer_in ? "" : (any_in ? pw(p + bo + gi).c_str() : "--"));
          lv_label_set_text(id(ht_out_total), leer_out ? "" : (any_out ? pw(h + lp + bi + go).c_str() : "--"));
          lv_label_set_text(id(ht_pv), pw(pv).c_str());
          lv_label_set_text(id(ht_bat_out), pw(bat_out).c_str());
          lv_label_set_text(id(ht_grid_in), pw(grid_in).c_str());
          lv_label_set_text(id(ht_home), pw(home).c_str());
          lv_label_set_text(id(ht_lp), pw(loadpoints).c_str());
          lv_label_set_text(id(ht_bat_in), pw(bat_in).c_str());
          lv_label_set_text(id(ht_grid_out), pw(grid_out).c_str());
          shade(id(ht_pv_n), id(ht_pv), pv);
          shade(id(ht_bat_out_n), id(ht_bat_out), bat_out);
          shade(id(ht_grid_in_n), id(ht_grid_in), grid_in);
          shade(id(ht_home_n), id(ht_home), home);
          shade(id(ht_lp_n), id(ht_lp), loadpoints);
          shade(id(ht_bat_in_n), id(ht_bat_in), bat_in);
          shade(id(ht_grid_out_n), id(ht_grid_out), grid_out);
          lv_label_set_text(id(ht_pv_d), ("Rest " + num(forecast, "%.1f", "--,-") + " kWh").c_str());
          lv_label_set_text(id(ht_bat_out_d), (num(soc, "%.0f", "--") + " %").c_str());
          lv_label_set_text(id(ht_bat_in_d), (num(soc, "%.0f", "--") + " %").c_str());
          lv_label_set_text(id(ht_grid_in_d), (num(price_grid, "%.1f", "--,-") + " ct/kWh").c_str());
          lv_label_set_text(id(ht_home_d), (num(price_home, "%.1f", "--,-") + " ct/kWh").c_str());
          lv_label_set_text(id(ht_grid_out_d), (num(price_feed, "%.1f", "--,-") + " ct/kWh").c_str());

          // --- Verbrauch jetzt: Haus und Ladepunkte, Herkunft wie evcc
          // (erst PV, dann Speicher, Rest Netz); Speicherladen zaehlt nicht
          const bool known = std::isfinite(home);
          const float c = h + lp;
          const float c_pv = std::min(p, c);
          const float c_bat = std::min(bo, c - c_pv);
          const float c_grid = std::max(c - c_pv - c_bat, 0.0f);
          if (!known) {
            lv_label_set_text(id(hn_value), std::isinf(home) ? "" : "--");
            lv_label_set_text(id(hn_unit), "kW");
          } else if (c < 999.5f) {
            lv_label_set_text(id(hn_value), num(c, "%.0f", "--").c_str());
            lv_label_set_text(id(hn_unit), "W · Haus und Ladepunkte");
          } else {
            lv_label_set_text(id(hn_value), num(c / 1000.0f, "%.1f", "--").c_str());
            lv_label_set_text(id(hn_unit), "kW · Haus und Ladepunkte");
          }
          const float cs = c > 0.0f ? c : 1.0f;
          const int s0 = known ? (int) lroundf(c_pv / cs * 100.0f) : -1;
          const int s1 = known ? (int) lroundf(c_bat / cs * 100.0f) : -1;
          const int s2 = known ? std::max(100 - s0 - s1, 0) : -1;
          lv_obj_t *const pct[3] = {id(hn_pct_0), id(hn_pct_1), id(hn_pct_2)};
          const int sh[3] = {s0, s1, (known && c > 0.0f) ? s2 : 0};
          for (int i = 0; i < 3; i++) {
            if (!known)
              lv_label_set_text(pct[i], std::isinf(home) ? "" : "-- %");
            else
              lv_label_set_text_fmt(pct[i], "%d %%", c > 0.0f ? sh[i] : 0);
          }
          // Anteilsbalken 290 breit
          lv_obj_t *const sb[3] = {id(hn_bar_0), id(hn_bar_1), id(hn_bar_2)};
          int sx = 0;
          for (int i = 0; i < 3; i++) {
            int sw = (known && c > 0.0f) ? (int) lroundf(sh[i] * 290 / 100.0f) : 0;
            if (i == 2 && known && c > 0.0f)
              sw = 290 - sx;
            if (sx + sw > 290)
              sw = 290 - sx;
            lv_obj_set_x(sb[i], sx);
            lv_obj_set_width(sb[i], std::max(sw, 0));
            if (sw <= 0)
              lv_obj_add_flag(sb[i], LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_clear_flag(sb[i], LV_OBJ_FLAG_HIDDEN);
            sx += std::max(sw, 0);
          }

  # ---------------------------------------------------------------------
  # Unterzeile je Speicher unter "Speicher entladen", wie evcc sie je
  # Batterie aufklappt:
  #   bat    0..2 = Speicher 1..3 (name_bat_1..3)
  #   power  Leistung in W, positiv = entladen, negativ = laden
  #   soc    Ladestand in %
  # ---------------------------------------------------------------------
  - id: house_battery
    parameters:
      bat: int
      power: float
      soc: float
    then:
      - lambda: |-
          if (bat < 0 || bat > 2)
            return;
          // Formate: fmt_power (W / kW wie evcc) und fmt_num
          // (Dezimalkomma), beide in .pv-dashboard_ui.yaml
          auto &pw = id(fmt_power);
          auto &num = id(fmt_num);
          // Zeile unter 10 W grau wie in evcc
          auto shade = [](lv_obj_t *name, lv_obj_t *val, float v) {
            const bool on = std::isfinite(v) && v > 10.0f;
            lv_obj_set_style_text_color(name, on ? lv_color_hex($col_ink) : lv_color_hex($col_ink3), 0);
            lv_obj_set_style_text_color(val, on ? lv_color_hex($col_ink) : lv_color_hex($col_ink3), 0);
          };
          lv_obj_t *const val[3] = {id(ht_b1), id(ht_b2), id(ht_b3)};
          lv_obj_t *const nam[3] = {id(ht_b1_n), id(ht_b2_n), id(ht_b3_n)};
          lv_obj_t *const det[3] = {id(ht_b1_d), id(ht_b2_d), id(ht_b3_d)};
          lv_label_set_text(val[bat], pw(!std::isfinite(power) ? power : fabsf(power)).c_str());
          std::string d = num(soc, "%.0f", "--") + " %";
          if (std::isfinite(power) && fabsf(power) > 10.0f)
            d += power > 0.0f ? " · entlädt" : " · lädt";
          lv_label_set_text(det[bat], d.c_str());
          shade(nam[bat], val[bat], !std::isfinite(power) ? NAN : fabsf(power));

  # ---------------------------------------------------------------------
  # Unterzeile je Ladepunkt unter "Ladepunkte":
  #   wb     0..1 = Wallbox 1..2 (name_wb_1..2)
  #   power  Ladeleistung in W
  #   soc    Ladestand des Fahrzeugs in %, NAN = keins verbunden
  # ---------------------------------------------------------------------
  - id: house_loadpoint
    parameters:
      wb: int
      power: float
      soc: float
    then:
      - lambda: |-
          if (wb < 0 || wb > 1)
            return;
          // Formate: fmt_power (W / kW wie evcc) und fmt_num
          // (Dezimalkomma), beide in .pv-dashboard_ui.yaml
          auto &pw = id(fmt_power);
          auto &num = id(fmt_num);
          // Zeile unter 10 W grau wie in evcc
          auto shade = [](lv_obj_t *name, lv_obj_t *val, float v) {
            const bool on = std::isfinite(v) && v > 10.0f;
            lv_obj_set_style_text_color(name, on ? lv_color_hex($col_ink) : lv_color_hex($col_ink3), 0);
            lv_obj_set_style_text_color(val, on ? lv_color_hex($col_ink) : lv_color_hex($col_ink3), 0);
          };
          lv_obj_t *const val[2] = {id(ht_w1), id(ht_w2)};
          lv_obj_t *const nam[2] = {id(ht_w1_n), id(ht_w2_n)};
          lv_obj_t *const det[2] = {id(ht_w1_d), id(ht_w2_d)};
          lv_label_set_text(val[wb], pw(power).c_str());
          lv_label_set_text(det[wb], std::isnan(soc) ? "kein Fahrzeug" : (num(soc, "%.0f", "--") + " %").c_str());
          shade(nam[wb], val[wb], power);
          // Kopfzeile: wie viele laden gerade (evcc zaehlt ab 10 W)
          static float lpw[2] = {NAN, NAN};
          lpw[wb] = power;
          int active = 0;
          for (float v : lpw)
            if (std::isfinite(v) && v > 10.0f)
              active++;
          lv_label_set_text_fmt(id(ht_lp_d), "%d aktiv", active);

  # ---------------------------------------------------------------------
  # Werte eines Verbrauchers (dritte Spalte der Tabelle):
  #   dev 0..5 = Waermepumpe, Backofen, Waschmaschine, Spuelmaschine,
  #              Trockner, Grundlast (name_heatpump, name_oven ..
  #              name_baseload)
  #   power    momentane Leistung in W
  #   energy   Verbrauch heute in kWh
  #   NAN = kein Wert (Striche)
  # Die Kopfzeile zeigt die Summe, sobald alle sechs Werte da sind (ohne
  # Waermepumpe laut dev_present: die uebrigen fuenf).
  # ---------------------------------------------------------------------
  - id: house_update
    parameters:
      dev: int
      power: float
      energy: float
    then:
      - lambda: |-
          if (dev < 0 || dev > 5)
            return;
          // Formate: fmt_power (W / kW wie evcc) und fmt_num
          // (Dezimalkomma), beide in .pv-dashboard_ui.yaml
          auto &pw = id(fmt_power);
          auto &num = id(fmt_num);
          // Zeile unter 10 W grau wie in evcc
          auto shade = [](lv_obj_t *name, lv_obj_t *val, float v) {
            const bool on = std::isfinite(v) && v > 10.0f;
            lv_obj_set_style_text_color(name, on ? lv_color_hex($col_ink) : lv_color_hex($col_ink3), 0);
            lv_obj_set_style_text_color(val, on ? lv_color_hex($col_ink) : lv_color_hex($col_ink3), 0);
          };
          lv_obj_t *const val[6] = {id(ht_c1), id(ht_c2), id(ht_c3), id(ht_c4), id(ht_c5), id(ht_c6)};
          lv_obj_t *const nam[6] = {id(ht_c1_n), id(ht_c2_n), id(ht_c3_n), id(ht_c4_n), id(ht_c5_n), id(ht_c6_n)};
          lv_obj_t *const det[6] = {id(ht_c1_d), id(ht_c2_d), id(ht_c3_d), id(ht_c4_d), id(ht_c5_d), id(ht_c6_d)};
          lv_label_set_text(val[dev], pw(power).c_str());
          lv_label_set_text(det[dev], (num(energy, "%.1f", "--,-") + " kWh heute").c_str());
          shade(nam[dev], val[dev], power);
          static float now[6] = {NAN, NAN, NAN, NAN, NAN, NAN};
          now[dev] = power;
          // Summe: fehlt ein Wert noch (NAN), Striche; ist einer leer
          // (val_leer, -inf: Entitaet fehlt), bleibt auch die Summe leer
          float sum = 0.0f;
          bool all = true, leer = false;
          for (int k = 0; k < 6; k++) {
            // Ohne Waermepumpe (dev_present, Bit 17) zaehlt ihre Zeile nicht
            if (k == 0 && !(id(dev_present) & (1u << 17)))
              continue;
            if (std::isinf(now[k]))
              leer = true;
            else if (std::isnan(now[k]))
              all = false;
            else
              sum += now[k];
          }
          lv_label_set_text(id(ht_c_total), leer ? "" : (all ? pw(sum).c_str() : "--"));

  # ---------------------------------------------------------------------
  # Verbrauch der letzten 24 Stunden, je Stunde in kWh:
  #   home   24 Werte, kommagetrennt, aelteste zuerst, letzte = laufende
  #          Stunde; Verbrauch wie in house_flow (Haus und Ladepunkte)
  #   solar  24 Werte ebenso: davon aus PV gedeckt
  #   hour   Uhrzeit (Stunde 0..23) des letzten Werts
  # Fehlende oder leere Werte zaehlen als 0. Beispiel im Screenshot-Lauf.
  # Die Reihe wird nicht gespeichert; wer sie ueber einen Neustart
  # braucht, legt sie wie day_curve als text-Entitaet an (docs/06).
  # ---------------------------------------------------------------------
  - id: house_history
    parameters:
      home: string
      solar: string
      hour: int
    then:
      - lambda: |-
          auto parse = [](const std::string &s, float *out) {
            const char *q = s.c_str();
            for (int i = 0; i < 24; i++) {
              char *end = nullptr;
              const float v = strtof(q, &end);
              out[i] = (end == q || !std::isfinite(v)) ? 0.0f : std::max(v, 0.0f);
              q = end;
              while (*q == ',' || *q == ' ')
                q++;
            }
          };
          float hm[24], so[24];
          parse(home, hm);
          parse(solar, so);
          float peak = 0.1f;
          for (float v : hm)
            peak = std::max(peak, v);
          lv_obj_t *const pv[24] = {id(hc_pv_00), id(hc_pv_01), id(hc_pv_02), id(hc_pv_03), id(hc_pv_04), id(hc_pv_05), id(hc_pv_06), id(hc_pv_07), id(hc_pv_08), id(hc_pv_09), id(hc_pv_10), id(hc_pv_11), id(hc_pv_12), id(hc_pv_13), id(hc_pv_14), id(hc_pv_15), id(hc_pv_16), id(hc_pv_17), id(hc_pv_18), id(hc_pv_19), id(hc_pv_20), id(hc_pv_21), id(hc_pv_22), id(hc_pv_23)};
          lv_obj_t *const rest[24] = {id(hc_rest_00), id(hc_rest_01), id(hc_rest_02), id(hc_rest_03), id(hc_rest_04), id(hc_rest_05), id(hc_rest_06), id(hc_rest_07), id(hc_rest_08), id(hc_rest_09), id(hc_rest_10), id(hc_rest_11), id(hc_rest_12), id(hc_rest_13), id(hc_rest_14), id(hc_rest_15), id(hc_rest_16), id(hc_rest_17), id(hc_rest_18), id(hc_rest_19), id(hc_rest_20), id(hc_rest_21), id(hc_rest_22), id(hc_rest_23)};
          const int H = 156, BASE = 186;
          for (int i = 0; i < 24; i++) {
            const float s = std::min(so[i], hm[i]);
            const int th = (int) lroundf(hm[i] / peak * H);
            const int sh = std::min((int) lroundf(s / peak * H), th);
            lv_obj_set_y(pv[i], BASE - sh);
            lv_obj_set_height(pv[i], sh);
            lv_obj_set_y(rest[i], BASE - th);
            lv_obj_set_height(rest[i], th - sh);
            if (sh <= 0)
              lv_obj_add_flag(pv[i], LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_clear_flag(pv[i], LV_OBJ_FLAG_HIDDEN);
            if (th - sh <= 0)
              lv_obj_add_flag(rest[i], LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_clear_flag(rest[i], LV_OBJ_FLAG_HIDDEN);
          }
          char b[32];
          snprintf(b, sizeof(b), "max %.1f kWh", peak);
          for (char *q = b; *q; q++)
            if (*q == '.')
              *q = ',';
          lv_label_set_text(id(hc_max), b);
          // Stundenmarken unter jedem dritten Balken
          lv_obj_t *const tick[8] = {id(hc_tick_0), id(hc_tick_1), id(hc_tick_2), id(hc_tick_3), id(hc_tick_4), id(hc_tick_5), id(hc_tick_6), id(hc_tick_7)};
          const int last = ((hour % 24) + 24) % 24;
          for (int k = 0; k < 8; k++) {
            const int i = 2 + 3 * k;
            lv_label_set_text_fmt(tick[k], "%02d", (last - 23 + i + 48) % 24);
          }

