      - lvgl.widget.hide: sys_panel

      # Kleinere Anlage ueber dieselbe Maske, die am Geraet die
      # Referenz-Entitaeten setzen (dev_present, Bits in
      # .pv-dashboard_ui.yaml): nur der
      # Voll-WR mit seinen zwei Flaechen, Speicher 1 und 2, Wallbox 1 und
      # die beiden Zaehler. Alles andere bleibt an seinem Platz, aber
      # unsichtbar -- Kaesten, Werte, Leitungen, Kugeln. Zuletzt im Lauf,
      # damit die Stoerung von Wechselrichter 4 (dev_apply nimmt sie beim
      # Ausblenden aus den Meldungen) die Bilder davor nicht aendert.
      - lvgl.page.show: page_overview
      - script.execute: shots_nav_clear
      - lvgl.matrix.button.update: { id: btn_nav_overview, control: { checked: true } }
      - lambda: |-
          id(dev_present) = (1u << 0) | (1u << 1) | (1u << 8) | (1u << 12) | (1u << 13) |
                            (1u << 15) | (1u << 18) | (1u << 19);
      - script.execute: dev_apply
      # Wert weg, Geraet bleibt: Ertrag WR 1, Spannung Speicher 2 und
      # Leistung Hauszaehler leer (Entitaet nicht belegt/nicht verfuegbar)
      - script.execute: { id: ov_inverter, n: 0, power: 6214, energy: !lambda 'return id(val_leer);' }
