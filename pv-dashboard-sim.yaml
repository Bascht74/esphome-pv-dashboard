##############################################################################
# Simulator: dieselbe Oberflaeche in einem Fenster auf dem Rechner
#
# Kein Drittanbieter-Tool noetig -- ESPHome bringt das selbst mit: die
# host-Plattform kompiliert fuer den Rechner, das sdl-Display oeffnet ein
# Fenster, der sdl-Touchscreen macht Mausklicks zu Beruehrungen.
#
#   ~/.venvs/esphome-beta/bin/esphome run pv-dashboard-sim.yaml
#
# Der volle Pfad ist nur die hiesige Arbeitsumgebung: Auf diesem Rechner gibt
# es kein "esphome" im PATH, und ~/.venvs/esphome-beta enthaelt ESPHome
# 2026.9.0 (stabil), passend zur min_version unten. Wer ein "esphome" im PATH
# hat, ruft einfach "esphome run pv-dashboard-sim.yaml" auf.
#
# F12 im Fenster speichert das aktuelle Bild als BMP (Name mit Zeitstempel)
# unter .esphome/snapshots/pv-dashboard-sim/; die Umgebungsvariable
# ESPHOME_SNAPSHOT_DIR lenkt es in einen anderen Ordner. Alle Seiten auf
# einmal und ohne Fenster: pv-dashboard-shots.yaml; Einzelheiten zur Kette bis
# zum ansehbaren Bild in docs/03.
#
# Oberflaeche, Schriften und Farben kommen aus denselben Packages wie beim
# echten Panel. Wer hier etwas aendert, aendert es dort mit.
#
# Was der Simulator NICHT zeigt: die tatsaechliche Bildrate auf dem P4 und
# alles Hardwarenahe (Backlight, Audio, Modbus, BLE).
##############################################################################

substitutions:
  upper_devicename: PV-Dashboard Simulator
  devicename: pv-dashboard-sim
  device_description: "Oberflaechen-Simulator für das 10,1-Zoll-Panel"

esphome:
  name: "${devicename}"
  friendly_name: "${upper_devicename}"
  comment: "${device_description}"
  min_version: 2026.9.0

host:

logger:
  level: DEBUG

# Fenster statt Panel. Groesse exakt wie das Geraet im Querformat.
display:
  - platform: sdl
    id: main_display
    # F12 = Screenshot. ESPHome 2026.9 meldet beim Pruefen, dass es den Wert
    # wegen "_key" im Namen schwaerzt -- nur Kosmetik der Config-Ausgabe.
    snapshot_key: SDLK_F12
    dimensions:
      width: 1280
      height: 800

touchscreen:
  - platform: sdl
    id: main_touchscreen

# Auf dem Geraet kommt die Zeit von Home Assistant, hier von der Systemuhr des
# Rechners. Beide tragen dieselbe ID, damit die Uhr in .pv-dashboard_ui.yaml
# unveraendert auf beiden Seiten laeuft.
time:
  - platform: host
    id: dash_time
    timezone: Europe/Berlin
    on_time_sync:
      - then:
          - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock
      # Zur vollen Stunde die Tagesreihe fortschreiben
      - minutes: 0
        seconds: 5
        then:
          - script.execute: record_hour

packages:
  utility: !include .pv-dashboard_utility.yaml
  ui:      !include .pv-dashboard_ui.yaml
