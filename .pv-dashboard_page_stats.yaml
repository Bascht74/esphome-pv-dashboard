  pages:
    - id: page_stats
      bg_color: $col_bg
      scrollable: false
      scroll_dir: NONE
      widgets:
        # ---------------- Kopf mit Summen -----------------------------------
        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            scrollable: false
            scroll_dir: NONE
            x: 4
            y: 84
            width: 1272
            height: 120
            widgets:
              - label: { id: st_title, x: 0, y: 0, width: 860, height: 17, long_mode: DOT, styles: st_label, text: "STATISTIK · WOCHE" }
              # Zeitraum waehlen, gestaltet wie die Reiter unten
              - buttonmatrix:
                  x: 890
                  y: 0
                  width: 360
                  height: 36
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  one_checked: true
                  items:
                    bg_color: $col_surface
                    bg_opa: COVER
                    border_color: $col_line
                    border_width: 1
                    radius: 9
                    text_color: $col_ink2
                    text_font: f_text_s
                    pressed:
                      bg_color: $col_batt
                      bg_opa: 20%
                      text_color: $col_batt
                    checked:
                      bg_color: $col_batt
                      bg_opa: 18%
                      border_color: $col_batt
                      text_color: $col_batt
                  rows:
                    - buttons:
                        - text: "Woche"
                          id: st_btn_0
                          control: { checkable: true, checked: true }
                          on_press:
                            - script.execute: { id: stats_show, range: 0 }
                        - text: "Monat"
