##############################################################################
# Package: Seite 8 -- Statistik
#
# Auf Wunsch des Nutzers (25.09.2026) nach dem Projekt-Review: Erzeugung und
# Verbrauch ueber Woche, Monat und Jahr, wie sie Home Assistant (Energie-
# Dashboard), evcc oder die Portale der Wechselrichter zeigen. Oben die
# Summen des gewaehlten Zeitraums mit Autarkie, Eigenverbrauch und Ertrag,
# unten je Tag bzw. Monat ein Balkenpaar Erzeugung / Verbrauch.
#
# Die Reihen kommen fertig herein (Home Assistant fuehrt die Statistik),
# die Seite rechnet nur Summen und Quoten:
#   Autarkie        = (Verbrauch - Bezug) / Verbrauch
#   Eigenverbrauch  = (Erzeugung - Einspeisung) / Erzeugung
# Welche Kreise in "Erzeugung" stecken, entscheidet der Aufrufer (docs/06).
#
# Zwei Skripte gehoeren dazu:
#   stats_update  eine Reihe (Woche, Monat oder Jahr) setzen
#   stats_show    Zeitraum umschalten (die drei Knoepfe)
# Die Reihen liegen in globals, weil beide Skripte sie brauchen; sie werden
# nicht gespeichert und kommen nach einem Neustart neu von der Quelle.
#
# Flaeche x 4..1276, y 84..736.
#   Kopf     x 4, y 84, 1272 x 120, innen 1250 x 98: Titel 0..17,
#            Knoepfe 360 x 36 rechts oben, fuenf Spalten je 250:
#            Beschriftung 44..64 (f_text_s), Wert 66..96 (f_val_l)
#   Balken   x 4, y 212, 1272 x 524, innen 1250 x 502: Titel 0..17,
#            Balken 40..440 (400), Grundlinie 440, Beschriftung 448..465,
#            bis zu 31 Plaetze
##############################################################################

globals:
  # Je Zeitraum 0 Woche, 1 Monat, 2 Jahr: Beschriftungen und vier Reihen
  # als kommagetrennter Text, dazu Zeitraum-Text und Ertrag in Euro.
  - id: stats_text
    type: std::array<std::string, 18>
    restore_value: false
  - id: stats_money
    type: std::array<float, 3>
    restore_value: false
    initial_value: '{NAN, NAN, NAN}'
  - id: stats_range
    type: int
    restore_value: false
    initial_value: '0'

script:
  # ---------------------------------------------------------------------
  # Eine Reihe setzen:
  #   range   0 = Woche (7 Tage), 1 = Monat (bis 31 Tage), 2 = Jahr (12
  #           Monate)
  #   period  Zeitraum als Text, z. B. "22.09. bis 28.09.2026"
  #   labels  Beschriftungen der Plaetze, kommagetrennt ("Mo,Di,...")
  #   prod, cons, imp, exp
  #           Erzeugung, Verbrauch, Netzbezug, Einspeisung je Platz in kWh,
  #           kommagetrennt, gleich viele Werte wie labels
  #   money   Ertrag des Zeitraums in Euro (Foerderung + Ersparnis - Bezug)
  # ---------------------------------------------------------------------
  - id: stats_update
    parameters:
      range: int
      period: string
      labels: string
      prod: string
      cons: string
      imp: string
      exp: string
      money: float
    then:
      - lambda: |-
          if (range < 0 || range > 2)
            return;
          auto &t = id(stats_text);
          t[range * 6 + 0] = period;
          t[range * 6 + 1] = labels;
          t[range * 6 + 2] = prod;
          t[range * 6 + 3] = cons;
          t[range * 6 + 4] = imp;
          t[range * 6 + 5] = exp;
          id(stats_money)[range] = money;
      - if:
          condition:
            lambda: 'return range == id(stats_range);'
          then:
            - script.execute: stats_redraw

  # ---------------------------------------------------------------------
  # Zeitraum umschalten (Knoepfe oben rechts)
  # ---------------------------------------------------------------------
  - id: stats_show
    parameters:
      range: int
    then:
      - lambda: 'id(stats_range) = std::max(0, std::min(range, 2));'
      # Knoepfe mitziehen, falls der Aufruf nicht vom Knopf selbst kommt
      # (Skript, Home Assistant): erst alle frei, dann den einen gedrueckt.
      - lvgl.matrix.button.update: { id: [st_btn_0, st_btn_1, st_btn_2], control: { checked: false } }
      - if:
          condition:
            lambda: 'return id(stats_range) == 0;'
          then:
            - lvgl.matrix.button.update: { id: st_btn_0, control: { checked: true } }
      - if:
          condition:
            lambda: 'return id(stats_range) == 1;'
          then:
            - lvgl.matrix.button.update: { id: st_btn_1, control: { checked: true } }
      - if:
          condition:
            lambda: 'return id(stats_range) == 2;'
          then:
            - lvgl.matrix.button.update: { id: st_btn_2, control: { checked: true } }
      - script.execute: stats_redraw

  # Zeichnet Kopf und Balken fuer stats_range. Von Hand ruft es niemand.
  - id: stats_redraw
    then:
      - lambda: |-
          const int r = id(stats_range);
          const auto &t = id(stats_text);
          auto parse = [](const std::string &s, float *out, int max) -> int {
            int n = 0;
            const char *q = s.c_str();
            while (*q && n < max) {
              char *end = nullptr;
              const float v = strtof(q, &end);
              if (end == q)
                break;
              out[n++] = std::isnan(v) ? 0.0f : std::max(v, 0.0f);
              q = end;
              while (*q == ',' || *q == ' ')
                q++;
            }
            return n;
          };
          float prod[31] = {0}, cons[31] = {0}, imp[31] = {0}, exp[31] = {0};
          const int n = parse(t[r * 6 + 2], prod, 31);
          parse(t[r * 6 + 3], cons, 31);
          parse(t[r * 6 + 4], imp, 31);
          parse(t[r * 6 + 5], exp, 31);
          // Beschriftungen
          std::string lab[31];
          {
            const std::string &s = t[r * 6 + 1];
            size_t pos = 0;
            for (int i = 0; i < 31 && pos <= s.size(); i++) {
              const size_t c = s.find(',', pos);
              lab[i] = s.substr(pos, c == std::string::npos ? std::string::npos : c - pos);
              if (c == std::string::npos)
                break;
              pos = c + 1;
            }
          }
          float sp = 0, sc = 0, si = 0, se = 0, peak = 0.1f;
          for (int i = 0; i < n; i++) {
            sp += prod[i];
            sc += cons[i];
            si += imp[i];
            se += exp[i];
            peak = std::max(peak, std::max(prod[i], cons[i]));
          }
          // Kopf: Energie unter 1000 kWh mit einer Stelle, darueber ganz
          // mit Tausenderpunkt
          auto kwh = [](float v, bool known) -> std::string {
            if (!known)
              return std::string("--");
            if (v < 999.95f)
              return id(fmt_num)(v, "%.1f", "--");
            return id(fmt_watt)(v, "--");
          };
          const bool known = n > 0;
          lv_label_set_text(id(st_prod), kwh(sp, known).c_str());
          lv_label_set_text(id(st_cons), kwh(sc, known).c_str());
          if (known && sc > 0.0f)
            lv_label_set_text_fmt(id(st_autarky), "%d", (int) lroundf(std::max(sc - si, 0.0f) / sc * 100.0f));
          else
            lv_label_set_text(id(st_autarky), "--");
          if (known && sp > 0.0f)
            lv_label_set_text_fmt(id(st_selfuse), "%d", (int) lroundf(std::max(sp - se, 0.0f) / sp * 100.0f));
          else
            lv_label_set_text(id(st_selfuse), "--");
          lv_label_set_text(id(st_money), id(fmt_num)(id(stats_money)[r], "%.2f", "--,--").c_str());
          static const char *const NAMES[3] = {"STATISTIK · WOCHE", "STATISTIK · MONAT", "STATISTIK · JAHR"};
          std::string head = NAMES[r];
          if (!t[r * 6 + 0].empty())
            head += " · " + t[r * 6 + 0];
          lv_label_set_text(id(st_title), head.c_str());
          lv_label_set_text(id(st_scale), known ? ("Skala bis " + id(fmt_num)(peak, "%.1f", "--") + " kWh").c_str() : "");

          // Balken: n Plaetze auf 1250 px verteilt
          lv_obj_t *const bp[31] = {id(sb_p_00), id(sb_p_01), id(sb_p_02), id(sb_p_03), id(sb_p_04), id(sb_p_05), id(sb_p_06), id(sb_p_07), id(sb_p_08), id(sb_p_09), id(sb_p_10), id(sb_p_11), id(sb_p_12), id(sb_p_13), id(sb_p_14), id(sb_p_15), id(sb_p_16), id(sb_p_17), id(sb_p_18), id(sb_p_19), id(sb_p_20), id(sb_p_21), id(sb_p_22), id(sb_p_23), id(sb_p_24), id(sb_p_25), id(sb_p_26), id(sb_p_27), id(sb_p_28), id(sb_p_29), id(sb_p_30)};
          lv_obj_t *const bc[31] = {id(sb_c_00), id(sb_c_01), id(sb_c_02), id(sb_c_03), id(sb_c_04), id(sb_c_05), id(sb_c_06), id(sb_c_07), id(sb_c_08), id(sb_c_09), id(sb_c_10), id(sb_c_11), id(sb_c_12), id(sb_c_13), id(sb_c_14), id(sb_c_15), id(sb_c_16), id(sb_c_17), id(sb_c_18), id(sb_c_19), id(sb_c_20), id(sb_c_21), id(sb_c_22), id(sb_c_23), id(sb_c_24), id(sb_c_25), id(sb_c_26), id(sb_c_27), id(sb_c_28), id(sb_c_29), id(sb_c_30)};
          lv_obj_t *const bl[31] = {id(sb_l_00), id(sb_l_01), id(sb_l_02), id(sb_l_03), id(sb_l_04), id(sb_l_05), id(sb_l_06), id(sb_l_07), id(sb_l_08), id(sb_l_09), id(sb_l_10), id(sb_l_11), id(sb_l_12), id(sb_l_13), id(sb_l_14), id(sb_l_15), id(sb_l_16), id(sb_l_17), id(sb_l_18), id(sb_l_19), id(sb_l_20), id(sb_l_21), id(sb_l_22), id(sb_l_23), id(sb_l_24), id(sb_l_25), id(sb_l_26), id(sb_l_27), id(sb_l_28), id(sb_l_29), id(sb_l_30)};
          const int H = 400, BASE = 440;
          const float slot = n > 0 ? 1250.0f / n : 1250.0f;
          const int bw = std::min(48, (int) (slot * 0.35f));
          for (int i = 0; i < 31; i++) {
            if (i >= n) {
              lv_obj_add_flag(bp[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(bc[i], LV_OBJ_FLAG_HIDDEN);
              lv_obj_add_flag(bl[i], LV_OBJ_FLAG_HIDDEN);
              continue;
            }
            const int cx = (int) lroundf(slot * i + slot / 2);
            const int hp = (int) lroundf(prod[i] / peak * H);
            const int hc = (int) lroundf(cons[i] / peak * H);
            lv_obj_set_pos(bp[i], cx - bw - 2, BASE - hp);
            lv_obj_set_size(bp[i], bw, std::max(hp, 1));
            lv_obj_set_pos(bc[i], cx + 2, BASE - hc);
            lv_obj_set_size(bc[i], bw, std::max(hc, 1));
            lv_obj_clear_flag(bp[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(bc[i], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_x(bl[i], cx - 30);
            lv_label_set_text(bl[i], lab[i].c_str());
            lv_obj_clear_flag(bl[i], LV_OBJ_FLAG_HIDDEN);
          }

