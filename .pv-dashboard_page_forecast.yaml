##############################################################################
# Package: Seite 3 -- Prognose je Dachflaeche (Solcast)
#
# Auf Wunsch des Nutzers (10.10.2026): je Dachflaeche eine kleine Grafik
# wie das Energie-Dashboard von Home Assistant, dazu oben ein Umschalter
# Heute / Vorschau. Quelle ist je Dach ein eigener Solcast-Eintrag
# (ha_pv<N>_fc_d1 .. _d7, .pv-dashboard_ha.yaml); eine Kachel bekommt jede
# Flaeche, deren Prognose "heute" einen Wert hat -- hoechstens sechs, in
# der Reihenfolge der Flaechen 1..8.
#
#   Heute     je Dach Stundenbalken der Ist-Leistung (Stundenmittel aus der
#             Statistik in kW, laufende Stunde halb deckend), Linie P50
#             (weiss, 3 px), Linie P10 (hell, 2 px, 70 %), Marke jetzt
#             (cyan). Titel: Name, "bisher / Prognose kWh". Kopfzeile:
#             Summe aller Kacheln -- bisher, Prognose, Rest, jetzt.
#   Vorschau  je Dach die kommenden sechs Tage (morgen bis Tag 7) als
#             Balken P50, darin der Teil bis P10 dunkel. Titel: Summe der
#             sechs Tage. Kopfzeile: morgen und sechs Tage ueber alle Daecher.
#
# P90 zeigt die Seite bewusst nicht (Wunsch des Nutzers): P50 ist die
# Erwartung, P10 die vorsichtige Untergrenze.
#
# Massstab: EIN Massstab fuer alle Kacheln (Heute in kW, Vorschau in kWh),
# auf einen runden Wert aufgerundet und in der Legende genannt. So sind die
# Daecher vergleichbar -- ein kleines Dach hat sichtbar kleinere Balken.
#
# Zeitachse Heute: volle Stunden um alle Halbstunden mit Prognose oder Ist
# ueber 0 (gemeinsam fuer alle Kacheln), mindestens 8, hoechstens 20 Stunden.
#
# Skripte (kuenftige Quellen rufen nur diese auf; bis dahin bleibt die
# Seite leer mit Hinweis):
#   fc_roof_fc     Prognose eines Daches (Halbstunden heute, Tage 1..7)
#   fc_roof_hours  Stundenmittel heute und laufende Stunde eines Daches
#   fc_roof_rows   5-min-Zeilen der laufenden Stunde je Dach (Live-Fuellung)
#   fc_roof_live   Leistung jetzt und Ertrag heute eines Daches
#   fc_mode_set    Heute (0) / Vorschau (1)
#   fc_redraw      Kacheln anordnen und zeichnen (ruft fc_text)
#   fc_text        nur die Texte (Kopfzeile, Kacheltitel)
#
# Rest heute (Entscheidung des Nutzers, 11.10.2026): EINE Rechnung fuer
# alle Stellen, fc_rest -- P50 der Halbstunden ab jetzt, die laufende
# anteilig. Seite Prognose und Seite PV ueber alle Daecher, Statusleiste
# und Haus ueber die Daecher des Hausnetz-Kreises (fc_rest_house), sonst
# die Solcast-Entitaet. Alle Stellen schreibt fc_redraw nach neuen Daten
# neu, dazu das interval unten bei jedem Minutenwechsel. Halbstunden, die
# nicht von heute sind, zaehlen nicht (fc_sys_day, fc_roof_day); der Abruf
# holt ab 00:01 die neuen.
#
# Laufende Stunde live (Entscheidung des Nutzers, 11.10.2026): Die Seite
# summiert die Leistung je Dach selbst (fc_live_tick im 1-s-Takt unten).
# Bis zum Ende der letzten fertigen 5-min-Zeile von Home Assistant zaehlen
# deren Werte, danach die eigene Summe (fc_cur_kw). Zur vollen Stunde ist
# die Vorstunde sofort fertig (fc_lv_prev); der Stundenwert von Home
# Assistant ersetzt sie mit dem naechsten Tagesabruf (ab Minute 1).
# Neu gezeichnet wird weiter nur einmal pro Minute, beim Minutenwechsel.
#
# Hinweise (11.10.2026), nur mit dem Datenweg (fc_ha): "Prognose wird
# geladen ..." statt des Hinweises fc_empty bis zur ersten Antwort des
# Abrufs je Dach; in der Legende "Ist wird geladen ..." bis zur ersten
# Antwort des Tagesabrufs, danach "Ist unvollstaendig", solange Ist-Werte
# fehlen (fc_redraw, Bedingungen dort).
#
# Flaeche x 4..1276, y 84..736:
#   Kopfzeile y 84..128: Umschalter x 4, 220 x 44 (Pille wie Seite
#             Wallboxen, Rahmen 1, zwei Teile je 108 x 38 bei x 2 / 110,
#             y 2); Summen x 240, y 95, f_text 22 -> 95..117; Legende
#             x 850..1276, y 97, f_unit 17 -> 97..114. In der Legende
#             Heute zwischen "jetzt" (176..216) und der Skala (rechts-
#             buendig, "Skala 500 kW" 82 breit -> ab 344) der Hinweis
#             fc_ist_hint, x 224..336 (112): "Ist wird geladen ..." 108,
#             "Ist unvollstaendig" 97.
#   Kacheln   y 136..736 (600), Abstand 8. Spalten je nach Zahl der Daecher
#             n: 1 -> 1, 2 -> 2, 3 -> 3, 4 -> 2, 5/6 -> 3; eine Reihe 600
#             hoch, zwei je 296 (136 / 440). Breite: Spalte c von
#             4 + 1280 * c / Spalten bis 4 + 1280 * (c + 1) / Spalten - 8,
#             gerundet: drei Spalten 419 / 418 / 419 (x 4, 431, 857), zwei
#             632 (x 4, 644). Innen W = Breite - 22, H = Hoehe - 22
#             (pad_tile 10, Rahmen 1): 397 x 274 bei sechs Kacheln.
#   In der Kachel (Rechnung fuer H 274):
#     Titel   Name 0..22 (f_text 22), Wert 1..22 (f_val_s 21), je halbe Breite
#     Heute   Diagramm 32..B mit B = H - 26 = 248 (216 hoch), Uhrzeiten
#             B + 6 .. B + 23 = 254..271 (f_unit 17) -> Reserve 3
#     Vorschau Werte 30..50 (f_text_s 20), Balken 56..B2 mit B2 = H - 46 =
#             228 (172 hoch), Tag B2 + 4 .. B2 + 24 = 232..252 (f_text_s
#             20), P10 B2 + 26 .. B2 + 43 = 254..271 (f_unit 17) -> Reserve 3
#   Die Kinder einer Kachel haben keine eigene id; die Skripte erreichen sie
#   ueber die Reihenfolge (lv_obj_get_child), sie steht an den Bloecken.
#   Geometrie in der Kachel rechnet fc_redraw zur Laufzeit; die Werte im
#   YAML sind nur der Ausgangszustand fuer sechs Kacheln.
##############################################################################

# Daten aus Home Assistant? Der Datenweg (.pv-dashboard_ha.yaml) setzt
# "true" -- er steht in der Paketliste spaeter und sticht diesen Wert.
# Ohne ihn (Simulator, Screenshots) zeigt die Seite keine Ladehinweise.
substitutions:
  fc_ha: "false"

globals:
  # 0 = Heute, 1 = Vorschau
  - id: fc_mode
    type: int
    restore_value: false
    initial_value: '0'
  # Daecher mit Prognose (Bit k = Flaeche k + 1), gesetzt von fc_roof_fc
  - id: fc_roof_on
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Je Dach: Halbstunden heute P50 / P10 in kW (48 Plaetze ab 00:00), Tage
  # 1..7 P50 / P10 in kWh, Stundenmittel heute in kW (24 Plaetze), Mittel
  # der laufenden Stunde in kW, Leistung jetzt in W, Ertrag heute in kWh.
  # Start mit NAN = kein Wert.
  - id: fc_r_p50
    type: std::array<std::array<float, 48>, 8>
    restore_value: false
    initial_value: '[] { std::array<std::array<float, 48>, 8> a; for (auto &r : a) r.fill(NAN); return a; }()'
  - id: fc_r_p10
    type: std::array<std::array<float, 48>, 8>
    restore_value: false
    initial_value: '[] { std::array<std::array<float, 48>, 8> a; for (auto &r : a) r.fill(NAN); return a; }()'
  - id: fc_r_d50
    type: std::array<std::array<float, 7>, 8>
    restore_value: false
    initial_value: '[] { std::array<std::array<float, 7>, 8> a; for (auto &r : a) r.fill(NAN); return a; }()'
  - id: fc_r_d10
    type: std::array<std::array<float, 7>, 8>
    restore_value: false
    initial_value: '[] { std::array<std::array<float, 7>, 8> a; for (auto &r : a) r.fill(NAN); return a; }()'
  - id: fc_r_act
    type: std::array<std::array<float, 24>, 8>
    restore_value: false
    initial_value: '[] { std::array<std::array<float, 24>, 8> a; for (auto &r : a) r.fill(NAN); return a; }()'
  - id: fc_r_cur
    type: std::array<float, 8>
    restore_value: false
    initial_value: '[] { std::array<float, 8> a; a.fill(NAN); return a; }()'
  - id: fc_r_now
    type: std::array<float, 8>
    restore_value: false
    initial_value: '[] { std::array<float, 8> a; a.fill(NAN); return a; }()'
  - id: fc_r_done
    type: std::array<float, 8>
    restore_value: false
    initial_value: '[] { std::array<float, 8> a; a.fill(NAN); return a; }()'
  # Halbstunden P50 heute der ganzen Anlage (kW, 48 Plaetze ab 00:00) aus
  # der Solcast-Gesamtprognose, mit jedem Abruf gesetzt
  # (.pv-dashboard_ha.yaml); ohne Prognose je Dach rechnet die Seite PV
  # ihren Rest daraus
  - id: fc_sys_p50
    type: std::array<float, 48>
    restore_value: false
    initial_value: '[] { std::array<float, 48> a; a.fill(NAN); return a; }()'
  # Tag der Halbstunden laut Home Assistant (Jahr * 1000 + Tag im Jahr, wie
  # curve_day): fc_sys_day fuer fc_sys_p50, fc_roof_day fuer fc_r_p50. Jede
  # erfolgreiche Antwort stempelt nur ihre eigene Reihe
  # (.pv-dashboard_ha.yaml); -1 = noch keine
  - id: fc_sys_day
    type: int
    restore_value: false
    initial_value: '-1'
  - id: fc_roof_day
    type: int
    restore_value: false
    initial_value: '-1'
  # Rest heute in kWh ueber die Daecher der Maske (Bit k = Flaeche k + 1),
  # soweit sie eine Prognose haben: P50 der Halbstunden ab jetzt, die
  # laufende anteilig. Maske 0xFF ohne jede Prognose je Dach: fc_sys_p50.
  # Uhrzeit wie fc_text (fc_clock, sonst dash_time). NAN ohne Uhrzeit, ohne
  # Wert oder wenn die Halbstunden der Reihe nicht von heute sind (nach 0
  # Uhr bis zum Abruf ab 00:01, oder ihr Abruf scheitert); der
  # Screenshot-Lauf mit fc_clock prueft den Tag nicht.
  - id: fc_rest
    type: std::function<float(uint32_t)>
    restore_value: false
    initial_value: |-
      [](uint32_t mask) -> float {
        int m = id(fc_clock), heute = -1;
        if (m < 0) {
          const ESPTime t = id(dash_time).now();
          if (!t.is_valid())
            return NAN;
          m = t.hour * 60 + t.minute;
          heute = t.year * 1000 + t.day_of_year;
        }
        auto frisch = [heute](int tag) { return heute < 0 || tag == heute; };
        float r = NAN;
        auto sum = [&r, m](const std::array<float, 48> &p) {
          for (int i = m / 30; i < 48; i++)
            if (std::isfinite(p[i]))
              r = (std::isfinite(r) ? r : 0.0f) + p[i] * 0.5f * std::min(1.0f, ((i + 1) * 30 - m) / 30.0f);
        };
        const uint32_t on = id(fc_roof_on);
        if (on == 0 && mask == 0xFFu && frisch(id(fc_sys_day)))
          sum(id(fc_sys_p50));
        if (frisch(id(fc_roof_day)))
          for (int k = 0; k < 8; k++)
            if (((on & mask) >> k) & 1u)
              sum(id(fc_r_p50)[k]);
        return r;
      }
  # Rest der Daecher des Hausnetz-Kreises (Flaechen 3..8; 1 und 2 haengen
  # am Voll-WR, docs/01) fuer Statusleiste und Haus. Nur wenn jede Flaeche
  # dieses Kreises, die vorhanden ist (dev_present) oder einen Tageswert hat
  # (fc_roof_on), auch Halbstunden hat und mindestens eine da ist -- sonst
  # NAN, und der Aufrufer nimmt die Solcast-Entitaet (ha_solcast_remaining).
  - id: fc_rest_house
    type: std::function<float()>
    restore_value: false
    initial_value: |-
      []() -> float {
        const uint32_t HAUS = 0xFCu;
        const uint32_t on = id(fc_roof_on);
        uint32_t hat = 0;
        for (int k = 2; k < 8; k++)
          if (((on >> k) & 1u) && std::any_of(id(fc_r_p50)[k].begin(), id(fc_r_p50)[k].end(),
                                              [](float v) { return std::isfinite(v); }))
            hat |= 1u << k;
        if (hat == 0 || ((id(dev_present) | on) & HAUS & ~hat) != 0)
          return NAN;
        return id(fc_rest)(hat);
      }
  # Welche Flaeche (0..7) in Kachel 0..5 steht, -1 = keine (fc_redraw)
  - id: fc_tile_roof
    type: std::array<int, 6>
    restore_value: false
    initial_value: '{-1, -1, -1, -1, -1, -1}'
  # Uhrzeit fuer die Seite in Minuten seit 0 Uhr, -1 = Uhr (dash_time).
  # Nur der Screenshot-Lauf setzt sie, damit die Bilder nicht von der
  # Uhrzeit des Laufs abhaengen.
  - id: fc_clock
    type: int
    restore_value: false
    initial_value: '-1'
  # "a,,b" -> Zahlen; leeres Feld = NAN; hoechstens n Plaetze, Rest NAN
  - id: fc_parse
    type: std::function<void(const std::string &, float *, int)>
    restore_value: false
    initial_value: |-
      [](const std::string &s, float *out, int n) {
        for (int i = 0; i < n; i++)
          out[i] = NAN;
        size_t a = 0;
        for (int i = 0; i < n && a <= s.size(); i++) {
          size_t b = s.find(',', a);
          if (b == std::string::npos)
            b = s.size();
          if (b > a) {
            const std::string f = s.substr(a, b - a);
            char *end = nullptr;
            const float v = strtof(f.c_str(), &end);
            if (end != f.c_str())
              out[i] = v;
          }
          a = b + 1;
        }
      }
  # --- Laufende Stunde live (Kopf der Datei) ---------------------------
  # Stundenschluessel immer Tag im Jahr * 24 + Stunde (dash_time).
  # Eigene Summe je Dach und 5-min-Fach der laufenden Stunde: Leistung mal
  # Zeit in W*s (fc_lv_e) und abgedeckte Sekunden (fc_lv_t)
  - id: fc_lv_e
    type: std::array<std::array<float, 12>, 8>
    restore_value: false
  - id: fc_lv_t
    type: std::array<std::array<float, 12>, 8>
    restore_value: false
  # Home Assistant je Dach: Zahl der 5-min-Zeilen der laufenden Stunde
  # (Mittel fc_r_cur) und ihr Ende als Fach 0..12 (fc_roof_rows)
  - id: fc_lv_n
    type: std::array<uint8_t, 8>
    restore_value: false
  - id: fc_lv_j
    type: std::array<uint8_t, 8>
    restore_value: false
  # Fertig gerechnete Vorstunde je Dach in kW (fc_live_tick), NAN = keine
  - id: fc_lv_prev
    type: std::array<float, 8>
    restore_value: false
    initial_value: '[] { std::array<float, 8> a; a.fill(NAN); return a; }()'
  # Schluessel {eigene Summe, 5-min-Zeilen von HA, fc_lv_prev}; -1 = keiner
  - id: fc_lv_i
    type: std::array<int, 3>
    restore_value: false
    initial_value: '{-1, -1, -1}'
  # Aufsummieren an/aus: der Datenweg schaltet es mit ha_ready (getrennt =
  # alte Werte, die nicht zaehlen duerfen)
  - id: fc_live_on
    type: bool
    restore_value: false
    initial_value: 'true'
  # Mittel der Stunde H eines Daches in kW: die 5-min-Zeilen von Home
  # Assistant bis zu ihrem Ende (Fach j), danach die eigene Summe. Unter
  # 30 s Abdeckung NAN (kein Balken) -- beim Neuzeichnen um :01 sind erst
  # knapp 60 s gesammelt.
  - id: fc_cur_kw
    type: std::function<float(int, int)>
    restore_value: false
    initial_value: |-
      [](int k, int H) -> float {
        const auto &I = id(fc_lv_i);
        float e = 0.0f, s = 0.0f;
        int j0 = 0;
        if (I[1] == H) {
          const int n = id(fc_lv_n)[k];
          const float c = id(fc_r_cur)[k];
          if (n > 0 && std::isfinite(c)) {
            e = c * 1000.0f * n * 300.0f;
            s = n * 300.0f;
          }
          j0 = id(fc_lv_j)[k];
        }
        if (I[0] == H) {
          for (int j = j0; j < 12; j++) {
            e += id(fc_lv_e)[k][j];
            s += id(fc_lv_t)[k][j];
          }
        }
        return s >= 30.0f ? e / s / 1000.0f : NAN;
      }
  # Jede Sekunde (interval unten): neue Stunde -> Vorstunde fertig rechnen
  # (nur, wenn sie direkt davor lag), Faecher leeren; dann mit an die
  # Leistung jedes Daches (fc_r_now, leer/NAN zaehlt nicht) dt Sekunden in
  # Fach slot (Minute / 5).
  - id: fc_live_tick
    type: std::function<void(int, int, float, bool)>
    restore_value: false
    initial_value: |-
      [](int H, int slot, float dt, bool an) {
        auto &I = id(fc_lv_i);
        if (I[0] != H) {
          const bool vor = I[0] >= 0 && I[0] == H - 1;
          for (int k = 0; k < 8; k++)
            id(fc_lv_prev)[k] = vor ? id(fc_cur_kw)(k, I[0]) : NAN;
          I[2] = vor ? I[0] : -1;
          for (auto &r : id(fc_lv_e))
            r.fill(0.0f);
          for (auto &r : id(fc_lv_t))
            r.fill(0.0f);
          I[0] = H;
        }
        if (!an || !(dt > 0.0f) || slot < 0 || slot > 11)
          return;
        for (int k = 0; k < 8; k++) {
          const float p = id(fc_r_now)[k];
          if (std::isfinite(p)) {
            id(fc_lv_e)[k][slot] += p * dt;
            id(fc_lv_t)[k][slot] += dt;
          }
        }
      }
  # Wert des Stundenbalkens h eines Daches in kW (hnow laufende Stunde, -1
  # ohne Uhr; H ihr Schluessel, -1 = ohne Live-Fuellung wie im
  # Screenshot-Lauf mit fc_clock): kuenftige Stunden NAN, die laufende live
  # (ohne H das Mittel fc_r_cur), die Vorstunde ohne Stundenwert von Home
  # Assistant aus der eigenen Rechnung, sonst der Stundenwert.
  - id: fc_val
    type: std::function<float(int, int, int, int)>
    restore_value: false
    initial_value: |-
      [](int k, int h, int hnow, int H) -> float {
        if (h < 0 || h > 23 || (hnow >= 0 && h > hnow))
          return NAN;
        if (h == hnow)
          return H < 0 ? id(fc_r_cur)[k] : id(fc_cur_kw)(k, H);
        const float a = id(fc_r_act)[k][h];
        if (H >= 0 && h == hnow - 1 && !std::isfinite(a) && id(fc_lv_i)[2] == H - 1)
          return id(fc_lv_prev)[k];
        return a;
      }
  # --- Stand der Daten fuer die Hinweise (fc_redraw), gesetzt vom
  # Datenweg; ohne ihn bleiben sie hier stehen und es gibt keinen Hinweis.
  # Daecher, deren Ist aus der Statistik kommt (Bit k = Flaeche k + 1)
  - id: fc_ist_soll
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # millis() der letzten guten Antwort des Tagesabrufs seit dem Verbinden,
  # 0 = noch keine
  - id: fc_ist_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Letzte Antwort des Tagesabrufs war ein Fehler
  - id: fc_ist_fehler
    type: bool
    restore_value: false
    initial_value: 'false'
  # Seit dem Start schon eine gute Antwort ("unvollstaendig" statt "wird
  # geladen")
  - id: fc_ist_je
    type: bool
    restore_value: false
    initial_value: 'false'
  # Abruf je Dach hat geantwortet (Erfolg oder Fehler)
  - id: fc_fc_da
    type: bool
    restore_value: false
    initial_value: 'false'
  # Text des Hinweises Ist-Werte, "" = alles da. soll: Daecher mit Kachel,
  # deren Ist aus der Statistik kommt (0 ohne Datenweg -> nie ein
  # Hinweis); hnow, H wie fc_val; jetzt_ms = millis(). Es fehlt etwas,
  # wenn seit dem Verbinden keine gute Antwort des Tagesabrufs kam, die
  # letzte ein Fehler war oder aelter als 11 min ist (zwei Abrufe
  # verpasst), oder wenn ab 1 Uhr ein Dach fuer keine fertige Stunde einen
  # Wert hat. Vor der ersten guten Antwort seit dem Start "wird geladen".
  - id: fc_ist_text
    type: std::function<const char *(uint32_t, int, int, uint32_t)>
    restore_value: false
    initial_value: |-
      [](uint32_t soll, int hnow, int H, uint32_t jetzt_ms) -> const char * {
        if (soll == 0)
          return "";
        const uint32_t ms = id(fc_ist_ms);
        bool fehlt = ms == 0 || id(fc_ist_fehler) || jetzt_ms - ms > 11u * 60u * 1000u;
        for (int k = 0; k < 8 && !fehlt && H >= 0 && hnow >= 1; k++) {
          if (!((soll >> k) & 1u))
            continue;
          // Nur Stunden mit erwartetem Ertrag zaehlen: nachts melden
          // Wechselrichter oft gar keinen Wert
          bool hat = false, erwartet = false;
          for (int h = 0; h < hnow && !hat; h++) {
            const float a = id(fc_r_p50)[k][2 * h], b = id(fc_r_p50)[k][2 * h + 1];
            erwartet = erwartet || (std::isfinite(a) && a > 0.0f) || (std::isfinite(b) && b > 0.0f);
            hat = std::isfinite(id(fc_val)(k, h, hnow, H));
          }
          fehlt = erwartet && !hat;
        }
        if (!fehlt)
          return "";
        return id(fc_ist_je) ? "Ist unvollständig" : "Ist wird geladen …";
      }

script:
  # ---------------------------------------------------------------------
  # Prognose eines Daches (Solcast-Eintrag der Flaeche):
  #   roof    0..7 = Flaeche 1..8 (name_pv_1..8)
  #   p50     48 kommagetrennte Halbstunden heute ab 00:00 in kW
  #           (detailedForecast, pv_estimate); leeres Feld = kein Wert
  #   p10     dasselbe fuer pv_estimate10
  #   days    7 Tageswerte P50 in kWh (heute, morgen, Tag 3..7)
  #   days10  7 Tageswerte P10 in kWh (Attribut estimate10)
  # Hat "heute" keinen Wert, gilt das Dach als nicht da (keine Kachel).
  # Zeichnet nicht selbst -- nach dem letzten Dach fc_redraw aufrufen.
  # ---------------------------------------------------------------------
  - id: fc_roof_fc
    parameters:
      roof: int
      p50: string
      p10: string
      days: string
      days10: string
    then:
      - lambda: |-
          if (roof < 0 || roof > 7)
            return;
          auto &parse = id(fc_parse);
          parse(p50, id(fc_r_p50)[roof].data(), 48);
          parse(p10, id(fc_r_p10)[roof].data(), 48);
          parse(days, id(fc_r_d50)[roof].data(), 7);
          parse(days10, id(fc_r_d10)[roof].data(), 7);
          if (std::isfinite(id(fc_r_d50)[roof][0])) {
            id(fc_roof_on) |= 1u << roof;
            id(data_seen)[6] = millis();  // Datenalter, sys_refresh
          } else {
            id(fc_roof_on) &= ~(1u << roof);
          }

  # ---------------------------------------------------------------------
  # Ist eines Daches aus der Statistik:
  #   hours  24 kommagetrennte Stundenmittel heute in kW (Platz = Stunde
  #          nach Ortszeit), leeres Feld = kein Wert
  #   cur    Mittel der laufenden Stunde in kW, NAN = keins
  # Zeichnet nicht selbst (fc_redraw).
  # ---------------------------------------------------------------------
  - id: fc_roof_hours
    parameters:
      roof: int
      hours: string
      cur: float
    then:
      - lambda: |-
          if (roof < 0 || roof > 7)
            return;
          id(fc_parse)(hours, id(fc_r_act)[roof].data(), 24);
          id(fc_r_cur)[roof] = cur;

  # ---------------------------------------------------------------------
  # 5-min-Zeilen von Home Assistant in der laufenden Stunde (Live-Fuellung,
  # fc_cur_kw), aus derselben Antwort wie cur von fc_roof_hours:
  #   rows   je Flaeche 1..8 zwei Zahlen "n,j": Zahl der Zeilen und Ende
  #          der letzten als Fach 0..12; fehlt etwas, gilt 0
  #   hour   Stunde laut Home Assistant, -1 = keine. Nur wenn sie die
  #          laufende Stunde des Panels ist, gelten die Zeilen.
  # Zeichnet nicht selbst (fc_redraw).
  # ---------------------------------------------------------------------
  - id: fc_roof_rows
    parameters:
      rows: string
      hour: int
    then:
      - lambda: |-
          float a[16];
          id(fc_parse)(rows, a, 16);
          auto fach = [](float v) -> uint8_t {
            return std::isfinite(v) ? (uint8_t) std::min(std::max(v, 0.0f), 12.0f) : 0;
          };
          for (int k = 0; k < 8; k++) {
            id(fc_lv_n)[k] = fach(a[2 * k]);
            id(fc_lv_j)[k] = fach(a[2 * k + 1]);
          }
          const ESPTime t = id(dash_time).now();
          id(fc_lv_i)[1] = (hour >= 0 && t.is_valid() && hour == t.hour) ? t.day_of_year * 24 + t.hour : -1;

  # ---------------------------------------------------------------------
  # Live-Werte eines Daches (Gruppe der Flaeche, jede Sekunde moeglich):
  #   power   Leistung jetzt in W
  #   energy  Ertrag heute in kWh ("bisher"); kein Wert -> Summe der
  #           Stundenbalken
  # Nur Texte, keine Geometrie (fc_text). Stempelt data_seen[6], wenn das
  # Dach eine Prognose hat.
  # ---------------------------------------------------------------------
  - id: fc_roof_live
    parameters:
      roof: int
      power: float
      energy: float
    then:
      - lambda: |-
          if (roof < 0 || roof > 7)
            return;
          id(fc_r_now)[roof] = power;
          id(fc_r_done)[roof] = energy;
          if ((id(fc_roof_on) >> roof) & 1u) {
            // Datenalter Prognose: der Abruf kommt nur alle 30 min, die
            // Leistung der Daecher mit Prognose haelt die Seite dazwischen frisch
            id(data_seen)[6] = millis();
            id(fc_text).execute();
          }

  # Umschalter Heute (0) / Vorschau (1): Teil leuchtet, Kacheln wechseln
  - id: fc_mode_set
    parameters:
      mode: int
    then:
      - lambda: |-
          id(fc_mode) = mode == 1 ? 1 : 0;
          lv_obj_t *const S[2] = {id(fc_seg0), id(fc_seg1)};
          lv_obj_t *const L[2] = {id(fc_seg0_lbl), id(fc_seg1_lbl)};
          for (int i = 0; i < 2; i++) {
            lv_obj_set_style_bg_opa(S[i], i == id(fc_mode) ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
            lv_obj_set_style_text_color(L[i], i == id(fc_mode) ? lv_color_hex($col_bg) : lv_color_hex($col_ink2), 0);
          }
      - script.execute: fc_redraw

  # ---------------------------------------------------------------------
  # Kacheln anordnen und zeichnen. Ruft der 1-s-Takt unten bei jedem
  # Minutenwechsel (Marke jetzt, laufende Stunde, Rest), sonst neue Daten
  # bzw. der Umschalter. Setzt auch die Hinweise (Kopf der Datei). Danach
  # den Rest der anderen Stellen (fc_rest): Seite PV, Statusleiste, Haus.
  # ---------------------------------------------------------------------
  - id: fc_redraw
    then:
      - lambda: |-
          const uint32_t on = id(fc_roof_on);
          const auto &P50 = id(fc_r_p50);
          const auto &P10 = id(fc_r_p10);
          const auto &D50 = id(fc_r_d50);
          const auto &D10 = id(fc_r_d10);
          const auto &ACT = id(fc_r_act);
          auto &wert = id(fc_val);
          auto &num = id(fmt_num);
          lv_obj_t *const T[6] = {id(fc_t0), id(fc_t1), id(fc_t2), id(fc_t3), id(fc_t4), id(fc_t5)};
          static const char *const NAME[8] = {"${name_pv_1}", "${name_pv_2}", "${name_pv_3}", "${name_pv_4}",
                                              "${name_pv_5}", "${name_pv_6}", "${name_pv_7}", "${name_pv_8}"};
          static const char *const WTAG[7] = {"So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"};
          const ESPTime jetzt = id(dash_time).now();
          int m = id(fc_clock);
          if (m < 0 && jetzt.is_valid())
            m = jetzt.hour * 60 + jetzt.minute;
          const int hnow = m >= 0 ? m / 60 : -1;
          // Schluessel der laufenden Stunde fuer die Live-Fuellung (fc_val); -1
          // im Screenshot-Lauf (fc_clock) und ohne Uhr: dann gilt fc_r_cur.
          // Nicht H nennen: H ist unten die Innenhoehe der Kachel.
          const int HS = (id(fc_clock) < 0 && jetzt.is_valid()) ? jetzt.day_of_year * 24 + jetzt.hour : -1;
          const bool vor = id(fc_mode) == 1;
          constexpr bool HA = ${fc_ha};

          // Welche Daecher: Flaechen 1..8 mit Prognose, hoechstens sechs
          int roof[6], n = 0;
          for (int k = 0; k < 8 && n < 6; k++)
            if ((on >> k) & 1u)
              roof[n++] = k;
          for (int t = 0; t < 6; t++)
            id(fc_tile_roof)[t] = t < n ? roof[t] : -1;
          static const int COLS[7] = {1, 1, 2, 3, 2, 3, 3};
          const int cols = COLS[n], rows = n > 3 ? 2 : 1;
          static int n_alt = -1;
          if (n != n_alt) {
            ESP_LOGI("fc", "Prognose je Dach: %d Kacheln", n);
            n_alt = n;
          }
          if (n == 0) {
            // Bis zur ersten Antwort des Abrufs je Dach laedt sie noch
            id(lbl_set)(id(fc_empty), HA && !id(fc_fc_da) ? "Prognose wird geladen …"
                                                          : "Keine Prognose je Dach.\nIn der Anlage ha_pv<N>_fc_d1 mit "
                                                            "dem Solcast-Sensor \"heute\" der Fläche belegen.");
            lv_obj_clear_flag(id(fc_empty), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(fc_empty), LV_OBJ_FLAG_HIDDEN);
          }

          // Hinweis Ist-Werte in der Legende Heute (fc_ist_text), nur fuer
          // Daecher mit Kachel; LVGL zeichnet nur bei neuem Text (lbl_set)
          {
            uint32_t soll = 0;
            for (int t = 0; t < n; t++)
              soll |= id(fc_ist_soll) & (1u << roof[t]);
            const char *hinweis = id(fc_ist_text)(soll, hnow, HS, millis());
            static std::string hinweis_alt;
            if (hinweis_alt != hinweis) {
              ESP_LOGI("fc", "Ist-Werte: %s", *hinweis ? hinweis : "vollständig");
              hinweis_alt = hinweis;
            }
            id(lbl_set)(id(fc_ist_hint), hinweis);
          }

          // Zeitachse Heute: volle Stunden um alles ueber 0
          int first = 48, last = -1;
          for (int t = 0; t < n; t++) {
            const int k = roof[t];
            for (int i = 0; i < 48; i++) {
              const float a = P50[k][i], b = P10[k][i];
              if ((std::isfinite(a) && a > 0.0f) || (std::isfinite(b) && b > 0.0f)) {
                first = std::min(first, i);
                last = std::max(last, i);
              }
            }
            for (int h = 0; h < 24; h++) {
              if (std::isfinite(ACT[k][h]) && ACT[k][h] > 0.0f) {
                first = std::min(first, 2 * h);
                last = std::max(last, 2 * h + 1);
              }
            }
          }
          int h0 = first <= last ? first / 2 : 6, h1 = first <= last ? (last + 2) / 2 : 20;
          while (h1 - h0 < 8) {
            if (h0 > 0)
              h0--;
            if (h1 - h0 < 8 && h1 < 24)
              h1++;
          }
          if (h1 - h0 > 20)
            h1 = h0 + 20;
          const int L = h1 - h0;

          // Gemeinsame Massstaebe: Heute kW, Vorschau kWh
          float top = 0.0f, dtop = 0.0f;
          for (int t = 0; t < n; t++) {
            const int k = roof[t];
            for (int i = 2 * h0; i < 2 * h1; i++)
              for (float v : {P50[k][i], P10[k][i]})
                if (std::isfinite(v))
                  top = std::max(top, v);
            for (int h = h0; h < h1; h++) {
              const float v = wert(k, h, hnow, HS);
              if (std::isfinite(v))
                top = std::max(top, v);
            }
            for (int d = 1; d < 7; d++)
              for (float v : {D50[k][d], D10[k][d]})
                if (std::isfinite(v))
                  dtop = std::max(dtop, v);
          }
          auto rund = [](float v) -> float {
            static const float S[] = {0.5f, 1, 1.5f, 2, 2.5f, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, 40, 50, 60, 80,
                                      100, 120, 150, 200, 250, 300, 400, 500};
            for (float s : S)
              if (v <= s)
                return s;
            return v;
          };
          const float sc = rund(top > 0.0f ? top * 1.04f : 1.0f), dsc = rund(dtop > 0.0f ? dtop * 1.04f : 1.0f);
          id(lbl_set)(id(fc_scale_h), ("Skala " + num(sc, "%g", "--") + " kW").c_str());
          id(lbl_set)(id(fc_scale_v), ("Skala " + num(dsc, "%g", "--") + " kWh").c_str());
          if (vor) {
            lv_obj_add_flag(id(fc_leg_h), LV_OBJ_FLAG_HIDDEN);
            lv_obj_clear_flag(id(fc_leg_v), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_clear_flag(id(fc_leg_h), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(fc_leg_v), LV_OBJ_FLAG_HIDDEN);
          }

          // Beschriftung der Tage 1..6 (morgen ..), von 12 Uhr aus gerechnet
          std::string tag[7];
          for (int d = 1; d < 7; d++) {
            if (!jetzt.is_valid()) {
              tag[d] = "Tag " + std::to_string(d + 1);
              continue;
            }
            const time_t mittag = jetzt.timestamp - (jetzt.hour * 3600 + jetzt.minute * 60 + jetzt.second) + 12 * 3600;
            const ESPTime x = ESPTime::from_epoch_local(mittag + (time_t) d * 86400);
            char b[16];
            snprintf(b, sizeof(b), "%s %d.", WTAG[x.day_of_week - 1], x.day_of_month);
            tag[d] = b;
          }

          static lv_point_precise_t pts[6][2][40];
          auto show = [](lv_obj_t *o, bool s) {
            if (s)
              lv_obj_clear_flag(o, LV_OBJ_FLAG_HIDDEN);
            else
              lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
          };
          for (int t = 0; t < 6; t++) {
            lv_obj_t *tile = T[t];
            if (t >= n) {
              show(tile, false);
              continue;
            }
            // Platz im Raster
            const int r = t / cols, c = t % cols;
            const int x0 = 4 + (int) lroundf(c * 1280.0f / cols), x1 = 4 + (int) lroundf((c + 1) * 1280.0f / cols) - 8;
            const int y0 = rows == 1 ? 136 : 136 + r * 304, hh = rows == 1 ? 600 : 296;
            lv_obj_set_pos(tile, x0, y0);
            lv_obj_set_size(tile, x1 - x0, hh);
            show(tile, true);
            const int W = x1 - x0 - 22, H = hh - 22, k = roof[t];
            lv_obj_t *name = lv_obj_get_child(tile, 0), *val = lv_obj_get_child(tile, 1);
            lv_obj_t *ch = lv_obj_get_child(tile, 2), *cv = lv_obj_get_child(tile, 3);
            lv_obj_set_width(name, W / 2 - 4);
            lv_obj_set_x(val, W / 2);
            lv_obj_set_width(val, W - W / 2);
            id(lbl_set)(name, NAME[k]);
            lv_obj_set_size(ch, W, H);
            lv_obj_set_size(cv, W, H);
            show(ch, !vor);
            show(cv, vor);

            // --- Heute: Balken, Linien, Marke, Uhrzeiten ---
            const int CT = 32, B = H - 26, CH = B - CT;
            const float SW = (float) W / L;
            const int bw = std::max(2, (int) lroundf(SW * 0.62f));
            lv_obj_t *base = lv_obj_get_child(ch, 0);
            lv_obj_set_pos(base, 0, B);
            lv_obj_set_width(base, W);
            for (int j = 0; j < 20; j++) {
              lv_obj_t *bar = lv_obj_get_child(ch, 1 + j);
              const int h = h0 + j;
              const bool lauf = h == hnow;
              const float v = j >= L ? NAN : wert(k, h, hnow, HS);
              if (!std::isfinite(v) || v <= 0.0f) {
                show(bar, false);
                continue;
              }
              const int bh = std::max(1, (int) lroundf(std::min(v / sc, 1.0f) * CH));
              lv_obj_set_pos(bar, (int) lroundf(j * SW + (SW - bw) * 0.5f), B - bh);
              lv_obj_set_size(bar, bw, bh);
              lv_obj_set_style_bg_opa(bar, lauf ? LV_OPA_50 : LV_OPA_COVER, 0);
              show(bar, true);
            }
            for (int s = 0; s < 2; s++) {
              const auto &A = s == 0 ? P10[k] : P50[k];
              int np = 0;
              for (int i = 2 * h0; i < 2 * h1 && np < 40; i++) {
                if (!std::isfinite(A[i]))
                  continue;
                pts[t][s][np].x = (lv_value_precise_t) ((i - 2 * h0 + 0.5f) * SW * 0.5f);
                pts[t][s][np].y = (lv_value_precise_t) (B - std::min(std::max(A[i], 0.0f) / sc, 1.0f) * CH);
                np++;
              }
              lv_obj_t *line = lv_obj_get_child(ch, 21 + s);
              lv_line_set_points(line, pts[t][s], np);
              show(line, np >= 2);
            }
            lv_obj_t *mark = lv_obj_get_child(ch, 23);
            if (m >= h0 * 60 && m <= h1 * 60) {
              lv_obj_set_pos(mark, std::min((int) lroundf((m - h0 * 60) / 60.0f * SW) - 1, W - 2), CT);
              lv_obj_set_height(mark, CH);
              show(mark, true);
            } else {
              show(mark, false);
            }
            const int step = L <= 8 ? 2 : (L <= 14 ? 3 : 4);
            int li = 0;
            for (int h = ((h0 + step - 1) / step) * step; h <= h1 && li < 7; h += step, li++) {
              lv_obj_t *lab = lv_obj_get_child(ch, 24 + li);
              const int cx = (int) lroundf((h - h0) * SW);
              lv_obj_set_pos(lab, std::max(0, std::min(cx - 16, W - 32)), B + 6);
              char b[4];
              snprintf(b, sizeof(b), "%02d", h % 24);
              id(lbl_set)(lab, b);
              show(lab, true);
            }
            for (; li < 7; li++)
              show(lv_obj_get_child(ch, 24 + li), false);

            // --- Vorschau: sechs Tage, Balken P50 mit dunklem Teil bis P10 ---
            const int VT = 56, B2 = H - 46, DH = B2 - VT;
            const float CW = W / 6.0f;
            const int dbw = (int) lroundf(CW * 0.56f);
            lv_obj_t *base2 = lv_obj_get_child(cv, 0);
            lv_obj_set_pos(base2, 0, B2);
            lv_obj_set_width(base2, W);
            for (int d = 0; d < 6; d++) {
              const float v = D50[k][d + 1], q = D10[k][d + 1];
              const int x = (int) lroundf(d * CW), cw = (int) lroundf((d + 1) * CW) - x;
              const int bx = (int) lroundf(d * CW + (CW - dbw) * 0.5f);
              int bh = 0;
              lv_obj_t *bar = lv_obj_get_child(cv, 1 + d), *qb = lv_obj_get_child(cv, 7 + d);
              if (std::isfinite(v) && v > 0.0f) {
                bh = std::max(2, (int) lroundf(std::min(v / dsc, 1.0f) * DH));
                lv_obj_set_pos(bar, bx, B2 - bh);
                lv_obj_set_size(bar, dbw, bh);
                show(bar, true);
              } else {
                show(bar, false);
              }
              if (std::isfinite(q) && q > 0.0f) {
                const int qh = std::max(2, (int) lroundf(std::min(q / dsc, 1.0f) * DH));
                lv_obj_set_pos(qb, bx, B2 - qh);
                lv_obj_set_size(qb, dbw, qh);
                show(qb, true);
              } else {
                show(qb, false);
              }
              lv_obj_t *vl = lv_obj_get_child(cv, 13 + d), *dl = lv_obj_get_child(cv, 19 + d);
              lv_obj_t *pl = lv_obj_get_child(cv, 25 + d);
              lv_obj_set_pos(vl, x, 30);
              lv_obj_set_width(vl, cw);
              // ab 100 kWh ohne Nachkommastelle, sonst wird die Spalte zu eng.
              // Tag ohne Wert (nicht belegt oder nicht verfuegbar): leer
              id(lbl_set)(vl, std::isfinite(v) ? num(v, v >= 99.95f ? "%.0f" : "%.1f", "").c_str() : "");
              lv_obj_set_pos(dl, x, B2 + 4);
              lv_obj_set_width(dl, cw);
              id(lbl_set)(dl, tag[d + 1].c_str());
              lv_obj_set_pos(pl, x, B2 + 26);
              lv_obj_set_width(pl, cw);
              id(lbl_set)(pl, std::isfinite(q) ? ("P10 " + num(q, q >= 99.95f ? "%.0f" : "%.1f", "")).c_str() : "");
            }
          }
      - script.execute: fc_text
      - script.execute: pv_rest
      - script.execute: ov_status
      - script.execute: house_rest

  # Nur die Texte: Kopfzeile (Summen ueber alle Daecher mit Prognose, auch
  # ueber die sechste Kachel hinaus -- derselbe Rest wie die Seite PV) und
  # die Werte in den Kacheltiteln. Rest = fc_rest je Dach (P50 der
  # Halbstunden ab jetzt, die laufende anteilig); bisher = Ertrag heute,
  # ohne Wert die Summe der Stundenbalken.
  - id: fc_text
    then:
      - lambda: |-
          auto &num = id(fmt_num);
          const auto &P50 = id(fc_r_p50);
          const auto &D50 = id(fc_r_d50);
          const auto &D10 = id(fc_r_d10);
          auto &wert = id(fc_val);
          lv_obj_t *const T[6] = {id(fc_t0), id(fc_t1), id(fc_t2), id(fc_t3), id(fc_t4), id(fc_t5)};
          const ESPTime jetzt = id(dash_time).now();
          int m = id(fc_clock);
          if (m < 0 && jetzt.is_valid())
            m = jetzt.hour * 60 + jetzt.minute;
          const int hnow = m >= 0 ? m / 60 : -1;
          const int HS = (id(fc_clock) < 0 && jetzt.is_valid()) ? jetzt.day_of_year * 24 + jetzt.hour : -1;
          const bool vor = id(fc_mode) == 1;
          auto add = [](float &a, float v) {
            if (std::isfinite(v))
              a = std::isfinite(a) ? a + v : v;
          };
          float done_s = NAN, prog_s = NAN, rest_s = NAN, now_s = NAN, d1_s = NAN, six_s = NAN, six10_s = NAN;
          int n = 0;
          for (int k = 0; k < 8; k++) {
            if (!((id(fc_roof_on) >> k) & 1u))
              continue;
            n++;
            float done = id(fc_r_done)[k];
            if (!std::isfinite(done)) {
              done = NAN;
              for (int h = 0; h < 24 && h < hnow; h++)
                add(done, wert(k, h, hnow, HS));
              if (hnow >= 0)
                add(done, wert(k, hnow, hnow, HS) * (m % 60) / 60.0f);
            }
            float prog = D50[k][0];
            if (!std::isfinite(prog)) {
              prog = NAN;
              for (int i = 0; i < 48; i++)
                add(prog, P50[k][i] * 0.5f);
            }
            const float rest = id(fc_rest)(1u << k);
            float six = NAN, six10 = NAN;
            for (int d = 1; d < 7; d++) {
              add(six, D50[k][d]);
              add(six10, D10[k][d]);
            }
            add(done_s, done);
            add(prog_s, prog);
            add(rest_s, rest);
            add(now_s, id(fc_r_now)[k] * 0.001f);
            add(d1_s, D50[k][1]);
            add(six_s, six);
            add(six10_s, six10);
            const std::string v = vor ? "6 Tage " + num(six, "%.1f", "--,-") + " kWh"
                                      : num(done, "%.1f", "--,-") + " / " + num(prog, "%.1f", "--,-") + " kWh";
            for (int t = 0; t < 6; t++)
              if (id(fc_tile_roof)[t] == k)
                id(lbl_set)(lv_obj_get_child(T[t], 1), v.c_str());
          }
          std::string s;
          if (n == 0)
            s = "";
          else if (vor)
            s = "Morgen " + num(d1_s, "%.1f", "--,-") + " kWh · 6 Tage " + num(six_s, "%.1f", "--,-") + " kWh · P10 " +
                num(six10_s, "%.1f", "--,-") + " kWh";
          else
            s = "bisher " + num(done_s, "%.1f", "--,-") + " / Prognose " + num(prog_s, "%.1f", "--,-") + " kWh · Rest " +
                num(rest_s, "%.1f", "--,-") + " kWh · jetzt " + num(now_s, "%.1f", "--,-") + " kW";
          id(lbl_set)(id(fc_total), s.c_str());

interval:
  # Jede Sekunde: Leistung je Dach in die laufende Stunde summieren
  # (fc_live_tick, ohne LVGL). Neu gezeichnet wird nur beim
  # Minutenwechsel, einmal: fc_redraw -- Kacheln samt laufender Stunde und
  # Marke jetzt, danach Kopfzeile, Seite PV, Statusleiste und Haus (Rest
  # heute rechnet minutengenau, fc_rest). Um :00 rechnet der Takt zuerst
  # die Vorstunde fertig und zeichnet sie dann. Waehrend eines Updates
  # nicht (ota_running, wie die Uhr); dt hoechstens 2 s, damit eine
  # Pause (Update, haengende Schleife) nicht als Leistung zaehlt.
  - interval: 1s
    then:
      - lambda: |-
          static int alt = -1;
          static uint32_t vorher = 0;
          const uint32_t ms = millis();
          const float dt = vorher != 0 ? std::min((ms - vorher) / 1000.0f, 2.0f) : 0.0f;
          vorher = ms | 1u;
          if (id(ota_running))
            return;
          int m = id(fc_clock);
          if (m < 0) {
            const ESPTime t = id(dash_time).now();
            m = t.is_valid() ? t.hour * 60 + t.minute : -1;
            if (t.is_valid())
              id(fc_live_tick)(t.day_of_year * 24 + t.hour, t.minute / 5, dt, id(fc_live_on));
          }
          if (m == alt)
            return;
          alt = m;
          id(fc_redraw).execute();

