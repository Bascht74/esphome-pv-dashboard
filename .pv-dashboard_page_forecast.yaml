##############################################################################
# Package: Seite 3 -- Prognose (Solcast)
#
# Auf Wunsch des Nutzers (25.09.2026): die Solcast-Prognose, wie sie der
# Blueprint ha-pv-optimizer (github.com/Bascht74/ha-pv-optimizer) benutzt.
# Er liest aus der Solcast-Integration (HACS) die Tagesprognose mit dem
# Attribut detailedForecast (Halbstunden, pv_estimate / pv_estimate10 /
# pv_estimate90 in kW), die verbleibende Energie heute, die aktuelle
# Leistung, die naechste Stunde und die Folgetage (morgen, Tag 3, Tag 4,
# je mit estimate10). Diese Seite zeigt genau das:
#
#   Heute       P50 mit Spanne P10..P90, Rest heute, jetzt, naechste
#               Stunde, Spitze mit Uhrzeit, Stand und API-Abrufe
#   Verlauf     Halbstunden 05:00..22:00: Band P10..P90, Linie P50,
#               Marke fuer jetzt
#   Folgetage   sieben Tage: P50 als Balken, P10..P90 als Strich, dazu das
#               Wetterbild des Tages (DWD, von der Seite Wetter)
#
# P10 ist die vorsichtige, P90 die mutige Schaetzung; der Blueprint mischt
# P50 und P10 (blend_p50_anteil). Die Mischung rechnet der Blueprint,
# hier stehen die Rohwerte.
#
# Drei Skripte gehoeren dazu; kuenftige Sensoren rufen nur diese auf, bis
# dahin stehen Striche:
#   fc_today   Kennzahlen heute       fc_slots  Halbstunden heute
#   fc_day     ein Folgetag
#
# Flaeche x 4..1276, y 84..736.
#   Heute     x 4, y 84, 400 x 300, innen 378 x 278: Titel 0..17,
#             P50 30..69 (f_val_xl 39), Einheit 71..88, Spanne 94..114,
#             Linie 124, zwei Zeilen Kennzahlen: Beschriftung 134..154 /
#             194..214, Wert 156..181 / 216..241, Uhrzeit der Spitze
#             243..260, Stand 261..278
#   Verlauf   x 412, y 84, 864 x 300, innen 842 x 278: Titel 0..17, Flaeche
#             30..240 (210), Grundlinie 240, Uhrzeiten 248..265; 34 Plaetze
#             je 24,8 px
#   Tage      x 4, y 392, 1272 x 344, innen 1250 x 322: Titel 0..17, sieben
#             Spalten je 178,6: Tag 28..50, Wetterbild 54..98 (f_wx_l),
#             Balken 110..262 (152), P50 268..293 (f_val_m), P10..P90
#             296..313 -> Reserve 9
##############################################################################

globals:
  # Halbstunden heute (48 Plaetze ab 00:00, kW) fuer den Verlauf; die Marke
  # "jetzt" braucht sie nicht, das Band aber beim Neuzeichnen.
  - id: fc_p50
    type: std::array<float, 48>
    restore_value: false
  - id: fc_p10
    type: std::array<float, 48>
    restore_value: false
  - id: fc_p90
    type: std::array<float, 48>
    restore_value: false
  # Folgetage: je P50, P10, P90 in kWh, NAN = kein Wert
  - id: fc_days
    type: std::array<float, 21>
    restore_value: false
    initial_value: '{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}'

script:
  # ---------------------------------------------------------------------
  # Kennzahlen heute (Solcast-Integration):
  #   p50, p10, p90  Tagesprognose in kWh (Zustand und Attribute
  #                  estimate10 / estimate90 des Sensors "heute")
  #   remaining      verbleibend heute in kWh
  #   power_now      Leistung jetzt in W
  #   next_hour      naechste Stunde in kWh
  #   peak_kw        Spitze heute in kW, peak_time "HH:MM" (leer = keine)
  #   updated        Zeit des letzten Abrufs "HH:MM" (leer = unbekannt)
  #   api_used, api_limit  Abrufe heute; < 0 = unbekannt
  #   NAN = kein Wert (Striche)
  # ---------------------------------------------------------------------
  - id: fc_today
    parameters:
      p50: float
      p10: float
      p90: float
      remaining: float
      power_now: float
      next_hour: float
      peak_kw: float
      peak_time: string
      updated: string
      api_used: int
      api_limit: int
    then:
      - lambda: |-
          auto &num = id(fmt_num);
          lv_label_set_text(id(fc_val_p50), num(p50, "%.1f", "---,-").c_str());
          const std::string span = "P10 bis P90: " + num(p10, "%.1f", "--,-") + " bis " + num(p90, "%.1f", "--,-") + " kWh";
          lv_label_set_text(id(fc_val_span), span.c_str());
          lv_label_set_text(id(fc_val_rest), num(remaining, "%.1f", "--,-").c_str());
          lv_label_set_text(id(fc_val_now), id(fmt_watt)(power_now, "--.---").c_str());
          lv_label_set_text(id(fc_val_next), num(next_hour, "%.1f", "--,-").c_str());
          lv_label_set_text(id(fc_val_peak), num(peak_kw, "%.1f", "--,-").c_str());
          lv_label_set_text(id(fc_peak_time), peak_time.empty() ? "um --:-- Uhr" : ("um " + peak_time + " Uhr").c_str());
          std::string foot = "Stand " + (updated.empty() ? std::string("--:--") : updated);
          if (api_used >= 0)
            foot += " · API " + std::to_string(api_used) + (api_limit > 0 ? " von " + std::to_string(api_limit) : std::string(""));
          lv_label_set_text(id(fc_foot), foot.c_str());
          id(data_seen)[6] = millis();

  # ---------------------------------------------------------------------
  # Halbstunden heute: je 48 kommagetrennte Werte in kW ab 00:00 (so
  # liefert detailedForecast den Tag), p10 und p90 duerfen leer sein.
  # Gezeigt werden 05:00 bis 22:00.
  # ---------------------------------------------------------------------
  - id: fc_slots
    parameters:
      p50: string
      p10: string
      p90: string
    then:
      - lambda: |-
          auto parse = [](const std::string &s, std::array<float, 48> &out) {
            out.fill(NAN);
            int n = 0;
            const char *q = s.c_str();
            while (*q && n < 48) {
              char *end = nullptr;
              const float v = strtof(q, &end);
              if (end == q)
                break;
              out[n++] = v;
              q = end;
              while (*q == ',' || *q == ' ')
                q++;
            }
          };
          parse(p50, id(fc_p50));
          parse(p10, id(fc_p10));
          parse(p90, id(fc_p90));
      - script.execute: fc_redraw

  # ---------------------------------------------------------------------
  # Ein Folgetag:
  #   day    0..6 (0 = heute, 1 = morgen, ...)
  #   label  Beschriftung ("Heute", "Morgen", "Sa 27.09.")
  #   cond   Wetterlage des Tages wie Home Assistant sie nennt ("sunny",
  #          "partlycloudy", "rainy" ...), leer = kein Bild
  #   p50, p10, p90  Tagesprognose in kWh, NAN = kein Wert
  # ---------------------------------------------------------------------
  - id: fc_day
    parameters:
      day: int
      label: string
      cond: string
      p50: float
      p10: float
      p90: float
    then:
      - lambda: |-
          if (day < 0 || day >= 7)
            return;
          lv_obj_t *const lab[7] = {id(fc_day_0), id(fc_day_1), id(fc_day_2), id(fc_day_3), id(fc_day_4), id(fc_day_5), id(fc_day_6)};
          lv_obj_t *const ico[7] = {id(fc_ico_0), id(fc_ico_1), id(fc_ico_2), id(fc_ico_3), id(fc_ico_4), id(fc_ico_5), id(fc_ico_6)};
          lv_label_set_text(lab[day], label.c_str());
          const auto c = id(wx_cond)(cond);
          lv_label_set_text(ico[day], std::get<0>(c));
          lv_obj_set_style_text_color(ico[day], lv_color_hex(std::get<1>(c)), 0);
          auto &d = id(fc_days);
          d[day * 3 + 0] = p50;
          d[day * 3 + 1] = p10;
          d[day * 3 + 2] = p90;
      - script.execute: fc_redraw

  # Zeichnet Verlauf, Marke und Folgetage neu. Von Hand ruft es niemand;
  # das interval unten zieht die Marke jede Minute nach.
  - id: fc_redraw
    then:
      - lambda: |-
          // --- Verlauf 05:00..22:00 ---
          lv_obj_t *const band[34] = {id(fc_band_00), id(fc_band_01), id(fc_band_02), id(fc_band_03), id(fc_band_04), id(fc_band_05), id(fc_band_06), id(fc_band_07), id(fc_band_08), id(fc_band_09), id(fc_band_10), id(fc_band_11), id(fc_band_12), id(fc_band_13), id(fc_band_14), id(fc_band_15), id(fc_band_16), id(fc_band_17), id(fc_band_18), id(fc_band_19), id(fc_band_20), id(fc_band_21), id(fc_band_22), id(fc_band_23), id(fc_band_24), id(fc_band_25), id(fc_band_26), id(fc_band_27), id(fc_band_28), id(fc_band_29), id(fc_band_30), id(fc_band_31), id(fc_band_32), id(fc_band_33)};
          const auto &p50 = id(fc_p50), &p10 = id(fc_p10), &p90 = id(fc_p90);
          float peak = 0.0f;
          for (int i = 0; i < 34; i++) {
            const int k = i + 10;
            for (float v : {p50[k], p10[k], p90[k]})
              if (!std::isnan(v))
                peak = std::max(peak, v);
          }
          const bool known = peak > 0.0f;
          if (!known)
            peak = 1.0f;
          const float H = 210.0f, BASE = 240.0f, SW = 24.7647f;
          static lv_point_precise_t pts[34];
          int np = 0;
          for (int i = 0; i < 34; i++) {
            const int k = i + 10;
            const float lo = std::isnan(p10[k]) ? p50[k] : p10[k];
            const float hi = std::isnan(p90[k]) ? p50[k] : p90[k];
            if (std::isnan(lo) || std::isnan(hi)) {
              lv_obj_add_flag(band[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              const int y0 = (int) lroundf(BASE - hi / peak * H);
              const int y1 = (int) lroundf(BASE - lo / peak * H);
              lv_obj_set_y(band[i], y0);
              lv_obj_set_height(band[i], std::max(y1 - y0, 2));
              lv_obj_clear_flag(band[i], LV_OBJ_FLAG_HIDDEN);
            }
            if (!std::isnan(p50[k])) {
              pts[np].x = (lv_value_precise_t) (SW * i + SW / 2);
              pts[np].y = (lv_value_precise_t) (BASE - 30.0f - p50[k] / peak * H);  // Linie liegt bei y 30
              np++;
            }
          }
          lv_line_set_points(id(fc_line)->obj, pts, np);
          if (np < 2)
            lv_obj_add_flag(id(fc_line)->obj, LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_clear_flag(id(fc_line)->obj, LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(id(fc_scale), known ? ("Skala bis " + id(fmt_num)(peak, "%.1f", "--") + " kW").c_str() : "");

          // Marke jetzt
          auto now = id(dash_time).now();
          const float pos = now.is_valid() ? (now.hour * 60 + now.minute - 300) / 30.0f : -1.0f;
          if (pos < 0.0f || pos >= 34.0f) {
            lv_obj_add_flag(id(fc_now), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_set_x(id(fc_now), (int) lroundf(pos * SW) - 1);
            lv_obj_clear_flag(id(fc_now), LV_OBJ_FLAG_HIDDEN);
          }

          // --- Folgetage ---
          lv_obj_t *const bar[7] = {id(fc_bar_0), id(fc_bar_1), id(fc_bar_2), id(fc_bar_3), id(fc_bar_4), id(fc_bar_5), id(fc_bar_6)};
          lv_obj_t *const rng[7] = {id(fc_rng_0), id(fc_rng_1), id(fc_rng_2), id(fc_rng_3), id(fc_rng_4), id(fc_rng_5), id(fc_rng_6)};
          lv_obj_t *const val[7] = {id(fc_dval_0), id(fc_dval_1), id(fc_dval_2), id(fc_dval_3), id(fc_dval_4), id(fc_dval_5), id(fc_dval_6)};
          lv_obj_t *const sub[7] = {id(fc_dsub_0), id(fc_dsub_1), id(fc_dsub_2), id(fc_dsub_3), id(fc_dsub_4), id(fc_dsub_5), id(fc_dsub_6)};
          const auto &d = id(fc_days);
          float dpeak = 0.0f;
          for (int i = 0; i < 21; i++)
            if (!std::isnan(d[i]))
              dpeak = std::max(dpeak, d[i]);
          if (dpeak <= 0.0f)
            dpeak = 1.0f;
          const float DH = 150.0f, DBASE = 262.0f;
          for (int i = 0; i < 7; i++) {
            const float v = d[i * 3], lo = d[i * 3 + 1], hi = d[i * 3 + 2];
            lv_label_set_text(val[i], id(fmt_num)(v, "%.1f", "--,-").c_str());
            if (std::isnan(v)) {
              lv_obj_add_flag(bar[i], LV_OBJ_FLAG_HIDDEN);
            } else {
              const int h = std::max((int) lroundf(v / dpeak * DH), 2);
              lv_obj_set_y(bar[i], (int) DBASE - h);
              lv_obj_set_height(bar[i], h);
              lv_obj_clear_flag(bar[i], LV_OBJ_FLAG_HIDDEN);
            }
            if (std::isnan(lo) || std::isnan(hi)) {
              lv_obj_add_flag(rng[i], LV_OBJ_FLAG_HIDDEN);
              lv_label_set_text(sub[i], "P10 bis P90 --");
            } else {
              const int y0 = (int) lroundf(DBASE - hi / dpeak * DH);
              const int y1 = (int) lroundf(DBASE - lo / dpeak * DH);
              lv_obj_set_y(rng[i], y0);
              lv_obj_set_height(rng[i], std::max(y1 - y0, 2));
              lv_obj_clear_flag(rng[i], LV_OBJ_FLAG_HIDDEN);
              const std::string s = "P10 bis P90 " + id(fmt_num)(lo, "%.0f", "--") + " bis " + id(fmt_num)(hi, "%.0f", "--");
              lv_label_set_text(sub[i], s.c_str());
            }
          }

interval:
  - interval: 60s
    then:
      - script.execute: fc_redraw

