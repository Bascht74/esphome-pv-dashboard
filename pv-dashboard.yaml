##############################################################################
# Waveshare ESP32-P4-WIFI6-Touch-LCD-10.1  (SKU 33150, "X"-Serie)
#
#   SoC        : ESP32-P4 (RISC-V Dual-Core, kein eigenes Funkmodul)
#   Funk       : ESP32-C6-MINI-1U als Co-Prozessor via SDIO  -> esp32_hosted
#   Display    : 10.1" 800x1280 IPS, MIPI-DSI 2-Lane, JD9365
#   Touch      : GT911 (kapazitiv, 10 Punkte) an I2C
#   PSRAM      : 32 MB (im Chip-Package, HEX-Mode)
#   Flash      : 32 MB NOR
#
# Dies ist die EINZIGE Datei, die beim Einrichten angefasst wird. Sie enthaelt
# den Geraetenamen, die Zugangsdaten als Verweis auf die secrets.yaml und die
# Liste der Pakete. Alles Weitere steht in den Paketen daneben.
##############################################################################

substitutions:
  upper_devicename: PV-Dashboard
  devicename: pv-dashboard
  device_description: "Waveshare ESP32-P4-WIFI6-Touch-LCD-10.1"

  # Zugangsdaten. Nur hier steht !secret -- die Pakete arbeiten ausschliesslich
  # mit ${...} und bleiben damit frei von Geheimnissen. Das ist Voraussetzung
  # dafuer, sie spaeter aus dem GitHub-Repo nachzuladen, waehrend diese Datei
  # und die secrets.yaml auf dem Rechner bleiben.
  #
  # Die Werte selbst stehen in secrets.yaml (nicht im Repo). Welche Schluessel
  # dort erwartet werden, zeigt secrets.yaml.example.
  #
  # Geprueft mit 2026.9.0: ESPHome setzt substitutions erst nach dem
  # Zusammenfuehren der Pakete ein und merkt sich dabei die Herkunft aus
  # !secret. "esphome config" zeigt weiterhin nur "!secret '<name>'", nicht den
  # Wert -- der Umweg ueber substitutions gibt also nichts preis.
  wifi_ssid:     !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_password:   !secret ap_password
  api_key:       !secret encryption_key
  ota_password:  !secret ota_password

  ############################################################################
  # HIER BESCHREIBEN SIE IHRE ANLAGE
  #
  # Die Beschriftungen im Anlagenschema und die drei Tarife. Jeder Wert hat
  # im zugehoerigen Paket einen Standard; was hier steht, sticht ihn. ESPHome
  # laesst dabei die Hauptdatei gewinnen -- geprueft mit 2026.9.0, die Pakete
  # bleiben unangetastet. Eine geloeschte Zeile faellt auf den Demo-Wert
  # zurueck, eine zusaetzliche Zeile gibt es nicht: Nur die hier genannten
  # Namen werden im Schema eingesetzt.
  #
  # Die Kaesten sind knapp gerechnet. Eine laengere Beschriftung sprengt den
  # Kasten oder wird von LVGL mit "..." gekuerzt (long_mode DOT). Hinter
  # jeder Zeile steht deshalb "Breite des Demo-Werts von verfuegbarer
  # Breite", in Pixeln und in der Schrift des jeweiligen Kastens gemessen.
  # Die Kontrolle fuer die eigenen Werte ist der Vergleich mit genau diesen
  # Zahlen: Bleibt die eigene Beschriftung unter der verfuegbaren Breite,
  # passt sie.
  #
  # Der Screenshot-Lauf zeigt die eigenen Werte NICHT. Er baut ueber
  # pv-dashboard-sim.yaml, und keine der beiden Dateien bindet diese Datei
  # hier ein -- auf den Bildern stehen immer die Demo-Werte aus den
  # Seiten-Paketen (geprueft mit 2026.9.0). Wer eine eigene Beschriftung
  # wirklich gerendert sehen will, traegt sie zum Messen voruebergehend in
  # das jeweilige Seiten-Paket ein und rendert dann:
  #
  #   ~/.venvs/esphome-beta/bin/esphome run pv-dashboard-shots.yaml
  #   sips -s format png shots/*.bmp --out shots/
  #
  # Danach die Checkliste in docs/04 durchgehen.
  ############################################################################

  # --- Dachflaechen und Module (obere Reihe im Schema, je 88 px) ---------
  # Reihenfolge von links nach rechts; Platz 3 und 4 sind die zwei
  # Einzelmodule am Mini-Wechselrichter.
  name_pv_1: "Dach Süd"        # 56 von 88
  name_pv_2: "Dach West"       # 63 von 88
  name_pv_3: "Modul 1"         # 48 von 88
  name_pv_4: "Modul 2"         # 48 von 88
  name_pv_5: "Dach Ost"        # 53 von 88
  name_pv_6: "Nebendach"       # 67 von 88
  name_pv_7: "Dach Nord"       # 62 von 88
  name_pv_8: "Garagendach"     # 78 von 88

  # --- Wechselrichter (zweite Reihe, je 132 px) -------------------------
  # Je Geraet die zwei Flaechen darueber. Die Leistung gehoert in die
  # Beschriftung, sie steht sonst nirgends auf der Seite.
  name_inv_1: "Voll-WR 7 kW"       #  81 von 132, Flaechen 1 und 2
  name_inv_2: "Mini-WR 0,8 kW"     #  94 von 132, Module 3 und 4
  name_inv_3: "Hybrid 10 kW · A"   #  98 von 132, Flaechen 5 und 6
  name_inv_4: "Hybrid 10 kW · B"   #  98 von 132, Flaechen 7 und 8

  # --- Rahmen um die Volleinspeisung ------------------------------------
  # Sitzt auf der unteren Rahmenlinie und stanzt sie frei. Zweizeilig: Das
  # "\n" im Wert ist der Zeilenumbruch, jede Zeile hat 64 px.
  name_feedin: "VOLLEIN-\nSPEISUNG"   # 58 / 64 von je 64

  # --- Speicher (je 108 px im Schema, 300 px auf der Speicherseite) -----
  # Dieselben drei Namen tragen auch die Ringe und die Tabellenkoepfe auf
  # der Speicherseite; dort stehen sie in Grossbuchstaben.
  name_bat_1: "Speicher 1"     # 63 von 108
  name_bat_2: "Speicher 2"     # 63 von 108
  name_bat_3: "Speicher 3"     # 63 von 108
  # Zweitzeile unter dem Mittelwert auf der Speicherseite (326 px)
  name_bat_summary: "Mittel der drei Speicher"   # 139 von 326

  # --- Hausnetz und Verbraucherschiene ----------------------------------
  name_house: "Hausnetz"       #  64 von 172
  name_heatpump: "Wärmepumpe"  #  83 von 94
  name_misc: "Sonstige"        #  50 von 94, Sammelposten fuer alles uebrige
  name_wb_1: "Wallbox 1"       #  60 von 94
  name_wb_2: "Wallbox 2"       #  60 von 94

  # --- Zaehler (untere Reihe) -------------------------------------------
  name_meter_pv: "PV-Zähler"      #  59 von 122, Zaehler des Volleinspeise-Kreises
  name_grid: "Hausanschluss"      #  86 von 158, Netzpunkt in der Mitte
  name_meter_house: "Hauszähler"  #  65 von 122, Einspeisung und Bezug des Hauses

  # --- Zweitzeile der Kachel Eigenverbrauch (92 px) ---------------------
  # Die Quote laesst die Volleinspeisung aussen vor (docs/01). Bewusst ein
  # eigener Text und kein Verweis auf name_inv_1: Der Name traegt dort die
  # Leistung mit, "ohne Voll-WR 7 kW" waere 112 px breit und wuerde in der
  # nur 92 px schmalen Kachel umbrechen. Wer name_inv_1 aendert, zieht
  # hier von Hand nach.
  name_selfuse_note: "ohne Voll-WR"   # 79 von 92

  # --- Tarife fuer die Geldrechnung, in Cent je kWh ----------------------
  # Noch ohne Wirkung: Die Geldrechnung ist nicht gebaut (docs/06), keine
  # Paketdatei liest diese drei Werte, und die Kachel TAGESERTRAG zeigt
  # weiter Striche. Sie werden hier nur schon vorgehalten.
  # Demo-Werte, bewusst rund. Die eigenen Tarife gehoeren hierher. Im Repo
  # stehen die Demo-Werte; eigene Werte landen nur dann darin, wenn diese
  # Datei committet wird.
  tarif_volleinspeisung_ct: "20.0"  # Volleinspeisung
  tarif_ueberschuss_ct: "10.0"      # Ueberschusseinspeisung
  tarif_bezug_ct: "30.0"            # Strombezug

esphome:
  name: "${devicename}"
  friendly_name: "${upper_devicename}"
  comment: "${device_description}"
  min_version: 2026.9.0

packages:
  # Gemeinsam mit dem Simulator (pv-dashboard-sim.yaml) -- hier geaenderte
  # Oberflaeche wirkt dort sofort mit.
  utility: !include .pv-dashboard_utility.yaml
  ui:      !include .pv-dashboard_ui.yaml
  # Nur auf dem Geraet
  display: !include .pv-dashboard_display.yaml
  audio:   !include .pv-dashboard_audio.yaml
  # Chip, Funk, WLAN, API, OTA, Bluetooth, Zeit und Diagnose, serielle
  # Schnittstellen. Steht bewusst am Ende: ESPHome haengt Listen aus Paketen
  # in der Reihenfolge der Deklaration aneinander, und die Diagnose-Sensoren
  # standen auch vorher hinter denen der Oberflaeche.
  core:    !include .pv-dashboard_core.yaml

##############################################################################
# SPAETER: dieselben Pakete aus dem GitHub-Repo statt von der Platte
#
# Der Block unten ist ausgeschaltet, weil das Repo heute noch privat ist --
# fuer ein privates Repo muesste hier username/password stehen, also ein
# Token in genau der Datei, die keine Geheimnisse enthalten soll. Sobald das
# Repo oeffentlich ist, werden die beiden Bloecke getauscht: den Block oben
# auskommentieren, den Block unten einkommentieren. Geprueft mit 2026.9.0
# gegen eine Kopie dieses Repos: Der Dump von "esphome config" ist danach
# Zeile fuer Zeile derselbe, abgesehen von den Pfaden der beiden Bilder
# (sie zeigen dann in den Checkout) und dem letzten Punkt unten.
#
# Was sich dadurch aendert:
#   * Das Geraet baut aus dem GESCHOBENEN Stand. Eine Aenderung an einem
#     Paket wirkt erst nach einem push, nicht schon beim Speichern.
#   * ESPHome legt den Checkout unter .esphome/packages ab und frischt ihn
#     nur gemaess refresh auf: bei "1d" fruehestens am naechsten Tag,
#     "always" holt bei jedem Lauf, "never" gar nicht.
#   * Simulator und Screenshots bleiben lokal. pv-dashboard-sim.yaml und
#     pv-dashboard-shots.yaml binden die Dateien weiter von der Platte ein
#     und zeigen damit den Arbeitsstand schon vor dem push.
#   * Die Zusage weiter oben gilt dann nicht mehr: "esphome config" zeigt
#     die Werte aus der secrets.yaml nicht laenger als !secret '<name>',
#     sondern als Wert -- im Terminal unsichtbar gestellt, in einer
#     umgeleiteten Datei aber lesbar. Grund ist ESPHome selbst: jede
#     nachgeladene Paketdatei leert die Merkliste, aus der die Ausgabe den
#     Namen zurueckholt. Nach der Umstellung die Ausgabe also nicht mehr in
#     eine Datei schreiben.
#
# Die sieben Seitendateien stehen mit Absicht NICHT in der Liste:
# .pv-dashboard_ui.yaml holt sie selbst ueber !include, und zwar aus
# demselben Checkout. Wer sie zusaetzlich auflistet, bekommt jede Seite
# zweimal und der Lauf bricht ab ("ID redraw_curve redefined"). Genauso
# kommt der Ordner images/ aus dem Checkout: ESPHome sucht eine Bilddatei
# auch neben der Paketdatei, nicht nur neben dieser Datei hier.
#
# Die Kurzform, eine Zeile je Datei, tut es auch:
#   ui: github://Bascht74/esphome-pv-dashboard/.pv-dashboard_ui.yaml@main
# Die Langform unten kommt dagegen mit einem einzigen Checkout fuer alle
# Dateien aus und haelt Repo, Zweig und Auffrischung an einer Stelle.
##############################################################################
# packages:
#   dashboard:
#     url: https://github.com/Bascht74/esphome-pv-dashboard
#     ref: main
#     refresh: 1d
#     files:
#       - .pv-dashboard_utility.yaml
#       - .pv-dashboard_ui.yaml
#       - .pv-dashboard_display.yaml
#       - .pv-dashboard_audio.yaml
#       - .pv-dashboard_core.yaml
