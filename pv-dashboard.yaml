##############################################################################
# Waveshare ESP32-P4-WIFI6-Touch-LCD-10.1  (SKU 33150, "X"-Serie)
#
#   SoC        : ESP32-P4 (RISC-V Dual-Core, kein eigenes Funkmodul)
#   Funk       : ESP32-C6-MINI-1U als Co-Prozessor via SDIO  -> esp32_hosted
#   Display    : 10.1" 800x1280 IPS, MIPI-DSI 2-Lane, JD9365
#   Touch      : GT911 (kapazitiv, 10 Punkte) an I2C
#   PSRAM      : 32 MB (im Chip-Package, HEX-Mode)
#   Flash      : 32 MB NOR
#
# Beim Einrichten werden zwei Dateien angefasst: diese und die eigene
# .pv-dashboard_anlage.yaml (Beschriftungen und Tarife, nicht im Repo). Diese
# hier enthaelt den Geraetenamen, die Zugangsdaten als Verweis auf die
# secrets.yaml und die Liste der Pakete. Alles Weitere steht in den Paketen
# daneben.
##############################################################################

substitutions:
  upper_devicename: PV-Dashboard
  devicename: pv-dashboard
  device_description: "Waveshare ESP32-P4-WIFI6-Touch-LCD-10.1"

  # Zugangsdaten. Nur hier steht !secret -- die Pakete arbeiten ausschliesslich
  # mit ${...} und bleiben damit frei von Geheimnissen. Das ist Voraussetzung
  # dafuer, dass sie aus dem GitHub-Repo kommen (Block packages: unten),
  # waehrend diese Datei und die secrets.yaml auf dem Rechner bleiben.
  #
  # Die Werte selbst stehen in secrets.yaml (nicht im Repo). Welche Schluessel
  # dort erwartet werden, zeigt secrets.yaml.example.
  #
  # ACHTUNG, geprueft mit 2026.9.0: Seit die Pakete aus dem Repo kommen, zeigt
  # "esphome config" die Werte aus der secrets.yaml AUFGELOEST, nicht mehr als
  # "!secret '<name>'" (Begruendung unten bei "Was der Bezug aus dem Repo
  # bedeutet"). Die Ausgabe nie in eine Datei umleiten, nie weitergeben, nie
  # mit --show-secrets aufrufen.
  wifi_ssid:     !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_password:   !secret ap_password
  api_key:       !secret encryption_key
  ota_password:  !secret ota_password

  ############################################################################
  # HIER BESCHREIBEN SIE IHRE ANLAGE -- in einer eigenen Datei
  #
  # Die Beschriftungen im Anlagenschema und die drei Tarife stehen in
  # .pv-dashboard_anlage.yaml. Die Datei liegt nur auf dem Rechner: .gitignore
  # schliesst sie aus, ein "git add -A" nimmt die eigenen Werte also nicht
  # mit. Diese Datei hier bleibt im Repo und traegt keine Anlagendaten mehr.
  # Vorlage mit den Demo-Werten und den Breiten jedes Kastens:
  #
  #   cp .pv-dashboard_anlage.yaml.example .pv-dashboard_anlage.yaml
  #
  # "<<" fuegt die Eintraege der Datei hier ein, als stuenden sie in diesen
  # substitutions. Sie gelten damit als Werte der Hauptdatei und stechen die
  # Standards in den Seiten-Paketen (geprueft mit 2026.9.0). Fehlt die
  # Datei, bricht "esphome config" mit "Could not find file" ab.
  ############################################################################
  <<: !include .pv-dashboard_anlage.yaml

esphome:
  name: "${devicename}"
  friendly_name: "${upper_devicename}"
  comment: "${device_description}"
  min_version: 2026.9.0

packages:
  # Die Pakete kommen aus dem GitHub-Repo, nicht von der Platte. Ein einziger
  # Checkout fuer alle Dateien; Repo, Zweig und Auffrischung stehen hier an
  # einer Stelle. Statt "ref: main" laesst sich auch ein Release festnageln,
  # z. B. "ref: v0.2.0" -- dann aendert sich am Geraet nichts, bis jemand die
  # Zeile anfasst.
  dashboard:
    url: https://github.com/Bascht74/esphome-pv-dashboard
    ref: main
    refresh: 1d
    files:
      - .pv-dashboard_utility.yaml
      - .pv-dashboard_ui.yaml
      - .pv-dashboard_display.yaml
      - .pv-dashboard_audio.yaml
      - .pv-dashboard_core.yaml
      # Datenweg von Home Assistant (tools/ha_bindings.py); braucht in Home
      # Assistant die Option "Allow the device to perform Home Assistant
      # actions" (docs/03, Abschnitt "Datenweg")
      - .pv-dashboard_ha.yaml

##############################################################################
# Was der Bezug aus dem Repo bedeutet
#
#   * Das Geraet baut aus dem GESCHOBENEN Stand. Eine Aenderung an einem Paket
#     wirkt erst nach "git push", nicht schon beim Speichern.
#   * ESPHome legt den Checkout unter .esphome/packages ab und frischt ihn
#     gemaess refresh auf: "1d" fruehestens am naechsten Tag, "always" bei
#     jedem Lauf, "never" gar nicht.
#   * Simulator und Screenshots bleiben lokal: pv-dashboard-sim.yaml und
#     pv-dashboard-shots.yaml binden die Dateien weiter von der Platte ein und
#     zeigen den Arbeitsstand schon vor dem push. Zum Pruefen einer Aenderung
#     also erst den Simulator, dann pushen, dann das Geraet bauen.
#   * ACHTUNG bei "esphome config": Die Ausgabe zeigt die Werte aus der
#     secrets.yaml jetzt aufgeloest statt als !secret '<name>' -- im Terminal
#     unsichtbar gestellt, in einer umgeleiteten Datei aber lesbar. Grund ist
#     ESPHome selbst: jede nachgeladene Paketdatei leert die Merkliste, aus der
#     die Ausgabe den Namen zurueckholt. Die Ausgabe deshalb nicht in eine
#     Datei schreiben und nicht weitergeben. Im Repo steht davon nichts, die
#     Werte stehen ausschliesslich in der lokalen secrets.yaml.
#   * Die Seitendateien stehen mit Absicht NICHT in der Liste:
#     .pv-dashboard_ui.yaml holt sie selbst ueber !include, aus demselben
#     Checkout. Wer sie zusaetzlich auflistet, bekommt jede Seite zweimal und
#     der Lauf bricht ab ("ID redraw_curve redefined"). Genauso kommt images/
#     aus dem Checkout.
#
# Rueckfall auf die Dateien von der Platte -- zum Ausprobieren ohne push:
# den Block oben auskommentieren, diesen hier einkommentieren.
#
# packages:
#   utility: !include .pv-dashboard_utility.yaml
#   ui:      !include .pv-dashboard_ui.yaml
#   display: !include .pv-dashboard_display.yaml
#   audio:   !include .pv-dashboard_audio.yaml
#   core:    !include .pv-dashboard_core.yaml
#   ha:      !include .pv-dashboard_ha.yaml
##############################################################################
