            y: 624
            width: 178
            height: 112
            widgets:
              # Ring wie auf der Speicherseite: konischer Verlauf als Scheibe,
              # innen eine Scheibe in Kachelfarbe (Ring 7 breit), darueber ein
              # Bogen im REVERSE-Modus, der 100 - Autarkie in Spurfarbe
              # abdeckt (Wert 100 = leer, der Stand ohne Daten; speisen wie
              # storage_update: lv_arc_set_value(Deckbogen, 100 - Wert)).
              # Die untere Oeffnung deckt zuletzt ein Bogen in Kachelfarbe:
              # je 3 Grad in den Ring hinein, damit nie zwei geglaettete
              # Kanten aufeinander liegen, und 62 breit, damit der Saum der
              # Scheibe nicht durchscheint (die Scheibe schneidet ihn auf 58
