                  text: "0 offen · 0 Einträge"
                  text_font: f_val_s
                  text_color: $col_ink
              # Knoepfe 170 x 36 (innen 38, Reserve 2), Abstand gap_tile.
              # Beide starten gesperrt; alert_refresh gibt sie frei. Die
              # Beschriftung ist ein eigenes Label mit align CENTER -- das
              # text: des Knopfes sitzt am Innenabstand des Themes, nicht
              # mittig. recolor_opa: TRANSP schaltet das graue Umfaerben ab
              # (recolor 50 %), das das Theme gesperrten Knoepfen ueberlegt.
              - button:
                  id: btn_alerts_ack
                  styles: st_btn
                  align: RIGHT_MID
                  x: -178
                  width: 170
                  height: 36
