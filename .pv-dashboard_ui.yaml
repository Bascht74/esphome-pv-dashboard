        # ================= Anlagenschema =================================
        # Flaeche 904 x 668, Mittelachse x 452. Die Flex-Kaesten (Hausnetz,
        # Verbraucher, Zaehler) setzen ihren Zeilenabstand ausdruecklich:
        # pad_row: 4 im layout-Block -- direkt am Widget lehnt ESPHome
        # pad_row ab. Ohne die Angabe gilt der Abstand aus LVGLs
        # Standard-Theme, und flex_align_main CENTER schneidet die erste und
        # letzte Zeile dann stillschweigend am Rahmen ab.
        # Rechnung je Kasten: Zeilenhoehen + pad_row x (Zeilen - 1) muss in
        # Hoehe - 2 x pad_all - 2 x Rahmen passen, mit Reserve > 0.
        # Zeilenhoehen (so im erzeugten Code): Bild 24, f_icon 24, f_unit 17,
        # f_text_s 20, f_val_s 21, f_val_m 25, f_val_l 30, f_val_xl 39.
        # Einheit und Tageswert teilen sich eine Zeile; das spart je Kasten
