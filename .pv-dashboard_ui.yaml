            width: 364
            height: 200
            widgets:
              - label:
                  styles: st_label
                  width: 342
                  long_mode: WRAP
                  text: "TAGESVERLAUF · IST UND PROGNOSE"
              # 16 Balken im Raster 21 belegen 15 x 21 + 17 = 332 px der 342 px
              # Innenbreite -- x ab 5 gibt links und rechts je 5 px Rand. Die
              # Prognoselinie ruht mit x: 5 im selben Raster, redraw_curve
