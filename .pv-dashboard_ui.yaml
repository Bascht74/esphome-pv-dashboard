            scrollable: false
            scroll_dir: NONE
            x: 1098
            y: 624
            width: 178
            height: 112
            widgets:
              # Ring wie Autarkie, der Bogen deckt 100 - Eigenverbrauch ab
              - obj:
                  x: 0
                  y: 16
                  width: 58
                  height: 58
                  radius: CIRCLE
                  bg_grad: grad_selfuse_ring
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  scrollbar_mode: 'off'
                  scrollable: false
                  scroll_dir: NONE
                  widgets:
                    - obj: { align: CENTER, width: 44, height: 44, radius: CIRCLE, bg_color: $col_surface, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false, scrollable: false }
                    - arc: { id: ring_cover_selfuse, align: CENTER, width: 58, height: 58, start_angle: 135, end_angle: 45, mode: REVERSE, value: 100, arc_opa: TRANSP, arc_width: 7, pad_all: 0, clickable: false,
