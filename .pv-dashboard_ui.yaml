                             indicator: { arc_opa: TRANSP, pad_all: 0 }, knob: { bg_opa: TRANSP, pad_all: 0 } }
              # Wert und Einheit mittig im Ring (x 0..58); das "%" sitzt in
              # der unteren Oeffnung des Bogens. Wert 26..47, Einheit 47..64:
              # Blockmitte 45 = Ringmitte (16 + 29), keine Ueberlappung.
