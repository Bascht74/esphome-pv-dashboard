##############################################################################
# Package: Oberflaeche (LVGL)
#
# Wird von BEIDEN Konfigurationen eingebunden:
#   pv-dashboard.yaml      -> echtes Panel, MIPI-DSI + GT911
#   pv-dashboard-sim.yaml  -> Fenster auf dem Rechner, SDL
#
# Beide erwarten dieselben IDs: main_display und main_touchscreen. Damit ist
# die Oberflaeche an genau einer Stelle gepflegt.
#
# Stand: Grundgeruest -- Statusleiste, Meldungszeile, rechte Kennzahlenspalte,
# Navigationsleiste. Das Anlagenschema folgt.
##############################################################################

lvgl:
  displays:
    - main_display
  touchscreens:
    - main_touchscreen
  buffer_size: 100%

  # Die Drehung steht bewusst NICHT hier, sondern in
  # .pv-dashboard_display.yaml: Das Panel ist nativ hochkant und muss gedreht
  # werden, das SDL-Fenster des Simulators ist bereits quer. Stuende die
  # Drehung hier, kippte die Oberflaeche im Simulator um 90 Grad.

  # Grundfarben der gesamten Oberflaeche
  bg_color: $col_bg
  text_color: $col_ink
  text_font: f_text

  # Das Abdunkeln steht bewusst NICHT hier: Es braucht das Backlight, das es
  # nur auf dem Geraet gibt. Der passende on_idle-Block liegt in
  # .pv-dashboard_display.yaml und wird beim Bauen dazugemischt -- mit
  # demselben Timeout wie hier, sodass beides zusammen ausgeloest wird.
  #
  # Der Rueckfall auf die Uebersicht gehoert dagegen hierher: Er kommt ohne
  # Hardware aus und laesst sich damit im Simulator genauso pruefen.
  on_idle:
    - timeout: $idle_timeout
      then:
        - lvgl.page.show: page_overview
        # one_checked raeumt nur beim Antippen auf. Wird die Seite aus einer
        # Automatik heraus gewechselt, muessen die Reiter von Hand nachziehen.
        - lvgl.matrix.button.update:
            id:
              - btn_nav_pv
              - btn_nav_battery
              - btn_nav_wallbox
              - btn_nav_heatpump
              - btn_nav_house
              - btn_nav_alerts
            control:
              checked: false
        - lvgl.matrix.button.update:
            id: btn_nav_overview
            control:
              checked: true

  style_definitions:
    # --- Kachel: Grundflaeche fuer Kennzahlen ---------------------------
    - id: st_tile
      bg_color: $col_surface
      bg_opa: COVER
      border_color: $col_line
      border_width: 1
      radius: $radius_tile
      pad_all: $pad_tile

    # --- Geraetekasten im Schema ---------------------------------------
    - id: st_box
      bg_color: $col_surface
      bg_opa: COVER
      border_color: $col_line
      border_width: 2
      radius: $radius_box
      pad_all: 4

    # --- Beschriftung ueber einem Wert ---------------------------------
    - id: st_label
      text_color: $col_ink3
      text_font: f_label
      text_letter_space: 1

    # --- Einheit unter einem Wert --------------------------------------
    - id: st_unit
      text_color: $col_ink3
      text_font: f_unit

    # --- Zweitzeile unter einem Wert -----------------------------------
    - id: st_sub
      text_color: $col_ink3
      text_font: f_unit

  top_layer:
    widgets:
      # Statusleiste
      - obj:
          id: bar_status
          x: 0
          y: 0
          width: 1280
          height: 44
          bg_color: $col_bg
          bg_opa: COVER
          scrollbar_mode: 'off'
          border_width: 0
          border_side: [BOTTOM]
          border_color: $col_line
          pad_all: 0
          widgets:
            - label:
                id: lbl_clock
                x: $pad_page
                y: 12
                text: "--:--"
                text_font: f_val_l
                text_color: $col_ink
            - label:
                id: lbl_date
                x: 96
                y: 15
                text: ""
                text_color: $col_ink2
                text_font: f_text_s
            - label:
                id: lbl_status_right
                align: RIGHT_MID
                x: -$pad_page
                width: 700
                long_mode: DOT
                text_align: RIGHT
                text: "Autarkie -- % · Prognose -- kWh"
                text_color: $col_ink2
                text_font: f_text_s

      # Meldungszeile: zeigt nur die juengste Stoerung, oeffnet auf Tipp die Liste
      - obj:
          id: bar_alert
          x: 0
          y: 44
          width: 1280
          height: 32
          bg_color: $col_warn
          bg_opa: 8%
          scrollbar_mode: 'off'
          border_width: 0
          radius: 0
          pad_all: 0
          widgets:
            - label:
                id: lbl_alert
                x: $pad_page
                align: LEFT_MID
                width: 1120
                long_mode: DOT
                text: "Keine Meldungen"
                text_color: $col_ink2
                text_font: f_text_s
            - label:
                id: lbl_alert_count
                align: RIGHT_MID
                x: -$pad_page
                text: ""
                text_color: $col_ink3
                text_font: f_unit


      # Menueleiste. Liegt im top_layer und ist damit auf jeder Seite da.
      - obj:
          id: bar_nav
          x: 0
          y: 744
          width: 1280
          height: 56
          bg_color: $col_bg
          bg_opa: COVER
          scrollbar_mode: 'off'
          border_width: 1
          border_side: [TOP]
          border_color: $col_line
          pad_all: 6
          widgets:
            - buttonmatrix:
                id: nav_matrix
                align: CENTER
                width: 1256
                height: 44
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                # Genau ein Reiter ist markiert: LVGL nimmt beim Antippen dem
                # vorherigen die Markierung ab. Ohne das bliebe sie kleben.
                one_checked: true
                items:
                  bg_color: $col_surface
                  bg_opa: COVER
                  border_color: $col_line
                  border_width: 1
                  radius: 9
                  text_color: $col_ink2
                  text_font: f_text_s
                  pressed:
                    bg_color: $col_batt
                    bg_opa: 20%
                    text_color: $col_batt
                  checked:
                    bg_color: $col_batt
                    bg_opa: 18%
                    border_color: $col_batt
                    text_color: $col_batt
                # "checkable" ist Pflicht, damit ein Reiter seine Markierung
                # ueberhaupt annehmen kann -- ohne das greift der checked-Stil
                # oben nur bei dem Reiter, der sie beim Start fest zugewiesen
                # bekommt. Die IDs braucht der Rueckfall auf die Uebersicht.
                rows:
                  - buttons:
                      - text: "Übersicht"
                        id: btn_nav_overview
                        control: { checkable: true, checked: true }
                        on_press:
                          - lvgl.page.show: page_overview
                      - text: "PV & Prognose"
                        id: btn_nav_pv
                        control: { checkable: true }
                        on_press:
                          - lvgl.page.show: page_pv
                      - text: "Speicher"
                        id: btn_nav_battery
                        control: { checkable: true }
                        on_press:
                          - lvgl.page.show: page_battery
                      - text: "Wallboxen"
                        id: btn_nav_wallbox
                        control: { checkable: true }
                        on_press:
                          - lvgl.page.show: page_wallbox
                      - text: "Wärmepumpe"
                        id: btn_nav_heatpump
                        control: { checkable: true }
                        on_press:
                          - lvgl.page.show: page_heatpump
                      - text: "Haus"
                        id: btn_nav_house
                        control: { checkable: true }
                        on_press:
                          - lvgl.page.show: page_house
                      - text: "Meldungen"
                        id: btn_nav_alerts
                        control: { checkable: true }
                        on_press:
                          - lvgl.page.show: page_alerts

      # Sprachassistent: liegt als Overlay ueber der Seite und erscheint nur,
      # solange die Pipeline laeuft. So braucht er keinen festen Platz im
      # Layout, ist aber aus jeder Entfernung sichtbar.
      - obj:
          id: voice_panel
          align: BOTTOM_MID
          y: -24
          width: 720
          height: 132
          hidden: true
          bg_color: $col_surface
          bg_opa: 95%
          scrollbar_mode: 'off'
          border_color: $col_batt
          border_width: 2
          radius: 16
          pad_all: 16
          widgets:
            - label:
                id: lbl_assist_status
                align: TOP_MID
                text: "Bereit"
                text_font: f_val_l
                text_color: $col_batt
            - label:
                id: lbl_assist_request
                align: TOP_MID
                y: 34
                width: 660
                text: ""
                text_font: f_text
                text_color: $col_ink
                long_mode: WRAP
                text_align: CENTER
            - label:
                id: lbl_assist_response
                align: TOP_MID
                y: 66
                width: 660
                text: ""
                text_font: f_text
                text_color: $col_ink2
                long_mode: WRAP
                text_align: CENTER

  pages:
    # =====================================================================
    # Seite 1: Uebersicht
    # =====================================================================
    - id: page_overview
      bg_color: $col_bg
      widgets:
        # ---------------- rechte Kennzahlenspalte ----------------------
        # Tagesverlauf.
        # ESPHomes LVGL kennt kein chart-Widget -- die Stundenbalken sind
        # daher einzelne bar-Widgets. Vorteil: jeder Balken ist per ID
        # ansprechbar und laesst sich einzeln einfaerben (z.B. Netzbezug rot).
        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            x: 916
            y: 84
            width: 344
            height: 136
            widgets:
              - label:
                  styles: st_label
                  width: 322
                  long_mode: WRAP
                  text: "TAGESVERLAUF · ERZEUGUNG"
              - bar: { id: bar_h00, x:   0, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value:  4, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h01, x:  20, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value:  7, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h02, x:  40, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 13, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h03, x:  60, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 26, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h04, x:  80, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 43, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h05, x: 100, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 60, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h06, x: 120, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 76, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h07, x: 140, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 89, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h08, x: 160, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 97, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h09, x: 180, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 100, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h10, x: 200, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 94, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h11, x: 220, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 80, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h12, x: 240, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 62, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h13, x: 260, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 43, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h14, x: 280, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 26, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - bar: { id: bar_h15, x: 300, y: 22, width: 15, height: 78, min_value: 0, max_value: 100, value: 11, bg_color: $col_surface, radius: 3, indicator: { bg_color: $col_solar, radius: 3 } }
              - label:
                  id: lbl_day_sub
                  x: 0
                  y: 104
                  styles: st_sub
                  text: "06 – 22 Uhr"

        # Prognose gegen Ist.
        # Zwei line-Widgets: die Erwartung in gedaempfter Farbe, der
        # tatsaechliche Verlauf darueber. Die Punktlisten werden spaeter
        # aus den Sensordaten nachgezogen.
        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            x: 916
            y: 228
            width: 344
            height: 136
            widgets:
              - label:
                  styles: st_label
                  width: 322
                  long_mode: WRAP
                  text: "PROGNOSE GEGEN IST"
              - line:
                  id: line_forecast
                  x: 0
                  y: 24
                  line_color: $col_ink3
                  line_width: 2
                  line_rounded: true
                  points:
                    - [0, 76]
                    - [40, 60]
                    - [80, 26]
                    - [120, 6]
                    - [160, 9]
                    - [200, 35]
                    - [240, 65]
                    - [280, 78]
                    - [316, 80]
              - line:
                  id: line_actual
                  x: 0
                  y: 24
                  line_color: $col_solar
                  line_width: 3
                  line_rounded: true
                  points:
                    - [0, 77]
                    - [40, 62]
                    - [80, 29]
                    - [120, 8]
                    - [160, 12]
                    - [200, 39]
              - label:
                  id: lbl_forecast_sub
                  x: 0
                  y: 104
                  styles: st_sub
                  text: "-- von -- kWh"

        # Energiebilanz: erzeugt / verbraucht / eingespeist / bezogen
        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            id: tile_gen
            x: 916
            y: 372
            width: 168
            height: 68
            border_side: [LEFT]
            border_width: 3
            border_color: $col_solar
            widgets:
              - label:
                  styles: st_label
                  width: 146
                  long_mode: WRAP
                  text: "ERZEUGT"
              - label:
                  id: val_gen
                  x: 0
                  y: 16
                  text: "--,-"
                  text_font: f_val_l
                  text_color: $col_ink
              - label:
                  id: sub_gen
                  x: 0
                  y: 42
                  width: 146
                  long_mode: WRAP
                  styles: st_sub
                  text: "kWh heute"

        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            id: tile_use
            x: 1092
            y: 372
            width: 168
            height: 68
            border_side: [LEFT]
            border_width: 3
            border_color: $col_ink2
            widgets:
              - label:
                  styles: st_label
                  width: 146
                  long_mode: WRAP
                  text: "VERBRAUCHT"
              - label:
                  id: val_use
                  x: 0
                  y: 16
                  text: "--,-"
                  text_font: f_val_l
                  text_color: $col_ink
              - label:
                  id: sub_use
                  x: 0
                  y: 42
                  width: 146
                  long_mode: WRAP
                  styles: st_sub
                  text: "kWh heute"

        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            id: tile_feed
            x: 916
            y: 448
            width: 168
            height: 68
            border_side: [LEFT]
            border_width: 3
            border_color: $col_feed
            widgets:
              - label:
                  styles: st_label
                  width: 146
                  long_mode: WRAP
                  text: "EINGESPEIST"
              - label:
                  id: val_feed
                  x: 0
                  y: 16
                  text: "--,-"
                  text_font: f_val_l
                  text_color: $col_ink
              - label:
                  id: sub_feed
                  x: 0
                  y: 42
                  width: 146
                  long_mode: WRAP
                  styles: st_sub
                  text: "kWh heute"

        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            id: tile_draw
            x: 1092
            y: 448
            width: 168
            height: 68
            border_side: [LEFT]
            border_width: 3
            border_color: $col_draw
            widgets:
              - label:
                  styles: st_label
                  width: 146
                  long_mode: WRAP
                  text: "NETZBEZUG"
              - label:
                  id: val_draw
                  x: 0
                  y: 16
                  text: "--,-"
                  text_font: f_val_l
                  text_color: $col_ink
              - label:
                  id: sub_draw
                  x: 0
                  y: 42
                  width: 146
                  long_mode: WRAP
                  styles: st_sub
                  text: "kWh heute"

        # Tagesertrag mit Aufschluesselung
        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            x: 916
            y: 524
            width: 344
            height: 84
            bg_color: $col_batt
            bg_opa: 6%
            border_side: [LEFT]
            border_width: 3
            border_color: $col_batt
            widgets:
              - label:
                  styles: st_label
                  width: 322
                  long_mode: WRAP
                  text: "TAGESERTRAG"
              - label:
                  id: val_money
                  x: 0
                  y: 18
                  text: "--,--"
                  text_font: f_val_xl
                  text_color: $col_batt
              - label:
                  id: unit_money
                  x: 78
                  y: 26
                  styles: st_unit
                  text: "€"
              - label:
                  id: money_split
                  x: 140
                  y: 18
                  styles: st_sub
                  text: "Förderung   +--,--\nGespart     +--,--\nBezug       ---,--"

        # Autarkie und Eigenverbrauch
        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            x: 916
            y: 616
            width: 168
            height: 96
            widgets:
              - arc:
                  id: arc_autarky
                  x: 0
                  y: 16
                  width: 58
                  height: 58
                  min_value: 0
                  max_value: 100
                  value: 0
                  arc_width: 7
                  arc_color: $col_line
                  indicator:
                    arc_color: $col_feed
                    arc_width: 7
                  knob:
                    bg_opa: TRANSP
              - label:
                  id: val_autarky
                  x: 18
                  y: 38
                  text: "--"
                  text_font: f_val_s
                  text_color: $col_ink
              - label:
                  styles: st_label
                  x: 64
                  y: 30
                  text: "AUTARKIE"
              - label:
                  id: sub_autarky
                  x: 64
                  y: 46
                  width: 84
                  long_mode: WRAP
                  styles: st_sub
                  text: "Monat -- %"

        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            x: 1092
            y: 616
            width: 168
            height: 96
            widgets:
              - arc:
                  id: arc_selfuse
                  x: 0
                  y: 16
                  width: 58
                  height: 58
                  min_value: 0
                  max_value: 100
                  value: 0
                  arc_width: 7
                  arc_color: $col_line
                  indicator:
                    arc_color: $col_solar
                    arc_width: 7
                  knob:
                    bg_opa: TRANSP
              - label:
                  id: val_selfuse
                  x: 18
                  y: 38
                  text: "--"
                  text_font: f_val_s
                  text_color: $col_ink
              - label:
                  styles: st_label
                  x: 62
                  y: 20
                  width: 92
                  long_mode: WRAP
                  text: "EIGEN-\nVERBRAUCH"
              - label:
                  id: sub_selfuse
                  x: 62
                  y: 58
                  width: 92
                  long_mode: WRAP
                  styles: st_sub
                  text: "ohne Sungrow"

        # ================= Anlagenschema =================================
        # Flaeche 900 x 668. Kastenhoehen = Summe der Zeilenhoehen PLUS
        # LVGLs Flex-Zeilenabstand (rund 8 px je Zwischenraum) -- den kennt
        # ESPHome weder als Widget- noch als Style-Eigenschaft, er laesst
        # sich also nicht abschalten und muss eingerechnet werden.
        # Einheit und Tageswert teilen sich eine Zeile; das spart je Kasten
        # eine Zeile und damit rund 24 px.
        - obj:
            id: schema_area
            scrollbar_mode: 'off'
            x: 0
            y: 76
            width: 900
            height: 668
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            widgets:
              # Rahmen der Volleinspeisung zuerst, damit er hinter allem liegt
              - obj: { scrollbar_mode: 'off', x: 6, y: 2, width: 198, height: 238, bg_opa: TRANSP,
                       border_color: $col_full, border_width: 1, border_opa: 45%, radius: 12, pad_all: 0 }
              - label: { x: 20, y: 8, text: "VOLLEINSPEISUNG · BIS 2031", text_color: $col_full, text_font: f_unit }

              # ---------- Leitungen --------------------------------------
              - line: { points: [[56,128],[56,140],[104,140],[104,152]], line_color: $col_full, line_width: 3, line_rounded: true }
              - line: { points: [[152,128],[152,140],[104,140]], line_color: $col_full, line_width: 3, line_rounded: true }
              - line: { points: [[258,128],[258,140],[306,140],[306,152]], line_color: $col_solar, line_width: 3, line_rounded: true }
              - line: { points: [[354,128],[354,140],[306,140]], line_color: $col_solar, line_width: 3, line_rounded: true }
              - line: { points: [[460,128],[460,140],[508,140],[508,152]], line_color: $col_solar, line_width: 3, line_rounded: true }
              - line: { points: [[556,128],[556,140],[508,140]], line_color: $col_solar, line_width: 3, line_rounded: true }
              - line: { points: [[662,128],[662,140],[710,140],[710,152]], line_color: $col_solar, line_width: 3, line_rounded: true }
              - line: { points: [[758,128],[758,140],[710,140]], line_color: $col_solar, line_width: 3, line_rounded: true }
              - line: { points: [[352,192],[454,192]], line_color: $col_solar, line_width: 3, line_rounded: true }
              - line: { points: [[656,192],[562,192]], line_color: $col_solar, line_width: 3, line_rounded: true }
              - line: { points: [[486,232],[486,252],[300,252],[300,268]], line_color: $col_solar, line_width: 3, line_rounded: true }
              - line: { points: [[530,232],[530,276],[610,276],[610,296]], line_color: $col_batt, line_width: 3, line_rounded: true }
              - line: { points: [[710,232],[710,276],[610,276]], line_color: $col_batt, line_width: 3, line_rounded: true }
