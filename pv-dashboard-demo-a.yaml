##############################################################################
# Demo: Kettenreaktion auf dem echten Schema
#
#   esphome run pv-dashboard-demo-a.yaml
#
# TOPOLOGIE aus den Koordinaten -- fuenf Punkte, die der erste Anlauf falsch
# hatte und die jeweils erst im Bild auffielen:
#
#  1. KREUZUNGEN SIND KNOTEN. Die Zuleitung zu den Batterien laeuft optisch
#     durch die Sammelschiene, sie endet dort nicht.
#  2. SCHNITTPUNKTE SORTIERT EINFUEGEN. Sie kamen aus einem Set, also
#     unsortiert -- die Verbraucherschiene zerfiel dadurch in vier einander
#     ueberlappende Stuecke (144-392, 392-268, 330-268, 330-516) statt in
#     vier saubere. Jetzt: 144-268, 268-330, 330-392, 392-516, 0 Ueberlappungen.
#  3. GETEILTE STUECKE ERBEN DIE ZEICHENRICHTUNG und mussten umgedreht werden,
#     sonst laufen auf einer Schiene Kugeln gegeneinander.
#  4. QUERSTRECKEN AN VERZWEIGUNGEN SCHWEIGEN -- auch die, die selbst nur
#     einen Nachfolger haben, aber von einem Verzweigungsknoten ausgehen.
#  5. ANKUNFT LOEST AUS UND STARTET NEU. Kommt eine Kugel am Knoten an,
#     passiert beides gleichzeitig: der Abgang bekommt seine Kugel, und die
#     Zuleitung faengt sofort wieder von vorn an. Es entsteht also keine
#     Luecke, in der die Zuleitung leer steht und auf etwas wartet.
#     Jede Strecke behaelt dabei ihre eigene, aus ihrer Leistung
#     abgeleitete Geschwindigkeit -- der Abgang laeuft langsamer als seine
#     Zuleitung, wenn er weniger fuehrt.
#     Endlos von sich aus laufen nur die 22 speisenden Strecken (Daecher,
#     Netz) und die Abgaenge hinter den stillen Verteilstrecken.
#
# 37 Teilstrecken, 20 Uebergaenge, 28 Wurzeln, 6 stille Verteilstrecken,
# 5 Strecken mit zweiter Kugel (dort treffen zwei Zuleitungen zusammen).
#
# GESCHWINDIGKEIT: T = Kennlinie(W) x (Laenge/494)^0,25
#   50..500 W  T = 16 / (W/50)^0,30103     ab 500 W  T = 8 / (W/500)^0,48945
##############################################################################

