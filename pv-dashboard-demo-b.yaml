##############################################################################
# Demo: die beiden Kennlinien im direkten Vergleich
#
#   esphome run pv-dashboard-demo-b.yaml
#
# LINKS (gold) zwei Potenzabschnitte mit Knick bei 500 W:
#                50..500 W   T = 16 / (W/50)^0,30103   -> 500 W ergibt 8,00 s
#                ab 500 W    T =  8 / (W/500)^0,48945  -> 35 kW ergibt 1,00 s
#              Beide Abschnitte treffen sich bei 500 W auf denselben Wert; es
#              knickt nur die Steigung, der Wert springt nicht. Deshalb ist der
#              Uebergang nicht zu sehen. Ueber 35 kW wird bei 1 s geklemmt --
#              genau wie die lineare Kennlinie rechts, nur eben erst dort.
#
# RECHTS (blau) linear, wie sunsynk-power-flow-card:
#              dur = animation_speed - (animation_speed - 1) * (W / max_power)
#              mit animation_speed 9 s, max_power 8000 W, geklemmt bei 1 s.
#              Belegt in src/index.ts:1952-1958, gegengeprueft im Bundle v7.3.3.
#
# Jede Leistungsstufe laeuft auf drei Laengen (90/200/340 px). Die Umlaufzeit
# folgt in erster Linie der Leistung, wird aber mit (L/340)^0,25 an die Laenge
# angepasst: Kurze Strecken laufen etwas schneller um, weil die Kugel dort
# sonst traege wirkt -- sie legt ja kaum Weg zurueck. Die laengste Strecke
# bleibt unveraendert. Faktoren: 90 px -> 0,72, 200 px -> 0,88, 340 px -> 1,00.
#
# Die beiden oberen Stufen zeigen, warum linear hier nicht taugt: ab 8.000 W
# klemmt sie bei 1 s, 15.000 und 35.000 W sind dort nicht mehr zu
# unterscheiden. Links bleiben 2,69 und 2,39 s -- ein sichtbarer Abstand.
##############################################################################

