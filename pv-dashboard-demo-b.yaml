              - line: { points: [[512,648],[852,648]], line_color: $col_line, line_width: 2 }
              - obj: { id: d114, styles: st_dot, x: 507, y: 643, bg_color: $col_batt, scrollable: false }
              - label: { id: t114, x: 860, y: 639, text: "", text_color: $col_ink3, text_font: f_small }

interval:
  - interval: 40ms
    then:
      - lambda: |-
          static const int32_t W[]   = {50,50,50,500,500,500,5000,5000,5000,15000,15000,15000,35000,35000,35000};
          static const int16_t LEN[] = {90,200,340,90,200,340,90,200,340,90,200,340,90,200,340};
          static const int16_t X0[]  = {96,512};
          static float pos[2][15] = {{0}};
          static bool beschriftet = false;
          lv_obj_t *const dots0[15] = {
            reinterpret_cast<lv_obj_t *>(id(d000)), reinterpret_cast<lv_obj_t *>(id(d001)), reinterpret_cast<lv_obj_t *>(id(d002)), reinterpret_cast<lv_obj_t *>(id(d003)), reinterpret_cast<lv_obj_t *>(id(d004)), reinterpret_cast<lv_obj_t *>(id(d005)),
            reinterpret_cast<lv_obj_t *>(id(d006)), reinterpret_cast<lv_obj_t *>(id(d007)), reinterpret_cast<lv_obj_t *>(id(d008)), reinterpret_cast<lv_obj_t *>(id(d009)), reinterpret_cast<lv_obj_t *>(id(d010)), reinterpret_cast<lv_obj_t *>(id(d011)),
            reinterpret_cast<lv_obj_t *>(id(d012)), reinterpret_cast<lv_obj_t *>(id(d013)), reinterpret_cast<lv_obj_t *>(id(d014)) };
          lv_obj_t *const dots1[15] = {
            reinterpret_cast<lv_obj_t *>(id(d100)), reinterpret_cast<lv_obj_t *>(id(d101)), reinterpret_cast<lv_obj_t *>(id(d102)), reinterpret_cast<lv_obj_t *>(id(d103)), reinterpret_cast<lv_obj_t *>(id(d104)), reinterpret_cast<lv_obj_t *>(id(d105)),
            reinterpret_cast<lv_obj_t *>(id(d106)), reinterpret_cast<lv_obj_t *>(id(d107)), reinterpret_cast<lv_obj_t *>(id(d108)), reinterpret_cast<lv_obj_t *>(id(d109)), reinterpret_cast<lv_obj_t *>(id(d110)), reinterpret_cast<lv_obj_t *>(id(d111)),
            reinterpret_cast<lv_obj_t *>(id(d112)), reinterpret_cast<lv_obj_t *>(id(d113)), reinterpret_cast<lv_obj_t *>(id(d114)) };
          lv_obj_t *const txt0[15] = {
            reinterpret_cast<lv_obj_t *>(id(t000)), reinterpret_cast<lv_obj_t *>(id(t001)), reinterpret_cast<lv_obj_t *>(id(t002)), reinterpret_cast<lv_obj_t *>(id(t003)), reinterpret_cast<lv_obj_t *>(id(t004)), reinterpret_cast<lv_obj_t *>(id(t005)),
            reinterpret_cast<lv_obj_t *>(id(t006)), reinterpret_cast<lv_obj_t *>(id(t007)), reinterpret_cast<lv_obj_t *>(id(t008)), reinterpret_cast<lv_obj_t *>(id(t009)), reinterpret_cast<lv_obj_t *>(id(t010)), reinterpret_cast<lv_obj_t *>(id(t011)),
            reinterpret_cast<lv_obj_t *>(id(t012)), reinterpret_cast<lv_obj_t *>(id(t013)), reinterpret_cast<lv_obj_t *>(id(t014)) };
          lv_obj_t *const txt1[15] = {
            reinterpret_cast<lv_obj_t *>(id(t100)), reinterpret_cast<lv_obj_t *>(id(t101)), reinterpret_cast<lv_obj_t *>(id(t102)), reinterpret_cast<lv_obj_t *>(id(t103)), reinterpret_cast<lv_obj_t *>(id(t104)), reinterpret_cast<lv_obj_t *>(id(t105)),
            reinterpret_cast<lv_obj_t *>(id(t106)), reinterpret_cast<lv_obj_t *>(id(t107)), reinterpret_cast<lv_obj_t *>(id(t108)), reinterpret_cast<lv_obj_t *>(id(t109)), reinterpret_cast<lv_obj_t *>(id(t110)), reinterpret_cast<lv_obj_t *>(id(t111)),
            reinterpret_cast<lv_obj_t *>(id(t112)), reinterpret_cast<lv_obj_t *>(id(t113)), reinterpret_cast<lv_obj_t *>(id(t114)) };

          for (int i = 0; i < 15; i++) {
            float w = W[i], l = LEN[i];
            // links: logarithmisch, Steilheit 2 -> hundertfacher Wert 5x schneller
            // Zwei Abschnitte, die sich bei 500 W auf 8,00 s treffen:
            //   50..500 W    T = 16 / (W/50)^0,30103    Verzehnfachung halbiert
            //   ab 500 W     T =  8 / (W/500)^0,48945   steiler, damit 35 kW bei 1 s landen
            // Der Uebergang ist stetig -- es knickt nur die Steigung, der Wert
            // springt nicht. Genau deshalb faellt der Knick nicht auf.
            float t_log;
            if (w <= 500.0f)
              t_log = 16.0f / powf(fmaxf(w, 50.0f) / 50.0f, 0.30103f);
            else
              t_log = 8.0f / powf(w / 500.0f, 0.48945f);
            if (t_log < 1.0f) t_log = 1.0f;
            // rechts: linear nach sunsynk, geklemmt
            float t_lin = 9.0f - 8.0f * (w / 8000.0f);
            if (t_lin < 1.0f) t_lin = 1.0f;

            // Laengenkorrektur: kurze Strecken laufen etwas schneller um.
            // Bei gleicher Umlaufzeit wirkt eine kurze Linie traege, weil die
            // Kugel kaum Weg macht. Der Exponent 0,25 staucht das -- die
            // laengste Strecke bleibt unveraendert bei Faktor 1,0.
            float f = powf(l / 340.0f, 0.25f);
            float dur[2] = {t_log * f, t_lin * f};
            for (int s = 0; s < 2; s++) {
              pos[s][i] += l / dur[s] * 40 / 1000.0f;
              while (pos[s][i] >= l) pos[s][i] -= l;
              lv_obj_set_x(s ? dots1[i] : dots0[i], X0[s] + (int) pos[s][i] - 5);
            }
            if (!beschriftet) {
              char b[24];
              snprintf(b, sizeof(b), "%.1f s", t_log * powf(l / 340.0f, 0.25f));
              lv_label_set_text(txt0[i], b);
              snprintf(b, sizeof(b), "%.1f s", t_lin * powf(l / 340.0f, 0.25f));
              lv_label_set_text(txt1[i], b);
            }
          }
          beschriftet = true;
