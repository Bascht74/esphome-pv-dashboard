##############################################################################
# Package: Seite 9 -- Netz und Zaehler
#
# Auf Wunsch des Nutzers (25.09.2026) nach dem Projekt-Review: was am
# Netzanschluss passiert, die drei Phasen, die Zaehlerstaende und die
# Netzvorgaben fuer eine Anlage mit Inbetriebnahme 2026.
#
#   Netzanschluss  Leistung am Hausanschluss (Bezug rot, Einspeisung gruen),
#                  Frequenz, Einspeisung gegen die Einspeisegrenze
#                  (Solarspitzengesetz, § 9 Abs. 2 EEG 2023: 60 % der
#                  installierten Leistung, bis Smart Meter und Steuerbox
#                  eingebaut und getestet sind), abgeregelte Energie heute
#   Phasen         L1..L3 wie der Shelly Pro 3EM sie liefert (EM.GetStatus:
#                  x_voltage, x_current, x_act_power, x_aprt_power, x_pf),
#                  dazu der Strom im Neutralleiter (n_current)
#   Zaehlerstaende fuenf Zaehlwerke mit Stand und Tageswert
#   Netzvorgaben   Status der Grenze, Boersenstrompreis, negative
#                  Viertelstunden (§ 51 EEG), Steuersignal § 14a EnWG
#
# Rechtliches ist recherchiert (docs/06), nicht am Anschluss geprueft; was
# fuer die eigene Anlage gilt, sagt der Netzbetreiber.
#
# Vier Skripte gehoeren dazu; kuenftige Sensoren rufen nur diese auf, bis
# dahin stehen Striche:
#   grid_update  Netzanschluss      grid_phase  eine Phase
#   grid_meter   ein Zaehlwerk      grid_rules  Netzvorgaben
#
# Flaeche x 4..1276, y 84..736. Vier Kacheln je 632 breit (x 4 und 644),
# oben y 84 / 300 hoch, unten y 392 / 344 hoch.
#   Netzanschluss innen 610 x 278: Titel 0..17, Wert 36..75 (f_val_xl),
#       Einheit 77..94, Frequenz rechts gleich hoch, Linie 118, Grenze
#       Titel 134..151, Balken 162..186, drei Spalten 196..243, abgeregelt
#       250..267 -> Reserve 11
#   Phasen innen 610 x 278: Titel 0..17, Kopf 32..49, Linie 54, fuenf
#       Zeilen im Raster 44 ab 58 (Wert f_val_m 25 bei +10); die letzte
#       beginnt 234, Wert 244..269 -> Reserve 9
#   Zaehler innen 610 x 322: Titel 0..17, Kopf 32..49, fuenf Zeilen im
#       Raster 50 ab 56 (Wert +13..+38) -> letzte endet 294
#   Vorgaben innen 610 x 322: Titel 0..17, sechs Zeilen im Raster 48 ab
#       30 (Text f_text 22 bei +13) -> letzte endet 283
##############################################################################

##############################################################################
# Anlagenwerte (Demo). Eigene Werte gehoeren in .pv-dashboard_anlage.yaml.
#   pv_kwp          installierte Modulleistung in kWp, auf die sich die
#                   Einspeisegrenze bezieht; beide Kreise zusammen, wenn
#                   sie am selben Hausanschluss haengen und innerhalb von
#                   zwoelf Monaten in Betrieb gehen (§ 9 Abs. 3 EEG)
#   feed_limit_pct  Einspeisegrenze in % (60 nach Solarspitzengesetz)
##############################################################################

substitutions:
  pv_kwp: "30.0"
  feed_limit_pct: "60"

script:
  # ---------------------------------------------------------------------
  # Netzanschluss:
  #   power      Leistung am Hausanschluss in W, positiv = Bezug,
  #              negativ = Einspeisung (Vorzeichen wie total_act_power
  #              des Shelly Pro 3EM)
  #   freq       Netzfrequenz in Hz
  #   curtailed  heute abgeregelte Energie in kWh (vom Wechselrichter)
  #   n_current  Strom im Neutralleiter in A
  #   NAN = kein Wert (Striche)
  # ---------------------------------------------------------------------
  - id: grid_update
    parameters:
      power: float
      freq: float
      curtailed: float
      n_current: float
    then:
      - lambda: |-
          auto &num = id(fmt_num);  // Formate: .pv-dashboard_ui.yaml
          id(data_seen)[5] = millis();
          const bool feed = std::isfinite(power) && power < 0.0f;   // val_leer (-inf) ist keine Einspeisung
          lv_label_set_text(id(gr_power), num(fabsf(power) / 1000.0f, "%.2f", "-,--").c_str());
          lv_label_set_text(id(gr_dir), !std::isfinite(power) ? "kW" : (feed ? "kW · Einspeisung" : "kW · Bezug"));
          lv_obj_set_style_text_color(id(gr_power), !std::isfinite(power) ? lv_color_hex($col_ink) : (feed ? lv_color_hex($col_feed) : lv_color_hex($col_draw)), 0);
          lv_label_set_text(id(gr_freq), num(freq, "%.2f", "--,--").c_str());
          lv_label_set_text(id(gr_n), ("N-Leiter " + num(n_current, "%.1f", "--,-") + " A").c_str());
          // Einspeisung gegen die Grenze; Balken = 0..100 % der kWp,
          // die Marke steht bei feed_limit_pct
          const float kwp = ${pv_kwp};
          const float limit_w = kwp * 1000.0f * ${feed_limit_pct} / 100.0f;
          const float fw = feed ? -power : 0.0f;
          // leer (val_leer, -inf) statt Striche, wenn die Entitaet fehlt
          const char *ohne = std::isinf(power) ? "" : "--";
          lv_label_set_text(id(gr_feed), !std::isfinite(power) ? ohne : id(fmt_power)(fw).c_str());
          lv_label_set_text(id(gr_limit), id(fmt_power)(limit_w).c_str());
          if (!std::isfinite(power) || limit_w <= 0.0f) {
            lv_label_set_text(id(gr_util), std::isinf(power) ? "" : "-- %");
          } else {
            lv_label_set_text_fmt(id(gr_util), "%d %%", (int) lroundf(fw / limit_w * 100.0f));
          }
          lv_obj_set_x(id(gr_mark), (int) (610.0f * ${feed_limit_pct} / 100.0f) - 1);
          const int bw = (kwp > 0.0f) ? (int) lroundf(std::min(fw / (kwp * 1000.0f), 1.0f) * 610.0f) : 0;
          lv_obj_set_width(id(gr_bar), std::max(bw, 0));
          if (bw <= 0)
            lv_obj_add_flag(id(gr_bar), LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_clear_flag(id(gr_bar), LV_OBJ_FLAG_HIDDEN);
          // An der Grenze (ab 98 %) gelb: dann regelt der Wechselrichter ab
          const bool at_limit = limit_w > 0.0f && fw >= 0.98f * limit_w;
          lv_obj_set_style_bg_color(id(gr_bar), at_limit ? lv_color_hex($col_warn) : lv_color_hex($col_feed), 0);
          lv_label_set_text(id(gr_curtail), ("abgeregelt heute " + num(curtailed, "%.1f", "--,-") + " kWh").c_str());

  # ---------------------------------------------------------------------
  # Eine Phase, Werte wie EM.GetStatus des Shelly Pro 3EM:
  #   phase    0..2 = L1..L3
  #   voltage  Spannung in V      current  Strom in A
  #   power    Wirkleistung in W (positiv = Bezug)
  #   apparent Scheinleistung in VA
  #   pf       Leistungsfaktor
  # ---------------------------------------------------------------------
  - id: grid_phase
    parameters:
      phase: int
      voltage: float
      current: float
      power: float
      apparent: float
      pf: float
    then:
      - lambda: |-
          if (phase < 0 || phase > 2)
            return;
          auto &num = id(fmt_num);
          lv_obj_t *const u[3] = {id(gr_u1), id(gr_u2), id(gr_u3)};
          lv_obj_t *const i[3] = {id(gr_i1), id(gr_i2), id(gr_i3)};
          lv_obj_t *const p[3] = {id(gr_p1), id(gr_p2), id(gr_p3)};
          lv_obj_t *const s[3] = {id(gr_s1), id(gr_s2), id(gr_s3)};
          lv_obj_t *const f[3] = {id(gr_pf1), id(gr_pf2), id(gr_pf3)};
          lv_label_set_text(u[phase], num(voltage, "%.1f", "---,-").c_str());
          lv_label_set_text(i[phase], num(current, "%.1f", "--,-").c_str());
          lv_label_set_text(p[phase], id(fmt_watt)(power, "--.---").c_str());
          lv_label_set_text(s[phase], id(fmt_watt)(apparent, "--.---").c_str());
          lv_label_set_text(f[phase], num(pf, "%.2f", "-,--").c_str());
          // Spannung ausserhalb 230 V +- 10 % (EN 50160) gelb
          const bool bad = std::isfinite(voltage) && (voltage < 207.0f || voltage > 253.0f);
          lv_obj_set_style_text_color(u[phase], bad ? lv_color_hex($col_warn) : lv_color_hex($col_ink), 0);

  # ---------------------------------------------------------------------
  # Ein Zaehlwerk:
  #   meter  0 = Hausanschluss Bezug, 1 = Hausanschluss Einspeisung,
  #          2 = PV-Zaehler Einspeisung (Volleinspeisung),
  #          3 = Hauszaehler Bezug, 4 = Hauszaehler Einspeisung
  #   total  Zaehlerstand in kWh      today  Tageswert in kWh
  # ---------------------------------------------------------------------
  - id: grid_meter
    parameters:
      meter: int
      total: float
      today: float
    then:
      - lambda: |-
          if (meter < 0 || meter > 4)
            return;
          lv_obj_t *const t[5] = {id(gm_total_1), id(gm_total_2), id(gm_total_3), id(gm_total_4), id(gm_total_5)};
          lv_obj_t *const d[5] = {id(gm_today_1), id(gm_today_2), id(gm_today_3), id(gm_today_4), id(gm_today_5)};
          // Zaehlerstand ganzzahlig mit Tausenderpunkt wie am Zaehler
          lv_label_set_text(t[meter], id(fmt_watt)(total, "--.---").c_str());
          lv_label_set_text(d[meter], id(fmt_num)(today, "%.1f", "--,-").c_str());

  # ---------------------------------------------------------------------
  # Netzvorgaben:
  #   limit_active  true = Einspeisegrenze gilt (noch kein Smart Meter mit
  #                 Steuerbox und bestandenem Test)
  #   spot_ct       Boersenstrompreis in ct/kWh (Day-Ahead), NAN = keiner
  #   neg_quarters  Viertelstunden mit negativem Preis heute, < 0 = keine
  #                 Angabe
  #   neg_paid      true = auch bei negativem Preis verguetet (§ 51 Abs. 2
  #                 EEG: bis zum Ende des Jahres, in dem das Smart Meter
  #                 kommt)
  #   p14a_active   true = Steuersignal nach § 14a EnWG liegt an
  #   p14a_kw       vorgegebene Grenze in kW waehrend des Signals
  #   smart_meter   true = Smart Meter und Steuerbox eingebaut
  # ---------------------------------------------------------------------
  - id: grid_rules
    parameters:
      limit_active: bool
      spot_ct: float
      neg_quarters: int
      neg_paid: bool
      p14a_active: bool
      p14a_kw: float
      smart_meter: bool
    then:
      - lambda: |-
          auto &num = id(fmt_num);
          lv_label_set_text(id(gr_limit_state), limit_active ? "${feed_limit_pct} % aktiv" : "aufgehoben");
          lv_label_set_text(id(gr_rule_0), limit_active ? "${feed_limit_pct} % aktiv" : "aufgehoben");
          lv_label_set_text(id(gr_rule_1), (num(spot_ct, "%.2f", "--,--") + " ct/kWh").c_str());
          lv_obj_set_style_text_color(id(gr_rule_1), (std::isfinite(spot_ct) && spot_ct < 0.0f) ? lv_color_hex($col_crit) : lv_color_hex($col_ink), 0);
          if (neg_quarters < 0)
            lv_label_set_text(id(gr_rule_2), "--");
          else
            lv_label_set_text_fmt(id(gr_rule_2), "%d", neg_quarters);
          lv_label_set_text(id(gr_rule_3), neg_paid ? "ja, ohne Smart Meter" : "nein");
          if (p14a_active)
            lv_label_set_text(id(gr_rule_4), ("aktiv · " + num(p14a_kw, "%.1f", "-,-") + " kW").c_str());
          else
            lv_label_set_text(id(gr_rule_4), "inaktiv");
          lv_obj_set_style_text_color(id(gr_rule_4), p14a_active ? lv_color_hex($col_warn) : lv_color_hex($col_ink), 0);
          lv_label_set_text(id(gr_rule_5), smart_meter ? "eingebaut" : "nicht eingebaut");

