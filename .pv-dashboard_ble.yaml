##############################################################################
# Package: Bluetooth LE
#
# Der ESP32-P4 hat selbst kein Funkmodul. BLE laeuft ueber denselben
# ESP32-C6-Co-Prozessor wie WLAN: ESPHome erkennt die esp32_hosted-Komponente
# und schaltet den HCI-Controller ueber die SDIO-Verbindung frei
# (CONFIG_ESP_HOSTED_ENABLE_BT_BLUEDROID / ..._BLUEDROID_HCI_VHCI).
# Der C6 kann Bluetooth 5 / BLE inklusive Coded PHY.
#
# WLAN und BLE teilen sich die Antenne des C6 -- unter Dauerscan kann der
# Durchsatz beider Seiten leicht sinken. Falls WLAN instabil wird, zuerst
# "active: false" beim Scan probieren.
##############################################################################

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

# Macht das Panel zum Bluetooth-Proxy fuer Home Assistant: BLE-Geraete in
# Reichweite (Thermometer, Tracker, ...) werden an HA weitergereicht.
bluetooth_proxy:
  active: true
