##############################################################################
# Package: Geraetegrundlagen
#
# Alles, was aus dem Panel ein Geraet macht und nichts mit der Oberflaeche zu
# tun hat: Chip, Speicher und Stromversorgung, die Funkstrecke zum C6, WLAN,
# API, Logger und OTA -- dazu Bluetooth, Zeit und Diagnose sowie die
# seriellen Schnittstellen.
#
# Nur das echte Geraet bindet dieses Paket ein. Simulator
# (pv-dashboard-sim.yaml) und Screenshots (pv-dashboard-shots.yaml) laufen
# ohne Hardware und ohne Funk.
#
# Zugangsdaten stehen hier ABSICHTLICH nicht. pv-dashboard.yaml legt sie oben
# als substitutions an und holt sie dort mit !secret aus der secrets.yaml;
# hier steht nur ${wifi_ssid}, ${wifi_password}, ${ap_password}, ${api_key}
# und ${ota_password}. Damit bleibt diese Datei frei von Geheimnissen -- sie
# soll spaeter aus dem GitHub-Repo nachgeladen werden, waehrend
# pv-dashboard.yaml und secrets.yaml auf dem Rechner bleiben.
#
# ESPHome loest substitutions erst nach dem Zusammenfuehren aller Pakete auf,
# deshalb wirken die Werte aus pv-dashboard.yaml auch hier drin.
##############################################################################

esp32:
  # ACHTUNG: Dieses Board hat ECO2-Silizium, kein Serien-Silizium ab Rev. 3.00.
  # Das Boot-ROM meldet sich mit "ESP-ROM:esp32p4-eco2-20240710".
  # Mit board: esp32-p4_r3-evboard stuerzt bereits der Bootloader ab
  # ("Illegal instruction" direkt am entry-Punkt, Dauerneustart).
  board: esp32-p4-evboard
  variant: esp32p4
  # Pflicht fuer Silizium vor Rev. 3.00.
  engineering_sample: true
  flash_size: 32MB
  # ECO2-Engineering-Samples sind laut ESPHome (Code-Kommentar und Doku) auf
  # 360MHz begrenzt. 400MHz lehnt die Validierung nicht ab, sondern warnt nur
  # (esphome/esphome#13425) -- fuer dieses Board bleibt es trotzdem bei 360MHz.
  cpu_frequency: 360MHz
  # Native ESP-IDF-Toolchain (CMake + idf.py + Espressif-Compiler), kein
  # PlatformIO. Das ist inzwischen der Default; 'platformio' ist abgekuendigt
  # und faellt in ESPHome 2027.2.0 weg. Hier explizit gesetzt.
  toolchain: esp-idf
  framework:
    type: esp-idf
    # Neueste stabile 6.x. Ein 6.1.x gibt es noch nicht -- von 6.1 existiert
    # bisher nur v6.1-beta1. ESPHome-"recommended" ist weiterhin 5.5.5;
    # bei Build-Problemen ist das der schnellste Gegentest.
    version: 6.0.2
    advanced:
      # Pflicht fuer 32 MB Flash zusammen mit OTA. Die Warnung "Using
      # experimental features in ESP-IDF ..." bei der Code-Erzeugung ist
      # damit gewollt, wie die zur nicht empfohlenen Framework-Version.
      enable_idf_experimental_features: true

# 32 MB PSRAM im Package - ohne PSRAM kein MIPI-DSI-Framebuffer.
psram:
  mode: hex
  speed: 200MHz

# LDO-Kanal 3 versorgt die MIPI-DSI-PHY (VDD_MIPI_DPHY, 2.5 V).
# Pflicht-Abhaengigkeit der mipi_dsi-Komponente.
esp_ldo:
  - channel: 3
    voltage: 2.5V

# WLAN/BLE laufen nicht auf dem P4 selbst, sondern auf dem ESP32-C6 daneben.
# Die Verbindung ist ein 4-Bit-SDIO-Bus.
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  # SDIO-Puffer ins PSRAM statt in den knappen internen RAM.
  use_psram: true

# Die ESP-Hosted-Firmware des C6 kam ab Werk von Waveshare und ist zu alt:
# Beim ersten Boot meldete ESPHome
#   "Co-processor not responding; BLE disabled."
# Der C6 macht WLAN, antwortet aber nicht auf die Abfrage der Bluetooth-
# Firmwareversion.
#
# ESPHome pflegt dafuer ein eigenes Firmware-Verzeichnis. Der Baustein unten
# vergleicht die Version auf dem C6 mit dem Manifest und bietet passende
# Updates an -- als Update-Entity in Home Assistant, uebertragen ueber die
# bestehende SDIO-Strecke. Der C6 muss dafuer nicht ausgebaut werden.
#
# Es wird automatisch die hoechste Version gewaehlt, die zur einkompilierten
# esp_hosted-Bibliothek passt (seit ESPHome 2026.8.0: 2.12.12).
http_request:
  verify_ssl: false

update:
  - platform: esp32_hosted
    type: http
    name: "Co-Prozessor-Firmware"
    source: "https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json"
    update_interval: 6h
    # Neue C6-Firmware als Info in die Meldungsliste. x ist das UpdateInfo
    # (latest_version, current_version, ...). Ausgeloest wird nur beim
    # Wechsel auf "verfuegbar", nicht bei jeder Pruefung (seit 2026.8.1).
    on_update_available:
      - script.execute:
          id: alert_push
          severity: 0
          device: "Co-Prozessor"
          text: !lambda |-
            if (x.latest_version.empty())
              return std::string("Neue Firmware verfügbar");
            std::string s = "Firmware " + x.latest_version + " verfügbar";
            if (!x.current_version.empty())
              s += " (installiert: " + x.current_version + ")";
            return s;

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: "${upper_devicename} Fallback"
    password: ${ap_password}

captive_portal:

logger:
  # I2C-Scan-Ergebnisse (ESP_LOGCONFIG) erscheinen erst ab level: CONFIG
  # (oder DEBUG).
  level: INFO
  # P4: Log geht ueber den USB-UART-Port (Type-C, Beschriftung "UART").
  hardware_uart: UART0

api:
  reboot_timeout: 9999 min
  encryption:
    key: ${api_key}
  # Wakeword-Start/-Stopp steuert das Audio-Package ueber voice_assistant:
  # on_client_connected/-disconnected (Halbduplex, siehe dort). Hier nicht:
  # Die api-Trigger feuern auch fuer Log-Clients -- ein Start mitten in der
  # Musik belegt den I2S-Bus, ein voice_assistant.stop beim Trennen eines
  # Log-Clients bricht eine laufende Sprachsitzung ab.

# Zuletzt gezeichnete Zehnerstufe des OTA-Fortschritts (on_progress). on_begin
# setzt sie zurueck: Sonst fehlte bei einem zweiten Upload in derselben
# Laufzeit die erste Stufe, wenn sie der letzten des Fehlversuchs gleicht.
globals:
  - id: ota_last_step
    type: int
    restore_value: false
    initial_value: '-1'

ota:
  - platform: esphome
    # Umstieg auf Noise-Verschluesselung in zwei Schritten:
    #   1. Jetzt: 'password' bleibt. Den Upload prueft die Firmware, die
    #      gerade auf dem Geraet laeuft -- die alte kennt nur das Passwort
    #      und wuerde ein verschluesseltes Update abweisen.
    #   2. Erst NACH der ersten erfolgreichen OTA-Installation mit 2026.9:
    #      'password' durch 'encryption: {}' ersetzen (nutzt den API-Schluessel).
    # Beides zusammen geht nicht, die Optionen schliessen sich aus. Die
    # 9.0-Warnung zum Passwort (~3,5 KB Flash) ist fuer Schritt 1 in Kauf genommen.
    password: ${ota_password}
    # WICHTIG zum Verstaendnis der Blockstruktur unten:
    #
    # ESPHome laedt die Firmware in EINER blockierenden Schleife innerhalb
    # eines einzigen loop()-Durchlaufs (ota_esphome.cpp, "while (total <
    # ota_size)"). Der Watchdog wird darin gefuettert, App.loop() aber nicht
    # mehr aufgerufen -- und genau dort laeuft LVGL (lvgl_esphome.cpp ruft
    # lv_timer_handler() aus loop()).
    #
    # Folge: Waehrend des Uploads zeichnet LVGL nichts mehr. lvgl.widget.show
    # setzt zwar das Flag, aber das Bild aendert sich nie; das Panel wuerde
    # erst nach dem Upload erscheinen -- also nie, weil dann der Neustart
    # kommt. Deshalb steht hinter jeder Aenderung ein lv_refr_now(), das
    # sofort und synchron zeichnet. LVGL laeuft in derselben Schleife wie
    # OTA, ein Nebenlaeufigkeitsproblem gibt es dabei nicht.
    on_begin:
      - globals.set:
          id: ota_running
          value: 'true'
      - globals.set:
          id: ota_last_step
          value: '-1'
      - lvgl.bar.update:
          id: bar_ota
          value: 0
      # Nur die Zahl -- das "%" steht als eigenes Label darunter.
      - lvgl.label.update:
          id: lbl_ota_pct
          text: "0"
      - lvgl.widget.show: ota_panel
      - lambda: 'lv_refr_now(nullptr);'
    on_progress:
      # x ist der Fortschritt in Prozent (float).
      #
      # Nur in Zehnerschritten neu zeichnen: Jedes lv_refr_now() uebertraegt
      # den kompletten Framebuffer und konkurriert dabei mit dem Upload um
      # die PSRAM-Bandbreite. Zehn kurze
      # Aktualisierungen ueber den ganzen Upload sind der Kompromiss aus
      # Rueckmeldung und Ruhe.
      - if:
          condition:
            lambda: |-
              int step = ((int) x) / 10;
              if (step == id(ota_last_step))
                return false;
              id(ota_last_step) = step;
              return true;
          then:
            - lvgl.bar.update:
                id: bar_ota
                value: !lambda return (int) x;
            - lvgl.label.update:
                id: lbl_ota_pct
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d", (int) x);
                  return std::string(buf);
            - lambda: 'lv_refr_now(nullptr);'
    on_end:
      - lvgl.bar.update:
          id: bar_ota
          value: 100
      - lvgl.label.update:
          id: lbl_ota_pct
          text: "100"
      - lvgl.label.update:
          id: lbl_ota_hint
          text: "Neustart …"
      - lambda: 'lv_refr_now(nullptr);'
    on_error:
      # x ist der Fehlercode (uint8_t).
      - lvgl.label.update:
          id: lbl_ota_title
          text: "Update fehlgeschlagen"
      - lvgl.label.update:
          id: lbl_ota_hint
          text: !lambda |-
            char buf[24];
            snprintf(buf, sizeof(buf), "Fehlercode %d", (int) x);
            return std::string(buf);
      - lambda: 'lv_refr_now(nullptr);'
      # Stehen lassen, damit die Meldung lesbar ist -- danach zurueck zur
      # Oberflaeche, das Geraet laeuft ja mit der alten Firmware weiter.
      # Ab hier laeuft loop() wieder, LVGL zeichnet also von selbst.
      - delay: 10s
      - globals.set:
          id: ota_running
          value: 'false'
      - lvgl.widget.hide: ota_panel
      - script.execute: update_clock


##############################################################################
# Bluetooth LE
#
# Der ESP32-P4 hat selbst kein Funkmodul. BLE laeuft ueber denselben
# ESP32-C6-Co-Prozessor wie WLAN: ESPHome erkennt die esp32_hosted-Komponente
# und schaltet den HCI-Controller ueber die SDIO-Verbindung frei
# (CONFIG_ESP_HOSTED_ENABLE_BT_BLUEDROID / ..._BLUEDROID_HCI_VHCI).
# Der C6 kann Bluetooth 5 / BLE inklusive Coded PHY.
#
# WLAN und BLE teilen sich das Funkteil des C6. Ein Dauerscan (Fenster =
# Intervall, frueher 1100ms/1100ms) laesst WLAN keine Luft; ab 2026.9 warnt
# ESPHome genau davor. Deshalb scannt BLE nur 300ms von 320ms -- die Luecke
# gehoert WLAN. Waehrend der aktive Proxy GATT-Verbindungen fuer Home
# Assistant haelt, scannt er nur noch 30ms pro Intervall
# (connection_scan_window), damit Verbindung und WLAN nicht verhungern.
# Falls WLAN trotzdem instabil wird, zuerst "active: false" beim Scan probieren.
##############################################################################

esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 300ms
    connection_scan_window: 30ms
    active: true

# Macht das Panel zum Bluetooth-Proxy fuer Home Assistant: BLE-Geraete in
# Reichweite (Thermometer, Tracker, ...) werden an HA weitergereicht.
bluetooth_proxy:
  active: true

##############################################################################
# Zeit und Diagnose
#
# Zeitquelle kommt von Home Assistant (kein eigener NTP-Server noetig) und ist
# Voraussetzung fuer Uhr-Anzeigen und Voice-Timer.
##############################################################################

time:
  - platform: homeassistant
    # Die ID heisst bewusst neutral: Der Simulator legt unter demselben Namen
    # eine host-Zeitquelle an, damit die Uhr in .pv-dashboard_ui.yaml auf
    # beiden Seiten unveraendert funktioniert.
    id: dash_time
    timezone: Europe/Berlin
    # Sobald die Zeit steht, sofort anzeigen -- sonst stuende bis zur naechsten
    # vollen Minute weiter "--:--" auf dem Panel.
    on_time_sync:
      - then:
          - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock
      # Zur vollen Stunde die Tagesreihe fortschreiben
      - minutes: 0
        seconds: 5
        then:
          - script.execute: record_hour

sensor:
  - platform: wifi_signal
    name: "WLAN-Signal"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Laufzeit"
    id: device_uptime
    update_interval: 60s
    entity_category: diagnostic

  # Der ESP32-P4 hat einen internen Temperatursensor. Der Messwert liegt
  # typischerweise deutlich ueber der Raumtemperatur -- er beschreibt den Chip,
  # nicht die Umgebung.
  - platform: internal_temperature
    name: "Chiptemperatur"
    id: chip_temperature
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  # Bewusst keine "version"-Entity: die ESPHome-Version steht ohnehin im
  # Boot-Log und im Geraeteeintrag von Home Assistant.
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic
    ssid:
      name: "Verbundenes WLAN"
      entity_category: diagnostic
    mac_address:
      name: "MAC-Adresse"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Neustart"
    entity_category: diagnostic

##############################################################################
# Serielle Schnittstellen ueber den USB-OTG-Port
#
# Statt Pegelwandler auf den 40-Pin-Header zu loeten, haengt ein fertiger
# Mehrkanal-Converter am USB-OTG-Type-C-Port. Das kostet keinen einzigen GPIO.
#
#   Geraet : Waveshare "USB TO 4CH Serial Converter" (SKU 25790)
#            ASIN B0CM68TPNR, Chip FT4232HL, VID 0x0403 / PID 0x6011
#
#   Port A : TTL                          -> ungenutzt
#   Port B : TTL / RS485                  -> ungenutzt
#   Port C : RS485 / RS422, isoliert      -> RS485 zur Batterie (BMS)
#   Port D : RS232 / RS485, isoliert      -> RS232 zur Batterie (BMS)
#
# Anschluss am Converter ist USB Typ B -- Kabel USB-B auf USB-C noetig, der
# OTG-Port des Panels ist Type-C.
#
# Ein einziges USB-Geraet mit vier Kanaelen -- deshalb kein Hub noetig und
# keine VID/PID-Kollision. (ESPHome ordnet USB-Geraete ausschliesslich ueber
# VID/PID zu; zwei baugleiche Einzeladapter waeren nicht unterscheidbar.)
#
# WICHTIG: Die Kanaele sind POSITIONSBASIERT. Der Index ergibt sich aus der
# Reihenfolge in "channels:", also muessen auch die ungenutzten Ports A und B
# deklariert werden, damit C und D auf den richtigen Indizes landen.
#
# Port C und D sind galvanisch getrennt. Das ist bei der BMS-Anbindung kein
# Luxus: die Masse eines 16S-LiFePO4-Packs liegt auf anderem Potential als das
# Panel.
##############################################################################

usb_host:
  # Der Converter haengt direkt am OTG-Port. Fuer Geraete hinter einem
  # USB-Hub muesste das auf true stehen.
  enable_hubs: false

usb_uart:
  - type: FT4232
    channels:
      # --- Port A: TTL, aktuell ungenutzt --------------------------------
      - id: uart_port_a
        baud_rate: 9600

      # --- Port B: TTL/RS485, aktuell ungenutzt --------------------------
      - id: uart_port_b
        baud_rate: 9600

      # --- Port C: isoliertes RS485 zur Batterie -------------------------
      # Das Datenblatt des BMS nennt fuer seinen RS485-Port 9600 Baud.
      # Klemmen TA/TB.
      # Sitzt das Panel am Ende des RS485-Strangs, den 120R-Abschluss-
      # widerstand am Converter per Jumper zuschalten (ab Werk offen).
      - id: uart_bms_rs485
        baud_rate: 9600
        data_bits: 8
        parity: NONE
        stop_bits: "1"
        # Zum Mitlesen des Verkehrs beim Einrichten auf true stellen.
        debug: false

      # --- Port D: isoliertes RS232 zur Batterie -------------------------
      # Das Datenblatt des BMS nennt fuer seinen RS232-Port 115200 Baud.
      # Meldet sich das BMS nicht, ist 9600 der naechste Versuch.
      # Am BMS sitzt eine RJ11-Buchse -- Kabel RJ11 auf Schraubklemme:
      #   RJ11 Pin 3 (RXD) <- Converter TXD
      #   RJ11 Pin 4 (TXD) -> Converter RXD
      #   RJ11 Pin 5 (GND) <> Converter GND
      # RJ11-Pins 1 und 6 sind unbelegt, zaehlen beim Abzaehlen aber mit.
      # Am Converter die 232-Klemmen benutzen, die 485-Klemmen von Port D
      # bleiben frei.
      - id: uart_bms_rs232
        baud_rate: 115200
        data_bits: 8
        parity: NONE
        stop_bits: "1"
        debug: false

# --- Naechster Schritt: PACE-BMS am RS232-Strang ----------------------------
# Externe Komponente von nkinnan (paceic Protokoll v20 und v25). Erst
# aktivieren, wenn das BMS angeschlossen ist -- sonst laufen nur Timeouts ins
# Log. Die Protokollversion muss zum BMS passen.
#
# Nicht direkt von GitHub einbinden: Die Komponente ruft das seit 2026.9.0
# abgekuendigte check_uart_settings() auf, ab 2027.3.0 bricht der Build. Der
# Patch dagegen liegt in patches/pace_bms-check_uart_settings.patch; wie die
# gepatchte Kopie nach .pace-bms/ kommt, steht in docs/06 ("BMS: serielle
# Anbindung"). Der Pfad gilt relativ zu pv-dashboard.yaml, auch wenn dieses
# Paket aus dem Repo nachgeladen wird (external_components nimmt
# CORE.relative_config_path, nachgelesen in 2026.9.0, nicht am Geraet
# erprobt).
#
# external_components:
#   - source:
#       type: local
#       path: .pace-bms/components
#     components: [pace_bms]
#
# pace_bms:
#   id: bms
#   uart_id: uart_bms_rs232
#   protocol_commandset: 0x25     # oder 0x20, je nach BMS
#   update_interval: 5s
#
# Und/oder Modbus auf dem RS485-Strang der Batterie:
#
# modbus:
#   uart_id: uart_bms_rs485
#   id: modbus_bms
#   send_wait_time: 200ms
