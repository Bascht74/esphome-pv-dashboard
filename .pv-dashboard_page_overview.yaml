              #            kuerzt DOT das Ende, also die Spannung, nie den Strom
              #            samt Vorzeichen. Feste Hoehe 17, sonst bricht DOT um.
              #            Toenung und Schein wie beim ersten
              #            Wechselrichter (Kugeln nur
              #            oben mittig, hinter der deckenden Fuellung
              #            col_box_batt): grad_box_long_batt 112 x 66 ab
              #            2 / 7 auf voller Innenbreite bis y 72, dort ist er
              #            aus.
              - obj: { styles: st_box, scrollbar_mode: 'off', scrollable: false, scroll_dir: NONE, x: 498, y: 299, width: 116, height: 80,
