                  { label: { id: d_misc, width: 94, height: 17, long_mode: DOT, text_align: CENTER, text: "kW · Basis --", text_color: $col_ink3, text_font: f_unit } } ] }
              - obj: { styles: st_box, scrollbar_mode: 'off', scrollable: false, scroll_dir: NONE, x: 342, y: 419, width: 100, height: 112, border_color: $col_solar, bg_color: $col_bg, pad_all: 1, layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER, pad_row: 4 }, widgets: [
