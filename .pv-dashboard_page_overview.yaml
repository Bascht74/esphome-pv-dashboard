              #            Abgang unten laeuft von seiner Unterkante 657 bis 664
              #            (Kugel bis 668 = Schema). PV-Zaehler 43..171 und
              #            Hauszaehler 733..861 gespiegelt: Mitten 107/797 = 452
              #            -/+ 345, Rand je 43, Querleitungen 171..370 und
              #            534..733, je 199 lang. Beide 545..647, Mitte 596 wie
              #            beim Hausanschluss (535..657): Die Querleitungen bei
              #            y 595 treffen alle drei Kaesten mittig.
              - obj: { styles: st_box, scrollbar_mode: 'off', scrollable: false, scroll_dir: NONE, x: 43, y: 545, width: 128, height: 102, border_color: $col_full, bg_color: $col_bg, pad_all: 1, layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER, pad_row: 4 }, widgets: [
                  { label: { text: "\U000F0199", text_font: f_icon, text_color: $col_full } },
                  { label: { width: 122, height: 17, long_mode: DOT, text_align: CENTER, text: "${name_meter_pv}", text_color: $col_ink2, text_font: f_unit } },
