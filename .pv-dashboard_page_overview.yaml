              # Rahmen der Volleinspeisung zuerst, damit er hinter allem liegt.
              #
              # Die Beschriftung sass frueher oben bei y=8 und wurde dort von
              # den Dachflaechen-Kaesten ueberlagert (Label bis y=25, Kaesten
              # ab y=16). Oben ist kein Platz zu gewinnen -- die Kaesten
              # koennen nicht tiefer, weil das Schema unten bereits auf der
              # vollen Hoehe sitzt. Sie steht deshalb jetzt auf der unteren
              # Rahmenlinie und traegt die Hintergrundfarbe, wodurch sie die
              # Linie sauber freistanzt: dasselbe Prinzip wie bei einem
              # beschrifteten Feldrahmen.
              # Rahmen 2..212: Rand je 9 zur Gruppe der beiden ersten
              # Flaechen (11..203), Mitte 107 = erster Wechselrichter.
              # Beschriftung 76 breit bei 116..192, also auf der geraden
              # Unterkante: 7,5 zu dessen Leitung (Kante
              # 108,5), 8 zum Eckbogen ab x 200.
              # Oben y 4 (Schirm 80) statt buendig mit der rechten Spalte
              # (Kacheln ab Schirm 84): So bleiben 8 bis zum Dachbild (y 12),
              # fast wie die 9 seitlich. Buendig blieben dort nur 4; der
              # Versatz von 4 zur Kachelkante ist dafuer in Kauf genommen.
              - obj: { id: frame_full, scrollbar_mode: 'off', scrollable: false, scroll_dir: NONE, x: 2, y: 4, width: 210, height: 246, bg_opa: TRANSP,
                       border_color: $col_full, border_width: 1, border_opa: 45%, radius: 12, pad_all: 0 }
