##############################################################################
# Package: Seite 1 -- Uebersicht
#
# Haengt an .pv-dashboard_ui.yaml (packages:) und kommt damit ueberall mit.
#
# Anlagenschema mit Flussanimation und die rechte Kennzahlenspalte. Dazu
# gehoeren hierher: redraw_curve, das Balken und Prognoselinie der Kachel
# Tagesverlauf zeichnet, und der erzeugte Animationsblock am Ende.
#
# Der Block zwischen "# >>> flow-animation" und "# <<< flow-animation" und
# die Kugel-Widgets flNN/flNNb im schema_area stammen NUR von
# tools/flow_animation.py -- nicht von Hand aendern. Das Werkzeug liest und
# schreibt genau diese Datei.
##############################################################################

##############################################################################
# Standardbeschriftungen (Demo-Anlage)
#
# Jede Beschriftung, die von der eigenen Anlage abhaengt, steht hier als
# Substitution mit einem neutralen Demo-Wert. Wer dieselbe Substitution in
# .pv-dashboard_anlage.yaml setzt (von pv-dashboard.yaml in dessen
# substitutions eingefuegt), sticht den Standard: ESPHome traegt die
# Substitutions der Hauptdatei zuerst ein und ueberspringt beim Einlesen der
# Pakete jeden Namen, den es schon kennt (geprueft mit 2026.9.0). Unter
# Paketen gilt das nicht: Dort sticht der spaetere Eintrag aus dem
# packages-Block von .pv-dashboard_ui.yaml den frueheren. Ohne
# pv-dashboard.yaml -- also im Simulator und beim Screenshot-Lauf -- gelten
# die Werte von hier, beide Konfigurationen bauen dadurch allein.
#
# Hinter jeder Zeile steht "Breite des Demo-Werts von verfuegbarer Breite"
# in Pixeln. Die Kaesten sind knapp gerechnet; laengere Namen kuerzt LVGL
# mit "..." (long_mode DOT). Nach jeder Aenderung neu rendern, docs/04.
##############################################################################

substitutions:
  # --- Dachflaechen und Module, von links nach rechts (je 88 px) --------
  name_pv_1: "Dach Süd"        # 56 von 88
  name_pv_2: "Dach West"       # 63 von 88
  name_pv_3: "Modul 1"         # 48 von 88, Einzelmodul am Mini-Wechselrichter
  name_pv_4: "Modul 2"         # 48 von 88, Einzelmodul am Mini-Wechselrichter
  name_pv_5: "Dach Ost"        # 53 von 88
  name_pv_6: "Nebendach"       # 67 von 88
  name_pv_7: "Dach Nord"       # 62 von 88
  name_pv_8: "Garagendach"     # 78 von 88

  # --- Wechselrichter, je zwei Flaechen darueber (je 132 px) ------------
  name_inv_1: "Voll-WR 7 kW"       #  81 von 132
  name_inv_2: "Mini-WR 0,8 kW"     #  94 von 132
  name_inv_3: "Hybrid 10 kW · A"   #  98 von 132
  name_inv_4: "Hybrid 10 kW · B"   #  98 von 132

  # --- Rahmen um die Volleinspeisung, zweizeilig (je 64 px) -------------
  name_feedin: "VOLLEIN-\nSPEISUNG"   # 58 / 64 von je 64

  # --- Speicher im Schema (je 108 px) -----------------------------------
  # Standard steht doppelt: dieselben drei Namen setzt auch
  # .pv-dashboard_page_battery.yaml. Beide Stellen muessen gleich lauten --
  # laufen sie auseinander, gewinnt stillschweigend das Speicher-Paket, weil
  # es im packages-Block von .pv-dashboard_ui.yaml spaeter steht; unter
  # Paketen sticht der spaetere Eintrag (geprueft mit 2026.9.0). Die drei
  # Zeilen hier sind dann tote Zeilen, gemeldet wird das nicht. Ein Wert aus
  # .pv-dashboard_anlage.yaml sticht ohnehin beide.
  name_bat_1: "Speicher 1"     # 63 von 108
  name_bat_2: "Speicher 2"     # 63 von 108
  name_bat_3: "Speicher 3"     # 63 von 108

  # --- Hausnetz und Verbraucherschiene ----------------------------------
  name_house: "Hausnetz"       #  64 von 172
  name_heatpump: "Wärmepumpe"  #  83 von 94
  name_misc: "Sonstige"        #  50 von 94
  name_wb_1: "Wallbox 1"       #  60 von 94
  name_wb_2: "Wallbox 2"       #  60 von 94

  # --- Zaehler der unteren Reihe ----------------------------------------
  name_meter_pv: "PV-Zähler"      #  59 von 122
  name_grid: "Hausanschluss"      #  86 von 158
  name_meter_house: "Hauszähler"  #  65 von 122

  # --- Zweitzeile der Kachel Eigenverbrauch (92 px) ---------------------
  # Die Quote laesst die Volleinspeisung aussen vor (docs/01). Eigener Text
  # statt Verweis auf name_inv_1: Dort steht die Leistung mit, das waere
  # hier 112 statt 79 px breit und wuerde umbrechen.
  name_selfuse_note: "ohne Voll-WR"   # 79 von 92

  # --- Tarife fuer die Geldrechnung, in Cent je kWh ---------------------
  # Noch ungenutzt: Die Kachel TAGESERTRAG zeigt Platzhalter. Der Standard
  # steht hier, damit Simulator und Screenshot-Lauf weiterbauen, sobald die
  # Rechnung dazukommt. Die eigenen Tarife gehoeren in
  # .pv-dashboard_anlage.yaml.
  tarif_volleinspeisung_ct: "20.0"  # Volleinspeisung
  tarif_ueberschuss_ct: "10.0"      # Ueberschusseinspeisung
  tarif_bezug_ct: "30.0"            # Strombezug

script:
  # Zeichnet Balken (Ist) und Linie (Prognose) aus beiden Reihen. Sie liegen
  # uebereinander in derselben Kachel: Die Linie steht im YAML nach den Balken
  # und wird deshalb darueber gezeichnet.
  - id: redraw_curve
    then:
      - lambda: |-
          // Zerlegt "1.2,3.4,..." in 16 Werte. Fehlende Felder bleiben 0.
          auto parse_curve = [](const std::string &src, float *out) {
            size_t pos = 0;
            for (int i = 0; i < 16 && pos <= src.size(); i++) {
              size_t comma = src.find(',', pos);
              std::string field = src.substr(pos, comma == std::string::npos
                                                  ? std::string::npos : comma - pos);
              float f = field.empty() ? 0.0f : strtof(field.c_str(), nullptr);
              // Von Hand gesetzte Reihe (nan, negativ, 1e30) -> 0..999
              out[i] = std::isfinite(f) ? std::clamp(f, 0.0f, 999.0f) : 0.0f;
              if (comma == std::string::npos)
                break;
              pos = comma + 1;
            }
          };
          float ist[16] = {0}, pro[16] = {0};
          parse_curve(id(day_curve).state, ist);
          parse_curve(id(forecast_curve).state, pro);
          // Gemeinsamer Massstab -- sonst waere der Vergleich wertlos.
          // Nebenbei die Tagessummen fuer die Unterzeile.
          float peak = 0.1f, sum_ist = 0.0f, sum_pro = 0.0f;
          for (int i = 0; i < 16; i++) {
            peak = std::max(peak, ist[i]);
            peak = std::max(peak, pro[i]);
            sum_ist += ist[i];
            sum_pro += pro[i];
          }
          // id(bar_hNN) ist bereits ein lv_obj_t* (der Cast aendert nichts).
          // Die Linie ist dagegen ein C++-Wrapper (LvLineType, mit vtable):
          // Ihr lv_obj_t steckt in ->obj, ein Cast zeigte auf den Wrapper und
          // beschriebe fremden Speicher. Ein Makro geht hier nicht: ESPHome
          // loest id(...) im Lambda-Text auf, bevor der Compiler es sieht.
          lv_obj_t *const bars[16] = {
            reinterpret_cast<lv_obj_t *>(id(bar_h00)),
            reinterpret_cast<lv_obj_t *>(id(bar_h01)),
            reinterpret_cast<lv_obj_t *>(id(bar_h02)),
            reinterpret_cast<lv_obj_t *>(id(bar_h03)),
            reinterpret_cast<lv_obj_t *>(id(bar_h04)),
            reinterpret_cast<lv_obj_t *>(id(bar_h05)),
            reinterpret_cast<lv_obj_t *>(id(bar_h06)),
            reinterpret_cast<lv_obj_t *>(id(bar_h07)),
            reinterpret_cast<lv_obj_t *>(id(bar_h08)),
            reinterpret_cast<lv_obj_t *>(id(bar_h09)),
            reinterpret_cast<lv_obj_t *>(id(bar_h10)),
            reinterpret_cast<lv_obj_t *>(id(bar_h11)),
            reinterpret_cast<lv_obj_t *>(id(bar_h12)),
            reinterpret_cast<lv_obj_t *>(id(bar_h13)),
            reinterpret_cast<lv_obj_t *>(id(bar_h14)),
            reinterpret_cast<lv_obj_t *>(id(bar_h15)) };
          for (int i = 0; i < 16; i++)
            lv_bar_set_value(bars[i], (int32_t) (ist[i] / peak * 100.0f), LV_ANIM_OFF);
          // Die Punktliste muss das Widget ueberleben, daher static.
          static lv_point_precise_t pts[16];
          for (int i = 0; i < 16; i++) {
            pts[i].x = i * 21 + 8;
            pts[i].y = (lv_value_precise_t) (130 - pro[i] / peak * 130.0f);
          }
          lv_line_set_points(id(line_forecast)->obj, pts, 16);
          // Unterzeile: Summen mit einer Nachkommastelle und Dezimalkomma
          char s_ist[16], s_pro[16];
          snprintf(s_ist, sizeof(s_ist), "%.1f", sum_ist);
          snprintf(s_pro, sizeof(s_pro), "%.1f", sum_pro);
          for (char *s : {s_ist, s_pro})
            if (char *dot = strchr(s, '.'))
              *dot = ',';
          lv_label_set_text_fmt(id(lbl_day_sub), "06 – 22 Uhr · Ist %s kWh · Prognose %s kWh",
                                s_ist, s_pro);

lvgl:
  pages:
    - id: page_overview
      bg_color: $col_bg
      scrollable: false
      scroll_dir: NONE
      widgets:
        # ---------------- rechte Kennzahlenspalte ----------------------
        # Tagesverlauf.
        # ESPHomes LVGL kennt kein chart-Widget -- die Stundenbalken sind
        # daher einzelne bar-Widgets. Vorteil: jeder Balken ist per ID
        # ansprechbar und laesst sich einzeln einfaerben (z.B. Netzbezug rot).
        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            scrollable: false
            scroll_dir: NONE
            x: 912
            y: 84
            width: 364
            height: 200
            widgets:
              - label:
                  styles: st_label
                  width: 342
                  long_mode: WRAP
                  text: "TAGESVERLAUF · IST UND PROGNOSE"
              # 16 Balken im Raster 21 belegen 15 x 21 + 17 = 332 px der 342 px
              # Innenbreite -- x ab 5 gibt links und rechts je 5 px Rand. Die
              # Prognoselinie ruht mit x: 5 im selben Raster, redraw_curve
              # rechnet ihre Punkte deshalb weiter ab 0. Fuellung grad_day_bar
              # (oben col_solar, darunter tiefer); die helle Prognoselinie
              # kreuzt so nie einen helleren Ton als col_solar.
              - bar: { id: bar_h00, x:   5, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
              - bar: { id: bar_h01, x:  26, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
              - bar: { id: bar_h02, x:  47, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
              - bar: { id: bar_h03, x:  68, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
              - bar: { id: bar_h04, x:  89, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
