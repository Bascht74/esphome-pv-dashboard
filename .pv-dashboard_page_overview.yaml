          static int16_t lx[37], ly[37], lxB[37], lyB[37];
          static bool    init = false;
          static uint8_t next = 0;
          static uint32_t gesehen = 0xFFFFFFFFu;
          static uint64_t lvis = ~0ULL;
          lv_obj_t *const dots[37] = {
