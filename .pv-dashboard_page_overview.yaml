        # Autarkie und Eigenverbrauch. Spalte 84..736 wie Speicher- und
        # Meldungsseite, je 8 Abstand; innen 112 - 2 x 10 - 2 x 1 = 90, der
        # Ring 16..74 sitzt mittig (45). Beschriftung in beiden Kacheln ab x 64.
        - obj:
            styles: st_tile
            scrollbar_mode: 'off'
            scrollable: false
            scroll_dir: NONE
            x: 912
            y: 624
            width: 178
            height: 112
            widgets:
              # Ring wie auf der Speicherseite: konischer Verlauf als Scheibe,
              # innen eine Scheibe in Kachelfarbe (Ring 7 breit), darueber ein
              # Bogen im REVERSE-Modus, der 100 - Autarkie in Spurfarbe
              # abdeckt (Wert 100 = leer, der Stand ohne Daten; speisen wie
              # storage_update: lv_arc_set_value(Deckbogen, 100 - Wert)).
              # Die untere Oeffnung deckt zuletzt ein Bogen in Kachelfarbe:
              # je 3 Grad in den Ring hinein, damit nie zwei geglaettete
              # Kanten aufeinander liegen, und 62 breit, damit der Saum der
              # Scheibe nicht durchscheint (die Scheibe schneidet ihn auf 58
              # zu). Die Oeffnung als durchsichtiger Teil eines 360-Grad-
              # Verlaufs zeigte dagegen unten einen Saum.
              - obj:
                  x: 0
                  y: 16
                  width: 58
                  height: 58
                  radius: CIRCLE
                  bg_grad: grad_autarky_ring
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  scrollbar_mode: 'off'
                  scrollable: false
                  scroll_dir: NONE
                  widgets:
                    - obj: { align: CENTER, width: 44, height: 44, radius: CIRCLE, bg_color: $col_surface, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false, scrollable: false }
                    - arc: { id: ring_cover_autarky, align: CENTER, width: 58, height: 58, start_angle: 135, end_angle: 45, mode: REVERSE, value: 100, arc_opa: TRANSP, arc_width: 7, pad_all: 0, clickable: false,
                             indicator: { arc_color: $col_line, arc_width: 7, arc_rounded: false, pad_all: 0 }, knob: { bg_opa: TRANSP, pad_all: 0 } }
                    - arc: { align: CENTER, width: 62, height: 62, start_angle: 42, end_angle: 138, value: 0, arc_color: $col_surface, arc_width: 12, arc_rounded: false, pad_all: 0, clickable: false,
                             indicator: { arc_opa: TRANSP, pad_all: 0 }, knob: { bg_opa: TRANSP, pad_all: 0 } }
              # Wert und Einheit mittig im Ring (x 0..58); das "%" sitzt in
              # der unteren Oeffnung des Bogens. Wert 26..47, Einheit 47..64:
              # Blockmitte 45 = Ringmitte (16 + 29), keine Ueberlappung.
              - label:
                  id: val_autarky
                  x: 0
                  y: 26
                  width: 58
                  text_align: CENTER
                  text: "--"
                  text_font: f_val_s
                  text_color: $col_ink
              - label:
                  x: 0
                  y: 47
                  width: 58
                  text_align: CENTER
