          static const uint32_t L_ALL[] = {0x1,0x100,0x2,0x4,0x200,0x8,0x10,0x400,0x20,0x40,0x800,0x80,0x600,0xC00,0x400,0x400,0x800,0x0,0x0,0x1000,0x0,0x2000,0x4000,0x80800,0x0,0x0,0x0,0x0,0x0,0x20000,0x0,0x8000,0x10000,0x40100,0x40000,0x80000,0x0};
