              - obj: { styles: st_box, scrollbar_mode: 'off', scrollable: false, scroll_dir: NONE, x: 733, y: 545, width: 128, height: 102, border_color: $col_feed, bg_color: $col_bg, pad_all: 1, layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER, pad_row: 4 }, widgets: [
                  { label: { text: "\U000F0199", text_font: f_icon, text_color: $col_feed } },
                  { label: { width: 122, height: 17, long_mode: DOT, text_align: CENTER, text: "${name_meter_house}", text_color: $col_ink2, text_font: f_unit } },
                  { label: { id: v_meter_house, width: 122, height: 21, long_mode: DOT, text_align: CENTER, text: "--,-", text_font: f_val_s, text_color: $col_feed } },
                  { label: { id: e_meter_house, width: 122, height: 17, long_mode: DOT, text_align: CENTER, text: "kW · --,- kWh", text_color: $col_ink3, text_font: f_unit } } ] }

              # ---------- Werte auf den Leitungen: feste y-Positionen, kein Flex.
              #            Innen 48 - 2 x 3 - 2 x 1 = 40 hoch; Wert 0..21, Zeile
              #            22..39 -> Reserve 1. Kasten 590..774, Mitte 682 =
              #            Abgang zur Schiene, Stummel 581..590 und 774..783 je 9.
              #            Innenbreite 184 - 8 = 176 = Labels. Jeder Tageswert
              #            traegt seine Einheit, der Pfeil steht wie ein
              #            Vorzeichen direkt vor der Zahl. Gemessen (f_unit,
              #            Ziffern tabellarisch 7,8): "W · (Pfeil)12,3 kWh ·
              #            (Pfeil)18,5 kWh" = 172 -> Reserve 4 fuer jeden
              #            zweistelligen Wert; mit Leerzeichen hinter den
              #            Pfeilen waeren es 178. Dreistellig kuerzt DOT.
              #            Toenung wie bei den Speichern (deckend,
              #            col_box_batt), Schein in der kurzen Form
              #            (grad_box_short_batt). Die Kugeln links und rechts
              #            (y 20..27) und unten mittig (ab y 44) reichen
              #            gerundet bis 4 px hinein und verschwinden hinter
