              - obj: { styles: st_box, scrollbar_mode: 'off', scrollable: false, scroll_dir: NONE, x: 370, y: 535, width: 164, height: 122, border_color: $col_feed, bg_color: $col_bg, pad_all: 1, layout: { type: FLEX, flex_flow: COLUMN, flex_align_main: CENTER, flex_align_cross: CENTER, flex_align_track: CENTER, pad_row: 4 }, widgets: [
                  { label: { text: "\U000F0D3E", text_font: f_icon, text_color: $col_feed } },
                  { label: { width: 158, height: 17, long_mode: DOT, text_align: CENTER, text: "${name_grid}", text_color: $col_ink2, text_font: f_unit } },
