              - bar: { id: bar_h09, x: 194, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
              - bar: { id: bar_h10, x: 215, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
              - bar: { id: bar_h11, x: 236, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
              - bar: { id: bar_h12, x: 257, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
              - bar: { id: bar_h13, x: 278, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
              - bar: { id: bar_h14, x: 299, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
              - bar: { id: bar_h15, x: 320, y: 26, width: 17, height: 130, min_value: 0, max_value: 100, value: 0, bg_color: $col_surface, radius: 3, indicator: { bg_grad: grad_day_bar, radius: 3 } }
