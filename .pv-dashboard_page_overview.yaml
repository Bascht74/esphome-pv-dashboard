            #ifdef USE_HOST
            static const float DEMO[] = {2840, 1620, 335, 290, 1910, 1240, 680, 1465, 4460, 625, 3150, 2145, 760, 300, 250, 210, 1790, 430, 210, 1150, 0, 4460, 3180, 7640};
            bool leer = true;
            for (float v : id(flow_ch)) if (v != 0.0f) leer = false;
            if (leer) for (int k = 0; k < 24; k++) id(flow_ch)[k] = DEMO[k];
            #endif
          }
          // Fehlende Geraete (Referenz): Leitungen um- und ausblenden, sobald
          // sich dev_present aendert. Kostet nur beim Wechsel etwas.
          const uint32_t da = id(dev_present);
          if (da != gesehen) {
            gesehen = da;
            lv_obj_t *const lines[37] = {
            id(ln00)->obj, id(ln01)->obj, id(ln02)->obj, id(ln03)->obj, id(ln04)->obj,
            id(ln05)->obj, id(ln06)->obj, id(ln07)->obj, id(ln08)->obj, id(ln09)->obj,
            id(ln10)->obj, id(ln11)->obj, id(ln12)->obj, id(ln13)->obj, id(ln14)->obj,
            id(ln15)->obj, id(ln16)->obj, id(ln17)->obj, id(ln18)->obj, id(ln19)->obj,
            id(ln20)->obj, id(ln21)->obj, id(ln22)->obj, id(ln23)->obj, id(ln24)->obj,
            id(ln25)->obj, id(ln26)->obj, id(ln27)->obj, id(ln28)->obj, id(ln29)->obj,
            id(ln30)->obj, id(ln31)->obj, id(ln32)->obj, id(ln33)->obj, id(ln34)->obj,
            id(ln35)->obj, id(ln36)->obj };
            for (int k = 0; k < 37; k++) {
              const bool v = (da & L_ALL[k]) == L_ALL[k] && (!L_A[k] || (da & L_A[k])) && (!L_B[k] || (da & L_B[k]));
              if (v) { lvis |= 1ULL << k; lv_obj_remove_flag(lines[k], LV_OBJ_FLAG_HIDDEN); }
              else   { lvis &= ~(1ULL << k); lv_obj_add_flag(lines[k], LV_OBJ_FLAG_HIDDEN); }
            }
          }
          // Leistung je Strecke aus ihrem Kanal; versteckte Strecken und
          // Werte unter 10 W zaehlen als 0 (Kugel steht, loest nichts aus).
          float WATT[37];
          for (int i = 0; i < 37; i++) {
            float w = (CH[i] >= 0 && ((lvis >> LN[i]) & 1ULL)) ? id(flow_ch)[CH[i]] : 0.0f;
            WATT[i] = (std::isfinite(w) && fabsf(w) >= 10.0f) ? w : 0.0f;
          }
          int bewegt = 0;
          for (int q = 0; q < 37; q++) {
            int i = (next + q) % 37;
            // Verteilstrecken haben keine Kugel (nullptr) und loesen nichts
            // aus; ihre Abgaenge laufen als ROOT endlos (Regel 4 und 5).
            // Negativ: rueckwaerts, endlos, ohne Ausloesen (Regel 9).
            const bool rev = WATT[i] < 0.0f;
            if (dots[i] && rev) live[i] = true;
            if (!dots[i] || !live[i] || WATT[i] == 0.0f) { if (dots[i]) lv_obj_add_flag(dots[i], LV_OBJ_FLAG_HIDDEN); continue; }

            float wl = fabsf(WATT[i]), umlauf;
            if (wl <= 500.0f) umlauf = 16.0f / powf(fmaxf(wl, 50.0f) / 50.0f, 0.30103f);
            else              umlauf = 8.0f / powf(wl / 500.0f, 0.48945f);
            if (umlauf < 1.0f) umlauf = 1.0f;
            float total = 0;
            for (int s = 0; s < CNT[i]; s++) total += SL[OFF[i] + s];
            umlauf *= powf(total / 490.0f, 0.5f);   // kurze Strecken deutlich schneller
            float sch = total / umlauf * 20 / 1000.0f;
            // Langsame Kugeln melden sich seltener: unter 1 px je Tick wird
            // aufsummiert und erst ab 2 px bewegt. Nachgerechnet ueber alle
            // Strecken kostet das im Mittel 6,8 Bewegungen je Tick, also
            // 13,6 von 32 Flaechen -- bei 4 px waeren es 9,8. Die Reserve
            // traegt das, und die langsamen laufen doppelt so glatt.
            // 1,5 px waeren 16,1 Flaechen und damit zu knapp am Deckel.
            // Gestaffelt: sehr langsame Kugeln bewegen sich in 1-px-Schritten,
            // denn sie kommen ohnehin nur alle paar hundert Millisekunden
            // dran. Ab 0,3 px je Tick lohnt die groebere Stufe.
            if (sch < 1.0f) {
              float grenze = (sch < 0.30f) ? 1.0f : 2.0f;
              acc[i] += sch;
              if (acc[i] < grenze) continue;              // noch nicht genug
              if (bewegt >= 13) continue;          // Deckel: acc BLEIBT stehen
              // Nicht mehr als eine Stufe auf einmal: sonst sammelt der
              // Zaehler waehrend einer Drosselung weiter an und die Kugel
              // springt danach ueber mehrere Pixel.
              if (acc[i] > grenze) acc[i] = grenze;
              sch = acc[i]; acc[i] = 0;
            } else if (bewegt >= 13) {
              acc[i] += sch;                              // Zeit merken statt verlieren
              continue;
            }
            // Schnelle Kugeln laufen mit kleinen Schritten, dafuer bei jedem
            // Tick -- fluessiger als grosse Spruenge. Der Deckel bleibt bei
            // der Kugelgroesse, damit die Spur nicht reisst.
            if (sch > 8.0f) sch = 8.0f;
            pos[i] += sch + acc[i];
            acc[i] = 0;
            if (pos[i] >= total) {
              pos[i] = 0; live[i] = rev || ROOT[i];
              if (!rev) for (int s = 0; s < SCNT[i]; s++) {
                int t = SUCC[SOFF[i] + s];
                if (!live[t]) live[t] = true;
                else if (dotsB[t] && !liveB[t]) { liveB[t] = true; posB[t] = 0; }
              }
              if (!live[i]) { lv_obj_add_flag(dots[i], LV_OBJ_FLAG_HIDDEN); continue; }
            }
            float rest = rev ? total - pos[i] : pos[i];
            int16_t px = SX[OFF[i]], py = SY[OFF[i]];
            for (int s = 0; s < CNT[i]; s++) {
              int k = OFF[i] + s;
              if (rest <= SL[k] || s == CNT[i] - 1) {
                float f = SL[k] ? rest / SL[k] : 0;
                if (f > 1) f = 1;
                px = SX[k] + (EX[k] - SX[k]) * f;
                py = SY[k] + (EY[k] - SY[k]) * f;
                break;
              }
              rest -= SL[k];
            }
            lv_obj_remove_flag(dots[i], LV_OBJ_FLAG_HIDDEN);
            if (px != lx[i] || py != ly[i]) {
              lv_obj_set_pos(dots[i], px - 4, py - 4);
              lx[i] = px; ly[i] = py; bewegt++;
            }
          }
          for (int i = 0; i < 37; i++) {
            if (!dotsB[i]) continue;
            if (!liveB[i] || WATT[i] <= 0.0f) { lv_obj_add_flag(dotsB[i], LV_OBJ_FLAG_HIDDEN); continue; }
            float wl = fabsf(WATT[i]), umlauf;
            if (wl <= 500.0f) umlauf = 16.0f / powf(fmaxf(wl, 50.0f) / 50.0f, 0.30103f);
            else              umlauf = 8.0f / powf(wl / 500.0f, 0.48945f);
            if (umlauf < 1.0f) umlauf = 1.0f;
            float total = 0;
            for (int s = 0; s < CNT[i]; s++) total += SL[OFF[i] + s];
            umlauf *= powf(total / 490.0f, 0.5f);   // kurze Strecken deutlich schneller
            float sch = total / umlauf * 20 / 1000.0f;
            // Langsame Kugeln melden sich seltener: unter 1 px je Tick wird
            // aufsummiert und erst ab 2 px bewegt. Nachgerechnet ueber alle
            // Strecken kostet das im Mittel 6,8 Bewegungen je Tick, also
            // 13,6 von 32 Flaechen -- bei 4 px waeren es 9,8. Die Reserve
            // traegt das, und die langsamen laufen doppelt so glatt.
            // 1,5 px waeren 16,1 Flaechen und damit zu knapp am Deckel.
            // Gestaffelt: sehr langsame Kugeln bewegen sich in 1-px-Schritten,
            // denn sie kommen ohnehin nur alle paar hundert Millisekunden
            // dran. Ab 0,3 px je Tick lohnt die groebere Stufe.
            if (sch < 1.0f) {
              float grenze = (sch < 0.30f) ? 1.0f : 2.0f;
              accB[i] += sch;
              if (accB[i] < grenze) continue;              // noch nicht genug
              if (bewegt >= 13) continue;          // Deckel: accB BLEIBT stehen
              // Nicht mehr als eine Stufe auf einmal: sonst sammelt der
              // Zaehler waehrend einer Drosselung weiter an und die Kugel
              // springt danach ueber mehrere Pixel.
              if (accB[i] > grenze) accB[i] = grenze;
              sch = accB[i]; accB[i] = 0;
            } else if (bewegt >= 13) {
              accB[i] += sch;                              // Zeit merken statt verlieren
              continue;
            }
            // Schnelle Kugeln laufen mit kleinen Schritten, dafuer bei jedem
            // Tick -- fluessiger als grosse Spruenge. Der Deckel bleibt bei
            // der Kugelgroesse, damit die Spur nicht reisst.
            if (sch > 8.0f) sch = 8.0f;
            posB[i] += sch + accB[i];
            accB[i] = 0;
            if (posB[i] >= total) {
              posB[i] = 0; liveB[i] = false;
              for (int s = 0; s < SCNT[i]; s++) {
                int t = SUCC[SOFF[i] + s];
                if (!live[t]) live[t] = true;
                else if (dotsB[t] && !liveB[t]) { liveB[t] = true; posB[t] = 0; }
              }
              if (!liveB[i]) { lv_obj_add_flag(dotsB[i], LV_OBJ_FLAG_HIDDEN); continue; }
            }
            float rest = posB[i];
            int16_t px = SX[OFF[i]], py = SY[OFF[i]];
            for (int s = 0; s < CNT[i]; s++) {
              int k = OFF[i] + s;
              if (rest <= SL[k] || s == CNT[i] - 1) {
                float f = SL[k] ? rest / SL[k] : 0;
                if (f > 1) f = 1;
                px = SX[k] + (EX[k] - SX[k]) * f;
                py = SY[k] + (EY[k] - SY[k]) * f;
                break;
              }
              rest -= SL[k];
            }
            lv_obj_remove_flag(dotsB[i], LV_OBJ_FLAG_HIDDEN);
            if (px != lxB[i] || py != lyB[i]) {
              lv_obj_set_pos(dotsB[i], px - 4, py - 4);
              lxB[i] = px; lyB[i] = py; bewegt++;
            }
          }
          next = (next + bewegt + 1) % 37;
  # <<< flow-animation
