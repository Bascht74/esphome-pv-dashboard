                  { label: { id: d_bat1, align: TOP_MID, y: 52, width: 108, height: 17, long_mode: DOT, text_align: CENTER, text: "% · --- A · --,- V", text_color: $col_ink2, text_font: f_unit } } ] }
              - obj: { styles: st_box, scrollbar_mode: 'off', scrollable: false, scroll_dir: NONE, x: 624, y: 299, width: 116, height: 80,
                       border_color: $col_batt, bg_color: $col_box_batt, pad_all: 1, widgets: [
                  { obj: { x: -1, y: 4, width: 112, height: 66, radius: 0, bg_grad: grad_box_long_batt, bg_opa: COVER, border_width: 0, pad_all: 0, clickable: false, scrollable: false } },
                  { label: { align: TOP_MID, y: 3, width: 108, height: 17, long_mode: DOT, text_align: CENTER, text: "${name_bat_2}", text_color: $col_ink, text_font: f_unit } },
                  { label: { id: v_bat2, align: TOP_MID, y: 24, width: 108, height: 25, long_mode: DOT, text_align: CENTER, text: "--", text_font: f_val_m, text_color: $col_batt } },
                  { label: { id: d_bat2, align: TOP_MID, y: 52, width: 108, height: 17, long_mode: DOT, text_align: CENTER, text: "% · --- A · --,- V", text_color: $col_ink2, text_font: f_unit } } ] }
