              const float kw = V(id(ha_wb2_power), B_wb2_power), kwh = V(id(ha_wb2_energy), B_wb2_energy);
              const char *st = chg ? "Ladevorgang aktiv" : (con ? "Fahrzeug verbunden" : "Kein Fahrzeug");
              id(wallbox_update).execute(1, T(id(ha_wb2_mode), B_wb2_mode), chg, kw, I(V(id(ha_wb2_phases), B_wb2_phases), 0), kwh, V(id(ha_wb2_solar), B_wb2_solar), I(V(id(ha_wb2_minutes), B_wb2_minutes), -1),
                                         con ? T(id(ha_wb2_vehicle), B_wb2_vehicle) : std::string(), std::string(st), V(id(ha_wb2_soc), B_wb2_soc), V(id(ha_wb2_range), B_wb2_range),
                                         V(id(ha_wb2_limit), B_wb2_limit), when(T(id(ha_wb2_plan), B_wb2_plan), true));
              id(ov_consumer).execute(3, mul(kw, 1000.0f), con ? num(kwh, "%.1f", "--,-") + " kWh" : std::string("frei"));
              id(house_loadpoint).execute(1, mul(kw, 1000.0f), con ? V(id(ha_wb2_soc), B_wb2_soc) : NAN);
            }
          }
          // 18 Wallboxen Monat
          if ((d & (1u << 18)) && (dev & 0x00018000u) &&
              (ready || id(ha_wb_month_energy).has_state() || id(ha_wb_month_solar).has_state() || id(ha_wb_month_price).has_state())) {
            {
              const float e = V(id(ha_wb_month_energy), B_wb_month_energy), ct = V(id(ha_wb_month_price), B_wb_month_price);
              id(wallbox_month).execute(e, V(id(ha_wb_month_solar), B_wb_month_solar), mul(mul(e, ct), 0.01f), ct);
            }
          }
          // 19 Waermepumpe
          if ((d & (1u << 19)) && (dev & 0x00020000u) &&
              (ready || id(ha_hp_outdoor).has_state() || id(ha_hp_room).has_state() || id(ha_hp_humidity).has_state() ||
               id(ha_hp_dhw).has_state() || id(ha_hp_eheat).has_state() || id(ha_hp_fan).has_state() ||
               id(ha_hp_vent_mode).has_state() || id(ha_hp_season).has_state() || id(ha_hp_bypass).has_state() ||
               id(ha_hp_compressor).has_state() || id(ha_hp_supply).has_state() || id(ha_hp_exhaust).has_state() ||
               id(ha_hp_power).has_state() || id(ha_hp_energy).has_state() || id(ha_hp_alarm).has_state() ||
               id(ha_hp_room_set).has_state() || id(ha_hp_dhw_set).has_state() || id(ha_hp_fan_supply).has_state() ||
               id(ha_hp_fan_extract).has_state() || id(ha_hp_filter_days).has_state() || id(ha_hp_defrost).has_state() ||
               id(ha_hp_legionella).has_state())) {
            {
              const float kw = V(id(ha_hp_power), B_hp_power);
              id(heatpump_update).execute(V(id(ha_hp_outdoor), B_hp_outdoor), V(id(ha_hp_room), B_hp_room), V(id(ha_hp_humidity), B_hp_humidity), NAN, V(id(ha_hp_dhw), B_hp_dhw), id(ha_hp_eheat).state, I(V(id(ha_hp_fan), B_hp_fan), -1),
                                          T(id(ha_hp_vent_mode), B_hp_vent_mode), T(id(ha_hp_season), B_hp_season), T(id(ha_hp_bypass), B_hp_bypass), T(id(ha_hp_compressor), B_hp_compressor), V(id(ha_hp_supply), B_hp_supply), V(id(ha_hp_exhaust), B_hp_exhaust),
                                          kw, V(id(ha_hp_energy), B_hp_energy), I(V(id(ha_hp_alarm), B_hp_alarm), 0));
              id(heatpump_extra).execute(V(id(ha_hp_room_set), B_hp_room_set), V(id(ha_hp_dhw_set), B_hp_dhw_set), V(id(ha_hp_fan_supply), B_hp_fan_supply), V(id(ha_hp_fan_extract), B_hp_fan_extract), I(V(id(ha_hp_filter_days), B_hp_filter_days), -1),
                                         id(ha_hp_defrost).state, id(ha_hp_legionella).state);
              id(ov_consumer).execute(0, mul(kw, 1000.0f), "WW " + num(V(id(ha_hp_dhw), B_hp_dhw), "%.0f", "--") + "°C");
              id(house_update).execute(0, mul(kw, 1000.0f), V(id(ha_hp_energy), B_hp_energy));
            }
          }
          // 20 Verbraucher
          if ((d & (1u << 20)) &&
              (ready || id(ha_dev1_power).has_state() || id(ha_dev1_energy).has_state() || id(ha_dev2_power).has_state() ||
               id(ha_dev2_energy).has_state() || id(ha_dev3_power).has_state() || id(ha_dev3_energy).has_state() ||
               id(ha_dev4_power).has_state() || id(ha_dev4_energy).has_state() || id(ha_dev5_power).has_state() ||
               id(ha_dev5_energy).has_state())) {
            id(house_update).execute(1, V(id(ha_dev1_power), B_dev1_power), V(id(ha_dev1_energy), B_dev1_energy));
            id(house_update).execute(2, V(id(ha_dev2_power), B_dev2_power), V(id(ha_dev2_energy), B_dev2_energy));
            id(house_update).execute(3, V(id(ha_dev3_power), B_dev3_power), V(id(ha_dev3_energy), B_dev3_energy));
            id(house_update).execute(4, V(id(ha_dev4_power), B_dev4_power), V(id(ha_dev4_energy), B_dev4_energy));
            id(house_update).execute(5, V(id(ha_dev5_power), B_dev5_power), V(id(ha_dev5_energy), B_dev5_energy));
          }
          // 21 Hausnetz
          if ((d & (1u << 21)) &&
              (ready || id(ha_site_pv_power).has_state() || id(ha_site_battery_power).has_state() || id(ha_site_grid_power).has_state() ||
               id(ha_home_power).has_state() || id(ha_site_battery_soc).has_state() || id(ha_tariff_grid).has_state() ||
               id(ha_tariff_home).has_state() || id(ha_tariff_feedin).has_state() || id(ha_wb1_power).has_state() ||
               id(ha_wb2_power).has_state() || id(ha_hp_power).has_state() || id(ha_dev5_power).has_state() ||
               id(ha_home_energy_today).has_state() || id(ha_solcast_remaining).has_state())) {
            {
              const float bp = V(id(ha_site_battery_power), B_site_battery_power), gp = V(id(ha_site_grid_power), B_site_grid_power), home = V(id(ha_home_power), B_home_power);
              float lp = NAN;
              if (da(15))
                lp = add(lp, mul(V(id(ha_wb1_power), B_wb1_power), 1000.0f));
              if (da(16))
                lp = add(lp, mul(V(id(ha_wb2_power), B_wb2_power), 1000.0f));
              id(house_flow).execute(V(id(ha_site_pv_power), B_site_pv_power), pos(bp), pos(gp), home, lp, pos(neg(bp)), pos(neg(gp)), V(id(ha_site_battery_soc), B_site_battery_soc),
                                     V(id(ha_solcast_remaining), B_solcast_remaining), V(id(ha_tariff_grid), B_tariff_grid), V(id(ha_tariff_home), B_tariff_home), V(id(ha_tariff_feedin), B_tariff_feedin));
              id(ov_house).execute(add(home, lp), V(id(ha_home_energy_today), B_home_energy_today));
              const float hp = da(17) ? mul(V(id(ha_hp_power), B_hp_power), 1000.0f) : NAN;
              // Sonstige = Verbrauch ohne Waermepumpe [A]
              id(ov_consumer).execute(1, std::isnan(home) ? home : add(home, neg(hp)),
                                      "Basis " + num(mul(V(id(ha_dev5_power), B_dev5_power), 0.001f), "%.1f", "--,-"));
            }
          }
          // 22 Netz
          if ((d & (1u << 22)) &&
              (ready || id(ha_grid_power).has_state() || id(ha_grid_freq).has_state() || id(ha_grid_n_current).has_state() ||
               id(ha_grid_l1_voltage).has_state() || id(ha_grid_l1_current).has_state() || id(ha_grid_l1_power).has_state() ||
               id(ha_grid_l1_apparent).has_state() || id(ha_grid_l1_pf).has_state() || id(ha_grid_l2_voltage).has_state() ||
               id(ha_grid_l2_current).has_state() || id(ha_grid_l2_power).has_state() || id(ha_grid_l2_apparent).has_state() ||
               id(ha_grid_l2_pf).has_state() || id(ha_grid_l3_voltage).has_state() || id(ha_grid_l3_current).has_state() ||
               id(ha_grid_l3_power).has_state() || id(ha_grid_l3_apparent).has_state() || id(ha_grid_l3_pf).has_state())) {
            id(grid_update).execute(V(id(ha_grid_power), B_grid_power), V(id(ha_grid_freq), B_grid_freq), V(id(ha_grid_n_current), B_grid_n_current));
            id(ov_grid).execute(V(id(ha_grid_power), B_grid_power));
            id(grid_phase).execute(0, V(id(ha_grid_l1_voltage), B_grid_l1_voltage), V(id(ha_grid_l1_current), B_grid_l1_current), V(id(ha_grid_l1_power), B_grid_l1_power), V(id(ha_grid_l1_apparent), B_grid_l1_apparent), V(id(ha_grid_l1_pf), B_grid_l1_pf));
            id(grid_phase).execute(1, V(id(ha_grid_l2_voltage), B_grid_l2_voltage), V(id(ha_grid_l2_current), B_grid_l2_current), V(id(ha_grid_l2_power), B_grid_l2_power), V(id(ha_grid_l2_apparent), B_grid_l2_apparent), V(id(ha_grid_l2_pf), B_grid_l2_pf));
            id(grid_phase).execute(2, V(id(ha_grid_l3_voltage), B_grid_l3_voltage), V(id(ha_grid_l3_current), B_grid_l3_current), V(id(ha_grid_l3_power), B_grid_l3_power), V(id(ha_grid_l3_apparent), B_grid_l3_apparent), V(id(ha_grid_l3_pf), B_grid_l3_pf));
          }
          // 23 Zaehler
          if ((d & (1u << 23)) &&
              (ready || id(ha_meter0_total).has_state() || id(ha_meter0_today).has_state() || id(ha_meter1_total).has_state() ||
               id(ha_meter1_today).has_state() || id(ha_meter2_total).has_state() || id(ha_meter2_today).has_state() ||
               id(ha_meter3_total).has_state() || id(ha_meter3_today).has_state() || id(ha_meter4_total).has_state() ||
               id(ha_meter4_today).has_state() || id(ha_meter_pv_power).has_state() || id(ha_meter_house_power).has_state())) {
            id(grid_meter).execute(0, V(id(ha_meter0_total), B_meter0_total), V(id(ha_meter0_today), B_meter0_today));
            id(grid_meter).execute(1, V(id(ha_meter1_total), B_meter1_total), V(id(ha_meter1_today), B_meter1_today));
            id(grid_meter).execute(2, V(id(ha_meter2_total), B_meter2_total), V(id(ha_meter2_today), B_meter2_today));
            id(grid_meter).execute(3, V(id(ha_meter3_total), B_meter3_total), V(id(ha_meter3_today), B_meter3_today));
            id(grid_meter).execute(4, V(id(ha_meter4_total), B_meter4_total), V(id(ha_meter4_today), B_meter4_today));
            if (da(18))
              id(ov_meter).execute(0, V(id(ha_meter_pv_power), B_meter_pv_power), V(id(ha_meter2_today), B_meter2_today));
            if (da(19))
              id(ov_meter).execute(1, V(id(ha_meter_house_power), B_meter_house_power), V(id(ha_meter4_today), B_meter4_today));
          }
          // 24 Netzvorgaben
          if ((d & (1u << 24)) &&
              (ready || id(ha_rule_limit).has_state() || id(ha_spot_price).has_state() || id(ha_neg_quarters).has_state() ||
               id(ha_rule_neg_paid).has_state() || id(ha_p14a_active).has_state() || id(ha_p14a_kw).has_state() ||
               id(ha_rule_smart_meter).has_state())) {
            id(grid_rules).execute(id(ha_rule_limit).state, V(id(ha_spot_price), B_spot_price), I(V(id(ha_neg_quarters), B_neg_quarters), -1), id(ha_rule_neg_paid).state, id(ha_p14a_active).state, V(id(ha_p14a_kw), B_p14a_kw),
                                   id(ha_rule_smart_meter).state);
          }
          // 25 Tageswerte
          if ((d & (1u << 25)) &&
              (ready || id(ha_meter0_today).has_state() || id(ha_meter1_today).has_state() || id(ha_meter2_today).has_state() ||
               id(ha_meter3_today).has_state() || id(ha_meter4_today).has_state() || id(ha_pv_energy_today).has_state() ||
               id(ha_home_energy_today).has_state() || id(ha_selfuse_energy_today).has_state() || id(ha_solcast_remaining).has_state())) {
            {
              // Volleinspeisung nur mit PV-Zaehler; ohne Hauszaehler ist der
              // Ueberschuss die Einspeisung am Hausanschluss ohne die Volleinspeisung [A]
              const float full = da(18) ? V(id(ha_meter2_today), B_meter2_today) : 0.0f;
              const float feed = V(id(ha_meter1_today), B_meter1_today);
              const float surplus = da(19) ? V(id(ha_meter4_today), B_meter4_today) : sub(feed, full);
              id(ov_totals).execute(V(id(ha_pv_energy_today), B_pv_energy_today), V(id(ha_home_energy_today), B_home_energy_today), feed, V(id(ha_meter0_today), B_meter0_today), full, surplus, V(id(ha_solcast_remaining), B_solcast_remaining));
              id(money_update).execute(full, surplus, V(id(ha_selfuse_energy_today), B_selfuse_energy_today), V(id(ha_meter0_today), B_meter0_today));
            }
          }
          // 26 Prognose
          if ((d & (1u << 26)) &&
              (ready || id(ha_solcast_today).has_state() || id(ha_solcast_today_p10).has_state() || id(ha_solcast_today_p90).has_state() ||
               id(ha_solcast_remaining).has_state() || id(ha_solcast_power_now).has_state() || id(ha_solcast_next_hour).has_state() ||
               id(ha_solcast_peak).has_state() || id(ha_solcast_peak_time).has_state() || id(ha_solcast_last_poll).has_state() ||
               id(ha_solcast_api_used).has_state() || id(ha_solcast_api_limit).has_state() || id(ha_solcast_d2).has_state() ||
               id(ha_solcast_d2_p10).has_state() || id(ha_solcast_d2_p90).has_state() || id(ha_solcast_d3).has_state() ||
               id(ha_solcast_d3_p10).has_state() || id(ha_solcast_d3_p90).has_state() || id(ha_solcast_d4).has_state() ||
               id(ha_solcast_d4_p10).has_state() || id(ha_solcast_d4_p90).has_state() || id(ha_solcast_d5).has_state() ||
               id(ha_solcast_d5_p10).has_state() || id(ha_solcast_d5_p90).has_state() || id(ha_solcast_d6).has_state() ||
               id(ha_solcast_d6_p10).has_state() || id(ha_solcast_d6_p90).has_state() || id(ha_solcast_d7).has_state() ||
               id(ha_solcast_d7_p10).has_state() || id(ha_solcast_d7_p90).has_state())) {
            {
              id(fc_today).execute(V(id(ha_solcast_today), B_solcast_today), V(id(ha_solcast_today_p10), B_solcast_today), V(id(ha_solcast_today_p90), B_solcast_today), V(id(ha_solcast_remaining), B_solcast_remaining),
                                   V(id(ha_solcast_power_now), B_solcast_power_now), V(id(ha_solcast_next_hour), B_solcast_next_hour), V(id(ha_solcast_peak), B_solcast_peak), when(T(id(ha_solcast_peak_time), B_solcast_peak_time), false),
                                   when(T(id(ha_solcast_last_poll), B_solcast_last_poll), false), I(V(id(ha_solcast_api_used), B_solcast_api_used), -1), I(V(id(ha_solcast_api_limit), B_solcast_api_limit), -1));
              const float p50[7] = {V(id(ha_solcast_today), B_solcast_today), V(id(ha_solcast_d2), B_solcast_d2), V(id(ha_solcast_d3), B_solcast_d3), V(id(ha_solcast_d4), B_solcast_d4), V(id(ha_solcast_d5), B_solcast_d5), V(id(ha_solcast_d6), B_solcast_d6), V(id(ha_solcast_d7), B_solcast_d7)};
              const float p10[7] = {V(id(ha_solcast_today_p10), B_solcast_today), V(id(ha_solcast_d2_p10), B_solcast_d2), V(id(ha_solcast_d3_p10), B_solcast_d3), V(id(ha_solcast_d4_p10), B_solcast_d4), V(id(ha_solcast_d5_p10), B_solcast_d5), V(id(ha_solcast_d6_p10), B_solcast_d6), V(id(ha_solcast_d7_p10), B_solcast_d7)};
              const float p90[7] = {V(id(ha_solcast_today_p90), B_solcast_today), V(id(ha_solcast_d2_p90), B_solcast_d2), V(id(ha_solcast_d3_p90), B_solcast_d3), V(id(ha_solcast_d4_p90), B_solcast_d4), V(id(ha_solcast_d5_p90), B_solcast_d5), V(id(ha_solcast_d6_p90), B_solcast_d6), V(id(ha_solcast_d7_p90), B_solcast_d7)};
              for (int d = 0; d < 7; d++)
                id(fc_day).execute(d, id(ha_day_label)(d, jetzt), id(ha_wx_cond)[d], p50[d], p10[d], p90[d]);
            }
          }
          // 27 Wetter jetzt
          if ((d & (1u << 27)) &&
              (ready || id(ha_weather).has_state() || id(ha_wx_temp).has_state() || id(ha_wx_humidity).has_state() ||
               id(ha_wx_pressure).has_state() || id(ha_wx_wind).has_state() || id(ha_wx_bearing).has_state() ||
               id(ha_wx_sun).has_state() || id(ha_sun_rising).has_state() || id(ha_sun_setting).has_state())) {
            {
              const auto &t = id(ha_wx_today);
              const auto &h = id(ha_wx_hour0);
              id(wx_now).execute(T(id(ha_weather), B_weather), V(id(ha_wx_temp), B_weather), t[0], t[1], V(id(ha_wx_humidity), B_weather), V(id(ha_wx_pressure), B_weather), V(id(ha_wx_wind), B_weather), V(id(ha_wx_bearing), B_weather), h[0], h[1],
                                 t[2], V(id(ha_wx_sun), B_wx_sun), when(T(id(ha_sun_rising), B_sun), false), when(T(id(ha_sun_setting), B_sun), false), id(ha_wx_stamp));
            }
          }
          // 28 Wetterwarnung
          if ((d & (1u << 28)) &&
              (ready || id(ha_warn_level).has_state() || id(ha_warn_text).has_state())) {
            id(wx_warning).execute(I(V(id(ha_warn_level), B_warn_level), 0), T(id(ha_warn_text), B_warn_level));
          }
  # Abrufe: 20 s nach dem Verbinden die Prognosen, 30 s danach die
  # Statistik; dann Prognosen alle 30 min, Statistik zu jeder neuen Stunde
  # ab Minute 2 (Home Assistant schreibt die Stundenstatistik kurz nach der
  # vollen Stunde). Beim Trennen beginnt alles von vorn.
  - interval: 10s
    then:
      - lambda: |-
          static bool war = false;
          static uint32_t seit = 0, fc_zuletzt = 0;
          static int stat_schluessel = -1;
          const bool ist = api::global_api_server != nullptr && api::global_api_server->is_connected_with_state_subscription();
          if (ist != war) {
            war = ist;
            seit = millis();
            fc_zuletzt = 0;
            stat_schluessel = -1;
          }
          const bool bereit = ist && millis() - seit >= 10000;
          if (bereit != id(ha_ready)) {
            id(ha_ready) = bereit;
            id(ha_dirty) = 0xFFFFFFFFu;
          }
          if (!ist || millis() - seit < 20000)
            return;
          if (fc_zuletzt == 0 || millis() - fc_zuletzt >= 30u * 60u * 1000u) {
            fc_zuletzt = millis() | 1u;
            id(ha_fetch_fc).execute();
          }
          if (millis() - seit < 30000)
            return;
          const ESPTime t = id(dash_time).now();
          const int schluessel = t.is_valid() ? t.day_of_year * 24 + t.hour : 0;
          if (schluessel != stat_schluessel && (stat_schluessel < 0 || !t.is_valid() || t.minute >= 2)) {
            stat_schluessel = schluessel;
            id(ha_fetch_stats).execute();
          }
