script:
  # Prognosen: Wetter stuendlich und taeglich, Solcast-Halbstunden. Die drei
  # Aktionen laufen nebeneinander, jede Antwort kommt fuer sich.
  - id: ha_fetch_fc
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${ha_weather}
            type: hourly
          capture_response: true
          response_template: |-
            {%- set ns = namespace(l=[]) -%}
            {%- for x in response['${ha_weather}'].forecast -%}
            {%- if as_datetime(x.datetime) > now() -%}
            {%- set ns.l = ns.l + [x] -%}
            {%- endif -%}
            {%- endfor -%}
            {%- set o = namespace(h=[], c=[], t=[], r=[], p=[]) -%}
            {%- for k in range(12) -%}
            {%- set a = ns.l[2 * k] if ns.l | length > 2 * k else {} -%}
            {%- set b = ns.l[2 * k + 1] if ns.l | length > 2 * k + 1 else {} -%}
            {%- set ra = a.get('precipitation') -%}
            {%- set rb = b.get('precipitation') -%}
            {%- set pp = [a.get('precipitation_probability'), b.get('precipitation_probability')] | select('number') | list -%}
            {%- set o.h = o.h + [as_local(as_datetime(a.datetime)).hour if a.get('datetime') else -1] -%}
            {%- set o.c = o.c + [a.get('condition') or ''] -%}
            {%- set o.t = o.t + [((a.get('temperature')) | round(1)) if (a.get('temperature')) is number else 'nan'] -%}
            {%- set o.r = o.r + [(((ra if ra is number else 0) + (rb if rb is number else 0)) | round(1)) if (ra is number or rb is number) else 'nan'] -%}
            {%- set o.p = o.p + [(pp | max) if pp else 'nan'] -%}
            {%- endfor -%}
            {%- set f = ns.l[0] if ns.l else {} -%}
            {{ {'h': o.h | join(','), 'c': o.c | join(','), 't': o.t | join(','), 'r': o.r | join(','), 'p': o.p | join(','), 'g': (((f.get('wind_gust_speed')) | round(1)) if (f.get('wind_gust_speed')) is number else 'nan') | string, 'w': (((f.get('cloud_coverage')) | round(0)) if (f.get('cloud_coverage')) is number else 'nan') | string} | tojson }}
          on_success:
            - lambda: |-
                const bool txt = response["response"].is<const char *>();
                JsonDocument doc = txt ? json::parse_json(std::string(response["response"].as<const char *>())) : JsonDocument();
                JsonObjectConst r = txt ? doc.as<JsonObjectConst>() : response["response"].as<JsonObjectConst>();
                if (r.isNull()) {
                  ESP_LOGW("ha", "weather.get_forecasts hourly: Antwort ohne Inhalt");
                  return;
                }
                auto S = [&r](const char *k) -> std::string {
                  const char *v = r[k].as<const char *>();
                  return v ? std::string(v) : std::string();
                };
                auto &L = id(ha_split);
                auto F = [](const std::vector<std::string> &v, size_t i) -> float {
                  return (i < v.size() && !v[i].empty()) ? strtof(v[i].c_str(), nullptr) : NAN;
                };
                const auto h = L(S("h")), c = L(S("c")), t = L(S("t")), rr = L(S("r")), p = L(S("p"));
                for (int k = 0; k < 12; k++) {
                  const int hour = (size_t) k < h.size() ? atoi(h[k].c_str()) : -1;
                  if (hour < 0)
                    continue;
                  id(wx_hour).execute(k, hour, (size_t) k < c.size() ? c[k] : std::string(), F(t, k), F(rr, k), F(p, k));
                }
                id(ha_wx_hour0)[0] = strtof(S("g").c_str(), nullptr);
                id(ha_wx_hour0)[1] = strtof(S("w").c_str(), nullptr);
                id(ha_dirty) |= 1u << 27;
          on_error:
            - lambda: 'ESP_LOGW("ha", "weather.get_forecasts hourly: %s", error.c_str());'
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${ha_weather}
            type: daily
          capture_response: true
          response_template: |-
            {%- set o = namespace(d=[], c=[], hi=[], lo=[], r=[], p=[], s=[], w=[]) -%}
            {%- for x in response['${ha_weather}'].forecast -%}
            {%- set d = (as_local(as_datetime(x.datetime)).date() - now().date()).days -%}
            {%- if 0 <= d < 7 -%}
            {%- set o.d = o.d + [d] -%}
            {%- set o.c = o.c + [x.get('condition') or ''] -%}
            {%- set o.hi = o.hi + [((x.get('temperature')) | round(1)) if (x.get('temperature')) is number else 'nan'] -%}
            {%- set o.lo = o.lo + [((x.get('templow')) | round(1)) if (x.get('templow')) is number else 'nan'] -%}
            {%- set o.r = o.r + [((x.get('precipitation')) | round(1)) if (x.get('precipitation')) is number else 'nan'] -%}
            {%- set o.p = o.p + [((x.get('precipitation_probability')) | round(0)) if (x.get('precipitation_probability')) is number else 'nan'] -%}
            {%- set o.s = o.s + [((x.get('sun_duration')) | round(0)) if (x.get('sun_duration')) is number else 'nan'] -%}
            {%- set o.w = o.w + [((x.get('wind_speed')) | round(0)) if (x.get('wind_speed')) is number else 'nan'] -%}
            {%- endif -%}
            {%- endfor -%}
            {{ {'d': o.d | join(','), 'c': o.c | join(','), 'hi': o.hi | join(','), 'lo': o.lo | join(','), 'r': o.r | join(','), 'p': o.p | join(','), 's': o.s | join(','), 'w': o.w | join(',')} | tojson }}
          on_success:
            - lambda: |-
                const bool txt = response["response"].is<const char *>();
                JsonDocument doc = txt ? json::parse_json(std::string(response["response"].as<const char *>())) : JsonDocument();
                JsonObjectConst r = txt ? doc.as<JsonObjectConst>() : response["response"].as<JsonObjectConst>();
                if (r.isNull()) {
                  ESP_LOGW("ha", "weather.get_forecasts daily: Antwort ohne Inhalt");
                  return;
                }
                auto S = [&r](const char *k) -> std::string {
                  const char *v = r[k].as<const char *>();
                  return v ? std::string(v) : std::string();
                };
                auto &L = id(ha_split);
                auto F = [](const std::vector<std::string> &v, size_t i) -> float {
                  return (i < v.size() && !v[i].empty()) ? strtof(v[i].c_str(), nullptr) : NAN;
                };
                const auto d = L(S("d")), c = L(S("c")), hi = L(S("hi")), lo = L(S("lo")), rr = L(S("r")), p = L(S("p")),
                           s = L(S("s")), w = L(S("w"));
                ESPTime jetzt = id(dash_time).now();
                for (size_t k = 0; k < d.size(); k++) {
                  const int tag = atoi(d[k].c_str());
                  if (tag < 0 || tag > 6)
                    continue;
                  const std::string lage = k < c.size() ? c[k] : std::string();
                  // sun_duration in Sekunden [A], nur mit der DWD-Option fuer Zusatzwerte
                  id(wx_day).execute(tag, id(ha_day_label)(tag, jetzt), lage, F(hi, k), F(lo, k), F(rr, k), F(p, k),
                                     F(s, k) / 3600.0f, F(w, k));
                  id(ha_wx_cond)[tag] = lage;
                  if (tag == 0)
                    id(ha_wx_today) = {F(hi, k), F(lo, k), F(rr, k)};
                }
                id(ha_wx_stamp) = jetzt.is_valid() ? jetzt.strftime("%H:%M") : std::string();
                id(ha_dirty) |= (1u << 26) | (1u << 27);
          on_error:
            - lambda: 'ESP_LOGW("ha", "weather.get_forecasts daily: %s", error.c_str());'
      # Solcast: Aktion der Integration; scheitert sie (Integration fehlt,
      # z. B. mit dem Dummy), liest ha_fetch_solcast_attr das Attribut
      - homeassistant.action:
          action: solcast_solar.query_forecast_data
          data_template:
            start_date_time: "{{ today_at('00:00').isoformat() }}"
            end_date_time: "{{ (today_at('00:00') + timedelta(days=1)).isoformat() }}"
          capture_response: true
          response_template: |-
            {%- set src = response.get('data') or [] -%}

            {%- set o = namespace(a=['nan'] * 48, b=['nan'] * 48, c=['nan'] * 48) -%}
            {%- for x in src -%}
            {%- set ps = x.get('period_start') -%}
            {%- set t = as_local(as_datetime(ps) if ps is string else ps) if ps else none -%}
            {%- if t and t.date() == now().date() -%}
            {%- set i = t.hour * 2 + t.minute // 30 -%}
            {%- set o.a = o.a[:i] + [((x.get('pv_estimate')) | round(2)) if (x.get('pv_estimate')) is number else 'nan'] + o.a[i + 1:] -%}
            {%- set o.b = o.b[:i] + [((x.get('pv_estimate10')) | round(2)) if (x.get('pv_estimate10')) is number else 'nan'] + o.b[i + 1:] -%}
            {%- set o.c = o.c[:i] + [((x.get('pv_estimate90')) | round(2)) if (x.get('pv_estimate90')) is number else 'nan'] + o.c[i + 1:] -%}
            {%- endif -%}
            {%- endfor -%}
            {{ {'a': o.a | join(','), 'b': o.b | join(','), 'c': o.c | join(',')} | tojson }}
          on_success:
            - lambda: |-
                const bool txt = response["response"].is<const char *>();
                JsonDocument doc = txt ? json::parse_json(std::string(response["response"].as<const char *>())) : JsonDocument();
                JsonObjectConst r = txt ? doc.as<JsonObjectConst>() : response["response"].as<JsonObjectConst>();
                if (r.isNull()) {
                  ESP_LOGW("ha", "solcast_solar.query_forecast_data: Antwort ohne Inhalt");
                  return;
                }
                auto S = [&r](const char *k) -> std::string {
                  const char *v = r[k].as<const char *>();
                  return v ? std::string(v) : std::string();
                };
                auto &L = id(ha_split);
                auto F = [](const std::vector<std::string> &v, size_t i) -> float {
                  return (i < v.size() && !v[i].empty()) ? strtof(v[i].c_str(), nullptr) : NAN;
                };
                id(fc_slots).execute(S("a"), S("b"), S("c"));
                // Tagesreihe Prognose (06..22 Uhr, kWh je Stunde) aus den Halbstunden
                const auto &p = id(fc_p50);
                char buf[128];
                int n = 0;
                for (int h = 6; h < 22 && n >= 0 && n < (int) sizeof(buf); h++) {
                  float v = (p[2 * h] + p[2 * h + 1]) * 0.5f;
                  v = std::isfinite(v) ? std::clamp(v, 0.0f, 999.0f) : 0.0f;
                  n += snprintf(buf + n, sizeof(buf) - n, h > 6 ? ",%.2f" : "%.2f", v);
                }
                if (id(forecast_curve).state != buf)
                  id(forecast_curve).make_call().set_value(buf).perform();
          on_error:
            - lambda: 'ESP_LOGD("ha", "solcast_solar.query_forecast_data: %s -- lese detailedForecast", error.c_str());'
            - script.execute: ha_fetch_solcast_attr

  # Ersatzweg fuer die Solcast-Halbstunden: das Attribut detailedForecast der
  # Tagesprognose. Die Vorlage braucht irgendeine Aktion mit Antwort --
  # weather.get_forecasts ist sicher da, ihre Antwort bleibt ungenutzt.
  - id: ha_fetch_solcast_attr
    then:
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${ha_weather}
            type: daily
          capture_response: true
          response_template: |-
            {%- set src = state_attr('${ha_solcast_today}', 'detailedForecast') or [] -%}

            {%- set o = namespace(a=['nan'] * 48, b=['nan'] * 48, c=['nan'] * 48) -%}
            {%- for x in src -%}
            {%- set ps = x.get('period_start') -%}
            {%- set t = as_local(as_datetime(ps) if ps is string else ps) if ps else none -%}
            {%- if t and t.date() == now().date() -%}
            {%- set i = t.hour * 2 + t.minute // 30 -%}
            {%- set o.a = o.a[:i] + [((x.get('pv_estimate')) | round(2)) if (x.get('pv_estimate')) is number else 'nan'] + o.a[i + 1:] -%}
            {%- set o.b = o.b[:i] + [((x.get('pv_estimate10')) | round(2)) if (x.get('pv_estimate10')) is number else 'nan'] + o.b[i + 1:] -%}
            {%- set o.c = o.c[:i] + [((x.get('pv_estimate90')) | round(2)) if (x.get('pv_estimate90')) is number else 'nan'] + o.c[i + 1:] -%}
            {%- endif -%}
            {%- endfor -%}
            {{ {'a': o.a | join(','), 'b': o.b | join(','), 'c': o.c | join(',')} | tojson }}
          on_success:
            - lambda: |-
                const bool txt = response["response"].is<const char *>();
                JsonDocument doc = txt ? json::parse_json(std::string(response["response"].as<const char *>())) : JsonDocument();
                JsonObjectConst r = txt ? doc.as<JsonObjectConst>() : response["response"].as<JsonObjectConst>();
                if (r.isNull()) {
                  ESP_LOGW("ha", "Solcast detailedForecast: Antwort ohne Inhalt");
                  return;
                }
                auto S = [&r](const char *k) -> std::string {
                  const char *v = r[k].as<const char *>();
                  return v ? std::string(v) : std::string();
                };
                auto &L = id(ha_split);
                auto F = [](const std::vector<std::string> &v, size_t i) -> float {
                  return (i < v.size() && !v[i].empty()) ? strtof(v[i].c_str(), nullptr) : NAN;
                };
                id(fc_slots).execute(S("a"), S("b"), S("c"));
                // Tagesreihe Prognose (06..22 Uhr, kWh je Stunde) aus den Halbstunden
                const auto &p = id(fc_p50);
                char buf[128];
                int n = 0;
                for (int h = 6; h < 22 && n >= 0 && n < (int) sizeof(buf); h++) {
                  float v = (p[2 * h] + p[2 * h + 1]) * 0.5f;
                  v = std::isfinite(v) ? std::clamp(v, 0.0f, 999.0f) : 0.0f;
                  n += snprintf(buf + n, sizeof(buf) - n, h > 6 ? ",%.2f" : "%.2f", v);
                }
                if (id(forecast_curve).state != buf)
                  id(forecast_curve).make_call().set_value(buf).perform();
          on_error:
            - lambda: 'ESP_LOGW("ha", "Solcast detailedForecast: %s", error.c_str());'

  # Statistik (recorder.get_statistics, ab Home Assistant 2025.6): Woche und
  # Monat je Tag, Jahr je Monat; dazu die letzten 24 Stunden fuer die Seite
  # Haus und die Tagesreihe Erzeugung. Zaehlerstaende mit state_class
  # total_increasing, types change = Zuwachs je Platz in kWh.
  - id: ha_fetch_stats
    then:
      # Woche
      - homeassistant.action:
          action: recorder.get_statistics
          data:
            period: day
          data_template:
            statistic_ids: "{{ ['${ha_pv_energy_total}', '${ha_home_energy_total}', '${ha_meter0_total}', '${ha_meter1_total}', '${ha_meter2_total}'] }}"
            start_time: "{{ (today_at('00:00') - timedelta(days=now().weekday())).isoformat() }}"
            types: "{{ ['change'] }}"
            units: "{{ {'energy': 'kWh'} }}"
          capture_response: true
          response_template: |-
            {%- set t0 = today_at('00:00') - timedelta(days=now().weekday()) -%}
            {%- set n = 7 -%}
            {%- set o_p = namespace(l=[0] * n) -%}
            {%- for e in response.statistics.get('${ha_pv_energy_total}', []) -%}
            {%- set s = as_local(as_datetime(e.start) if e.start is string else e.start) -%}
            {%- set i = (s.date() - t0.date()).days -%}
            {%- if 0 <= i < n and e.change is number -%}
            {%- set o_p.l = o_p.l[:i] + [e.change | round(2)] + o_p.l[i + 1:] -%}
            {%- endif -%}
            {%- endfor -%}
            {%- set o_c = namespace(l=[0] * n) -%}
            {%- for e in response.statistics.get('${ha_home_energy_total}', []) -%}
            {%- set s = as_local(as_datetime(e.start) if e.start is string else e.start) -%}
            {%- set i = (s.date() - t0.date()).days -%}
            {%- if 0 <= i < n and e.change is number -%}
            {%- set o_c.l = o_c.l[:i] + [e.change | round(2)] + o_c.l[i + 1:] -%}
            {%- endif -%}
            {%- endfor -%}
            {%- set o_i = namespace(l=[0] * n) -%}
            {%- for e in response.statistics.get('${ha_meter0_total}', []) -%}
            {%- set s = as_local(as_datetime(e.start) if e.start is string else e.start) -%}
            {%- set i = (s.date() - t0.date()).days -%}
            {%- if 0 <= i < n and e.change is number -%}
            {%- set o_i.l = o_i.l[:i] + [e.change | round(2)] + o_i.l[i + 1:] -%}
            {%- endif -%}
            {%- endfor -%}
            {%- set o_e = namespace(l=[0] * n) -%}
            {%- for e in response.statistics.get('${ha_meter1_total}', []) -%}
            {%- set s = as_local(as_datetime(e.start) if e.start is string else e.start) -%}
            {%- set i = (s.date() - t0.date()).days -%}
            {%- if 0 <= i < n and e.change is number -%}
            {%- set o_e.l = o_e.l[:i] + [e.change | round(2)] + o_e.l[i + 1:] -%}
            {%- endif -%}
            {%- endfor -%}
            {%- set o_f = namespace(l=[0] * n) -%}
            {%- for e in response.statistics.get('${ha_meter2_total}', []) -%}
