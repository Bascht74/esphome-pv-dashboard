##############################################################################
# Package: Seite 4 -- Wallboxen
#
# Aufbau nach dem Vorbild von evcc (Wunsch des Nutzers, 24.09.2026), dessen
# Ladepunkt-Karte in Version 0.316.0 so gegliedert ist: Kopf mit Name und
# Modus-Schalter (Aus / Smart / Schnell), darunter die Sitzungswerte
# (Leistung mit Phasen, Geladen, Zusatzwert wie Sonne oder Ladedauer),
# Trennlinie, dann das Fahrzeug mit Status, Ladestandsbalken samt
# Limit-Marke und der Zeile Ladestand / Ladeplan / Ladelimit. Uebernommen
# sind Gliederung, Beschriftungen und das evcc-Gruen (col_evcc). Die Farben
# der Flaechen und die Einheitenregel (Einheit unter dem Wert, docs/01)
# bleiben die des Dashboards. Unten eine Kachel mit den Monatswerten, wie
# sie evcc unter "Ladevorgaenge" fuehrt.
#
# Zwei Skripte gehoeren dazu; kuenftige Sensoren (evcc ueber Home
# Assistant oder MQTT) rufen nur diese auf, bis dahin stehen Striche:
#   wallbox_update  eine Ladepunkt-Karte
#   wallbox_month   die Monatskachel
#
# Flaeche x 4..1276, y 84..736. Zwei Karten je 632 x 512 (x 4 und 644,
# y 84), darunter die Monatskachel 1272 x 132 (y 604). Karte innen
# 610 x 490:
#   Kopf          0..36   Symbol f_icon, Name f_bar (29), Schalter 300 x 36
#   Sitzung      70..168  vier Spalten je 145, Abstand 10: Beschriftung
#                         70..90 (f_text_s), Wert 94..133 (f_val_xl),
#                         Einheit 135..152 (f_unit), Phasen 162..168
#   Linie       196
#   Fahrzeug    222..244  Name (f_text 22), Status 248..268 (f_text_s)
#   Balken      294..334  (40), Limit-Marke 288..340
#   Fahrzeug-
#   werte       366..448  drei Spalten je 190, Abstand 20, wie die Sitzung
#   -> Reserve 42
# Monatskachel innen 1250 x 110: Titel 0..17, vier Spalten je 305,
# Beschriftung 26..46, Wert 50..89, Einheit 91..108 -> Reserve 2.
##############################################################################

##############################################################################
# Standardbeschriftungen (Demo-Anlage)
#
# Dieselben zwei Namen wie im Schema der Uebersicht. Der Standard steht
# deshalb doppelt -- auch in .pv-dashboard_page_overview.yaml. Beide Stellen
# muessen gleich lauten; ein Wert aus .pv-dashboard_anlage.yaml sticht
# ohnehin beide. Laufen die Pakete auseinander, gewinnt stillschweigend
# dieses hier (spaeter im packages-Block von .pv-dashboard_ui.yaml), wie
# bei den Speichernamen (docs/01).
##############################################################################

substitutions:
  name_wb_1: "Wallbox 1"       # 100 von 266 (f_bar, gemessen)
  name_wb_2: "Wallbox 2"       # 100 von 266

script:
  # ---------------------------------------------------------------------
  # Eine Ladepunkt-Karte. Die Namen folgen der evcc-API (Ladepunkt):
  #   wb        0..1 = Wallbox 1..2 (name_wb_1..2)
  #   mode      "off" / "smart" / "now"; aeltere evcc-Versionen melden
  #             "pv" und "minpv", die hier wie "smart" leuchten; sonst
  #             leuchtet keiner
  #   charging  true = Ladevorgang aktiv (Blitz, Phasen gruen)
  #   power     Ladeleistung in kW
  #   phases    aktive Phasen 0..3
  #   energy    geladene Energie der Sitzung in kWh
  #   solar     Sonnenanteil der Sitzung in %
  #   minutes   Ladedauer der Sitzung in Minuten, < 0 = keine
  #   vehicle   Fahrzeugname, "" = keins verbunden
  #   status    Statuszeile, frei, z. B. "Ladevorgang aktiv …"
  #   soc       Ladestand des Fahrzeugs in %
  #   range     Reichweite in km
  #   limit     Ladelimit in %
  #   plan      naechster Ladeplan als Text, z. B. "Mo 07:00"; "" = keiner
  #   NAN = kein Wert (Striche)
  # ---------------------------------------------------------------------
  - id: wallbox_update
    parameters:
      wb: int
      mode: string
      charging: bool
      power: float
      phases: int
      energy: float
      solar: float
      minutes: int
      vehicle: string
      status: string
      soc: float
      range: float
      limit: float
      plan: string
    then:
      - lambda: |-
          id(data_seen)[2] = millis();  // Datenalter, sys_refresh
          if (wb < 0 || wb > 1)
            return;
          auto &fmt = id(fmt_num);  // Dezimalkomma, .pv-dashboard_ui.yaml
          struct Card {
            lv_obj_t *seg[3], *seg_lbl[3], *bolt, *power, *ph[3], *energy, *solar, *dur,
                     *vehicle, *status, *bar_limit, *bar_soc, *marker, *soc, *soc_sub, *plan,
                     *plan_sub, *limit;
          };
          const Card cards[2] = {
            {{id(wb1_seg0), id(wb1_seg1), id(wb1_seg2)}, {id(wb1_seg0_lbl), id(wb1_seg1_lbl), id(wb1_seg2_lbl)},
             id(wb1_bolt), id(wb1_power), {id(wb1_ph1), id(wb1_ph2), id(wb1_ph3)}, id(wb1_energy), id(wb1_solar), id(wb1_dur),
             id(wb1_vehicle), id(wb1_status), id(wb1_bar_limit), id(wb1_bar_soc), id(wb1_marker), id(wb1_soc), id(wb1_soc_sub),
             id(wb1_plan), id(wb1_plan_sub), id(wb1_limit)},
            {{id(wb2_seg0), id(wb2_seg1), id(wb2_seg2)}, {id(wb2_seg0_lbl), id(wb2_seg1_lbl), id(wb2_seg2_lbl)},
             id(wb2_bolt), id(wb2_power), {id(wb2_ph1), id(wb2_ph2), id(wb2_ph3)}, id(wb2_energy), id(wb2_solar), id(wb2_dur),
             id(wb2_vehicle), id(wb2_status), id(wb2_bar_limit), id(wb2_bar_soc), id(wb2_marker), id(wb2_soc), id(wb2_soc_sub),
             id(wb2_plan), id(wb2_plan_sub), id(wb2_limit)}
          };
          const Card &c = cards[wb];
          const lv_color_t green = lv_color_hex($col_evcc);

          // Modus-Schalter: aktiver Teil gruen gefuellt, Schrift dunkel
          int active = -1;
          if (mode == "off")
            active = 0;
          else if (mode == "smart" || mode == "pv" || mode == "minpv")
            active = 1;
          else if (mode == "now")
            active = 2;
          for (int i = 0; i < 3; i++) {
            lv_obj_set_style_bg_opa(c.seg[i], i == active ? LV_OPA_COVER : LV_OPA_TRANSP, 0);
            lv_obj_set_style_text_color(c.seg_lbl[i], i == active ? lv_color_hex($col_bg) : lv_color_hex($col_ink2), 0);
          }

          // Sitzung
          if (charging)
            lv_obj_clear_flag(c.bolt, LV_OBJ_FLAG_HIDDEN);
          else
            lv_obj_add_flag(c.bolt, LV_OBJ_FLAG_HIDDEN);
          lv_label_set_text(c.power, fmt(power, "%.1f", "--,-").c_str());
          for (int i = 0; i < 3; i++)
            lv_obj_set_style_bg_color(c.ph[i], charging && i < phases ? green : lv_color_hex($col_line), 0);
          lv_label_set_text(c.energy, fmt(energy, "%.1f", "--,-").c_str());
          lv_label_set_text(c.solar, fmt(solar, "%.0f", "--").c_str());
          if (minutes < 0)
            lv_label_set_text(c.dur, "-:--");
          else
            lv_label_set_text_fmt(c.dur, "%d:%02d", minutes / 60, minutes % 60);

          // Fahrzeug
          lv_label_set_text(c.vehicle, vehicle.empty() ? "Kein Fahrzeug" : vehicle.c_str());
          lv_label_set_text(c.status, status.empty() ? "--" : status.c_str());
          const float s = std::isnan(soc) ? 0.0f : std::clamp(soc, 0.0f, 100.0f);
          const float l = std::isnan(limit) ? 0.0f : std::clamp(limit, 0.0f, 100.0f);
          lv_bar_set_value(c.bar_soc, (int32_t) lroundf(s), LV_ANIM_OFF);
          // Hinter dem Ladestand der Rest bis zum Limit, gedaempft wie in evcc
          lv_bar_set_value(c.bar_limit, (int32_t) lroundf(std::max(s, l)), LV_ANIM_OFF);
          if (std::isnan(limit)) {
            lv_obj_add_flag(c.marker, LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_clear_flag(c.marker, LV_OBJ_FLAG_HIDDEN);
            // Marke 4 breit, mittig auf dem Limit; Balken 610 breit
            lv_obj_set_x(c.marker, (int32_t) lroundf(l / 100.0f * 606.0f));
          }
          lv_label_set_text(c.soc, fmt(soc, "%.0f", "--").c_str());
          lv_label_set_text(c.soc_sub, ("% · " + fmt(range, "%.0f", "---") + " km").c_str());
          lv_label_set_text(c.plan, plan.empty() ? "--" : plan.c_str());
          lv_label_set_text(c.plan_sub, plan.empty() ? "kein Plan" : "Abfahrt");
          lv_label_set_text(c.limit, fmt(limit, "%.0f", "--").c_str());

  # ---------------------------------------------------------------------
  # Monatskachel, beide Wallboxen zusammen (evcc "Ladevorgaenge").
  #   energy  geladene Energie im laufenden Monat in kWh
  #   solar   Sonnenanteil in %
  #   cost    Kosten in Euro
  #   price   Durchschnittspreis in ct/kWh
  #   NAN = kein Wert (Striche)
  # ---------------------------------------------------------------------
  - id: wallbox_month
    parameters:
      energy: float
      solar: float
      cost: float
      price: float
    then:
      - lambda: |-
          auto &fmt = id(fmt_num);  // Dezimalkomma, .pv-dashboard_ui.yaml
          lv_label_set_text(id(wbm_energy), fmt(energy, "%.1f", "---,-").c_str());
          lv_label_set_text(id(wbm_solar), fmt(solar, "%.0f", "--").c_str());
          lv_label_set_text(id(wbm_cost), fmt(cost, "%.2f", "--,--").c_str());
          lv_label_set_text(id(wbm_price), fmt(price, "%.1f", "--,-").c_str());

